<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>系統地圖</title>
<style>
  :root{--bg:#1C1C1E;--card:#2A2A2D;--bd:#46464B;--ink:#F2F2F4;--mut:#8D8D94;--g:#2BD46B;--gd:#1FA557;--red:#FF5D5D;--yel:#F5C542;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI','Microsoft JhengHei','PingFang TC',sans-serif;overflow:hidden;}
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab;}
  #map.drag{cursor:grabbing;}
  text{font-family:inherit;}
  /* 卡片 */
  .cd{cursor:pointer;transition:opacity .25s;}
  .cd rect.bg{fill:var(--card);stroke:var(--bd);stroke-width:1.5;transition:stroke .2s;}
  .cd.big rect.bg{fill:#303034;stroke:#5A5A60;stroke-width:1.7;}
  .cd .cap{fill:#A3A3AB;letter-spacing:.02em;}
  .cd .tt{font-weight:700;fill:var(--ink);}
  .cd .pt{fill:var(--card);stroke:var(--bd);stroke-width:1.5;transition:fill .2s,stroke .2s;}
  .cd:hover rect.bg{stroke:#77777E;}
  /* 有問題：整張卡片紅色，會一明一暗閃爍 */
  .cd.bad rect.bg{fill:#4A1C20;stroke:#FF5D5D;stroke-width:2;animation:alarm 1.6s ease-in-out infinite;}
  .cd.bad .cap{fill:#FFB3B3;}
  .cd.bad .tt{fill:#fff;}
  .cd.bad .ub{fill:rgba(255,255,255,.15);} .cd.bad .uf{fill:#FFB3B3;}
  @keyframes alarm{0%,100%{fill:#3A171A;filter:drop-shadow(0 0 0 rgba(255,93,93,0));}50%{fill:#7A2328;filter:drop-shadow(0 0 12px rgba(255,93,93,.85));}}
  @media (prefers-reduced-motion:reduce){ .cd.bad rect.bg{animation:none;fill:#5A1E22;} }
  .cd.rare{opacity:.5;}
  .cd.on rect.bg{stroke:var(--g);stroke-width:2;}
  .cd.on .pt{stroke:var(--g);fill:var(--g);}
  .cd.onbad rect.bg{stroke:#FF5D5D;stroke-width:2.4;}
  .cd.sel rect.bg{stroke:#fff;stroke-width:2.2;}
  .ub{fill:#3A3A3F;} .uf{fill:var(--g);opacity:.75;}
  .chip{font-size:9.5px;font-weight:700;}
  .bandh{font-size:24px;font-weight:800;fill:#F2F2F4;letter-spacing:.04em;}
  .bands{font-size:14px;fill:#9A9AA2;}
  .ch rect{fill:#2A2A2D;stroke:#4A4A50;stroke-width:1.2;}
  .ch text{font-size:15px;font-weight:700;fill:#ECECF0;}
  .ch .num{font-size:11px;font-weight:800;}
  .grp{font-size:11.5px;fill:#8A8A92;letter-spacing:.06em;}
  .grp.bad{fill:#E07070;}
  /* 線：點點虛線＋流動 */
  .ln{fill:none;stroke:#5E5E64;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:miter;stroke-dasharray:0 7;animation:flow 1.6s linear infinite;transition:stroke .2s,opacity .2s;}
  @keyframes flow{to{stroke-dashoffset:-14;}}
  .e.bad .ln{stroke:#9C4A4A;}
  /* 平常：所有路線都畫，細細淡淡的實線，上面一直有白色光點在跑（像交通網） */
  svg:not(.focus) .e .ln{stroke:#3C3C42;stroke-width:1.3;stroke-dasharray:none;animation:none;}
  svg:not(.focus) .e.bad .ln{stroke:#5A3434;}
  svg.hov .e:not(.hv){opacity:.25;}
  svg.hov .e.hv .ln{stroke:#B5B5BC;stroke-width:1.6;}
  .e.hv .tag{display:inline;}
  svg.focus .e:not(.on){display:none;}
  .tag{display:none;}
  .tag rect{fill:#4A4A50;} .tag text{font-size:11px;fill:#fff;font-weight:600;}
  svg.focus .cd:not(.on):not(.onbad):not(.sel){opacity:.22;}

  svg.focus .e.on .ln{opacity:1;stroke:var(--g);}
  svg.focus .e.on.up .ln{stroke:#BDBDC3;}
  svg.focus .e.on.bad .ln{stroke:var(--red);}
  svg.focus .e.on .tag{display:inline;}
  .e.on .tag rect{fill:var(--gd);} .e.on.up .tag rect{fill:#55555C;} .e.on.bad .tag rect{fill:#C93C3C;}
  .stp circle{fill:var(--g);} .stp.bad circle{fill:var(--red);} .stp text{font-size:11px;font-weight:800;fill:#10301C;} .stp.bad text{fill:#fff;}
  /* 介面 */
  .bar{position:fixed;left:14px;right:14px;top:14px;height:52px;background:#2A2A2D;border-radius:10px;display:flex;align-items:center;gap:14px;padding:0 10px 0 14px;z-index:5;}
  .bar .back{width:30px;height:30px;display:grid;place-items:center;color:#D8D8DC;}
  .bar h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap;}
  .bar .runs{font-size:13px;color:var(--mut);white-space:nowrap;}
  .srch{height:32px;width:190px;background:#1F1F21;border:1px solid #3A3A3F;border-radius:8px;color:var(--ink);font:inherit;font-size:12.5px;padding:0 10px;}
  .srch:focus{outline:none;border-color:#77777E;}
  .seg{margin-left:auto;display:flex;gap:2px;background:#1F1F21;padding:4px;border-radius:9px;overflow-x:auto;scrollbar-width:none;}
  .seg::-webkit-scrollbar{display:none;}
  .seg button{font:inherit;font-size:12.5px;color:#BDBDC3;background:none;border:none;border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .seg button i{width:6px;height:6px;border-radius:50%;background:var(--g);}
  .seg button i.bad{background:var(--red);}
  .seg button:hover{color:#fff;}
  .seg button.on{background:#fff;color:#111;font-weight:700;}
  .ver{font-size:12.5px;color:#D8D8DC;white-space:nowrap;padding:0 4px;}
  .blk{position:fixed;left:14px;bottom:14px;width:320px;background:#2A2A2D;border-radius:10px;z-index:5;overflow:hidden;}
  .blk .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .blk .hd svg{transition:transform .2s;}
  .blk.open .hd svg{transform:rotate(180deg);}
  .blk .bd{display:none;padding:0 16px 12px;max-height:56vh;overflow:auto;}
  .blk.open .bd{display:block;}
  .blk .sh{font-size:10.5px;color:var(--mut);letter-spacing:.12em;margin:10px 0 4px;}
  .blk li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 0;border-top:1px solid #38383C;font-size:12.5px;line-height:1.45;cursor:pointer;list-style:none;}
  .blk ul{margin:0;padding:0;}
  .blk li:hover b{color:var(--g);}
  .blk .lv{font-size:10px;font-weight:800;border-radius:4px;text-align:center;height:18px;line-height:18px;margin-top:1px;}
  .lv.h{background:#C93C3C;color:#fff;} .lv.m{background:#7A5A1A;color:#FFD98A;} .lv.l{background:#46464B;color:#C9C9CE;}
  .blk small{display:block;color:var(--mut);font-size:11.5px;}
  .blk .rr{grid-template-columns:1fr auto;}
  .blk .rr span:last-child{color:var(--mut);font-size:12px;}
  .det{position:fixed;right:14px;top:80px;width:320px;background:#2A2A2D;border-radius:10px;padding:16px;z-index:5;display:none;max-height:calc(100% - 100px);overflow:auto;}
  .det.show{display:block;}
  .det .x{position:absolute;right:10px;top:10px;width:26px;height:26px;border:none;border-radius:6px;background:#38383C;color:#ddd;cursor:pointer;font-size:14px;}
  .det .cp{font-size:10px;color:var(--mut);letter-spacing:.14em;}
  .det h2{margin:4px 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;}
  .det h2 i{width:8px;height:8px;border-radius:50%;}
  .det .meta{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.5;}
  .det p{font-size:12.5px;line-height:1.6;margin:0 0 10px;color:#D8D8DC;}
  .pb{margin-bottom:10px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.55;}
  .pb b{display:block;margin-bottom:2px;}
  .pb.bad{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.45);}
  .pb.lock{background:rgba(255,255,255,.04);border:1px solid #46464B;}
  .pb.rare{background:rgba(255,255,255,.04);border:1px dashed #55555C;color:#BDBDC3;}
  .rel .h{font-size:10.5px;color:var(--mut);letter-spacing:.12em;margin:12px 0 4px;display:flex;justify-content:space-between;}
  .rel a{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:6px;color:var(--ink);cursor:pointer;}
  .rel a:hover{background:#38383C;}
  .rel a small{color:var(--mut);}
  .rel a.bad{color:#FF8A8A;}
  .step{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#2A2A2D;border:1.5px solid var(--g);border-radius:10px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;z-index:6;max-width:calc(100% - 700px);min-width:380px;}
  .step.bad{border-color:var(--red);}
  .step.show{display:flex;}
  .step .t{font-size:13.5px;line-height:1.45;flex:1;}
  .step .t small{display:block;font-size:10.5px;color:var(--g);letter-spacing:.12em;font-weight:700;}
  .step.bad .t small{color:var(--red);}
  .step button{font:inherit;font-size:12px;color:#ddd;background:#38383C;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap;}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:12.5px;color:#8D8D94;background:#2A2A2D;border-radius:99px;padding:8px 16px;z-index:4;transition:opacity .3s;pointer-events:none;}
  body.busy .hint{opacity:0;}
  .zm{position:fixed;right:14px;bottom:14px;z-index:5;font:inherit;font-size:12.5px;color:#ddd;background:#2A2A2D;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;}
  @media (max-width:900px){
    .bar{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px;}
    .bar .runs,.ver,.back{display:none;}
    .srch{flex:1;width:auto;}
    .seg{margin-left:0;width:100%;}
    .blk{right:14px;width:auto;}
    .det{left:14px;right:14px;width:auto;top:auto;bottom:70px;max-height:50vh;}
    .step{left:14px;right:14px;transform:none;max-width:none;min-width:0;bottom:70px;}
    .zm{bottom:70px;}
  }
</style>
</head>
<body>
<svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
<div class="bar">
  <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></div>
  <h1>系統地圖</h1><span class="runs" id="runs"></span>
  <input class="srch" id="q" placeholder="找頁面、資料、自動化…">
  <div class="seg" id="seg"></div>
  <span class="ver">11/10 盤點</span>
</div>
<div class="det" id="det"></div>
<div class="step" id="step"><div class="t" id="stT"></div><button id="stP">上一步</button><button id="stN">下一步</button></div>
<div class="blk" id="blk"><div class="hd" id="blkH"><span id="blkT"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></div><div class="bd" id="blkB"></div></div>
<div class="hint" id="hint">滑鼠移到卡片上只看它的路線；點一下看完整路線與說明</div>
<button class="zm" id="fit">看全部</button>

    if(!L2.some(x => x[0] === a && x[1] === b)) L2.push([a, b, lab, bad]); });
  L.length = 0; L2.forEach(x => L.push(x));

    else if(!flow && !svg.classList.contains('focus')){ const sp = .045 + (e.ph % 997) / 997 * .05, cyc = e.L + 140 + (e.ph % 400); s = (t * sp + e.ph) % cyc; if(s > e.L) s = -1; if(svg.classList.contains('hov') && !e.el.classList.contains('hv')) s = -1; }
    if(s >= 0 && svg.classList.contains('focus') && !e.el.classList.contains('on')) s = -1;
    if(s < 0){ e.cm.setAttribute('opacity', 0); return; }
    e.cm.setAttribute('opacity', 1); put(e.head, e, s); put(e.halo, e, s);
  });
  requestAnimationFrame(loop);
})(0);

/* ============ 待處理／很少用（左下角面板） ============ */
const rare = N.filter(n => stOf(n) === 'rare').sort((a, b) => (daysAgo(b.last) ?? 999) - (daysAgo(a.last) ?? 999));
const blk = document.getElementById('blk');
document.getElementById('blkT').textContent = `待處理 · ${ISS.length}　很少用 · ${rare.length}`;
document.getElementById('runs').textContent = `${N.filter(n => n.col === 1 || (n.col === 3 && !n.k)).length} 個頁面 · ${N.filter(n => n.k === 'fn').length} 個自動化`;
document.getElementById('blkH').onclick = () => blk.classList.toggle('open');
document.getElementById('blkB').innerHTML = `<div class="sh">待處理</div><ul>${ISS.map(x => `<li data-is="${x.id}"><span class="lv ${x.sev}">${{ h:'高', m:'中', l:'低' }[x.sev]}</span><div><b>${x.t}</b><small>${x.s}</small></div></li>`).join('')}</ul>
  <div class="sh">很少用（最後使用）</div><ul>${rare.map(n => `<li class="rr" data-go="${n.id}"><span>${n.t}</span><span>${n.never ? '從沒用過' : agoTxt(n.last)}</span></li>`).join('')}</ul>`;
document.getElementById('blkB').addEventListener('click', ev => { const li = ev.target.closest('[data-is]'); if(!li) return; const id = li.dataset.is;
  if(id === 'NODE'){ stopFlow(); clearHL(); svg.classList.add('focus'); OLDNODE.forEach(x => byId[x].el.classList.add('onbad'));
    det.innerHTML = `<button class="x" id="dx">✕</button><div class="cp">待處理 · 中</div><h2><i style="background:#FF5D5D"></i>後端 9 支還是舊版 Node</h2><p>這些自動化程式還沒升級到 Node 22。現在都能正常運作，但 Google 停止支援舊版後，就不能再修改或重新部署。</p><div class="pb lock"><b>已是新版</b>估價推播、LINE 查詢、派單小幫手 3 支（官網名單派單、改派通知、名單聯繫計時）</div><p>建議：找一天一起升級並重新部署，不影響畫面。</p>`;
    det.classList.add('show'); document.getElementById('dx').onclick = () => { clearHL(); det.classList.remove('show'); }; fitTo(null, OLDNODE); return; }
  const it = ISS.find(x => x.id === id);
  if(it && it.info){ stopFlow(); clearHL(); det.innerHTML = `<button class="x" id="dx">✕</button><div class="cp">待處理 · ${{ h:'高', m:'中', l:'低' }[it.sev]}</div><h2>${it.t}</h2><p>${it.info}</p>`; det.classList.add('show'); document.getElementById('dx').onclick = () => det.classList.remove('show'); return; }
  pick(id); fly(byId[id]); });
// 搜尋
document.getElementById('q').oninput = ev => { const v = ev.target.value.trim(); stopFlow(); clearHL(); det.classList.remove('show'); if(!v) return;
  svg.classList.add('focus'); N.forEach(n => { if((n.t + (n.m || '') + (n.d || '')).includes(v)) lit(n.id); }); };

/* ============ 縮放／拖曳 ============ */
let vb = { x:0, y:0, w:W, h:H };
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const mob = () => innerWidth <= 900;
let firstFit = true;
function fit(){ const r = svg.getBoundingClientRect(), top = mob() ? 120 : 76;
  if(!r.width || !r.height) return;
  if(!mob() && firstFit){ firstFit = false; const aBot = Math.max(...N.filter(n => n.band === 'A').map(n => n.y + n.h)) + 30, s = Math.max((W + 20) / (r.width - 20), aBot / (r.height - top - 60)); vb = { w:r.width * s, h:r.height * s }; vb.x = W / 2 - vb.w / 2; vb.y = -top * s - 6; setVB(); return; }
  if(mob()){ const s = 600 / r.width; vb = { x:0, y:20 - top * s, w:600, h:r.height * s }; setVB(); return; }
  const s = Math.max((W + 20) / (r.width - 20), (H + 10) / (r.height - top - 70)); vb = { w:r.width * s, h:r.height * s }; vb.x = W / 2 - vb.w / 2; vb.y = -top * s + 10; setVB(); }
function animTo(to){ const f = { ...vb }, t0 = performance.now(); (function st(now){ const p = Math.min(1, (now - t0) / 550), e = 1 - Math.pow(1 - p, 3); vb = { x:f.x + (to.x - f.x) * e, y:f.y + (to.y - f.y) * e, w:f.w + (to.w - f.w) * e, h:f.h + (to.h - f.h) * e }; setVB(); if(p < 1) requestAnimationFrame(st); })(t0); }
function fitTo(fl, ids){
  const set = ids ? ids.map(i => byId[i]) : [...new Set(fl.steps.flatMap(s => s.filter(x => Array.isArray(x)).flat()))].map(i => byId[i]);
  const x0 = Math.min(...set.map(n => n.x)) - 40, x1 = Math.max(...set.map(n => n.x + n.w)) + 40, y0 = Math.min(...set.map(n => n.y)) - 50, y1 = Math.max(...set.map(n => n.y + n.h)) + 50;
  const r = svg.getBoundingClientRect(), top = mob() ? 120 : 76, s = Math.max((x1 - x0) / r.width, (y1 - y0) / (r.height - top - 90), W / r.width * .6);
  animTo({ w:r.width * s, h:r.height * s, x:(x0 + x1) / 2 - r.width * s / 2, y:y0 - top * s });
}
function fly(n){ if(n.x < vb.x || n.x + n.w > vb.x + vb.w || n.y < vb.y + 60 || n.y + n.h > vb.y + vb.h - 60) animTo({ ...vb, x:n.x + n.w / 2 - vb.w / 2, y:n.y - vb.h / 3 }); }
const toW = (cx, cy) => { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
function zoomAt(cx, cy, f){ const w = toW(cx, cy); const nw = Math.min(W * 2.5, Math.max(300, vb.w * f)); const k = nw / vb.w; vb.x = w.x - (w.x - vb.x) * k; vb.y = w.y - (w.y - vb.y) * k; vb.w = nw; vb.h *= k; setVB(); }
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(ev.deltaY * .0015)); }, { passive:false });
const ptr = new Map(); let moved = 0, last = null, pinch = 0;
svg.addEventListener('pointerdown', ev => { svg.setPointerCapture(ev.pointerId); ptr.set(ev.pointerId, [ev.clientX, ev.clientY]); moved = 0; last = [ev.clientX, ev.clientY]; if(ptr.size === 2){ const [a, b] = [...ptr.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } svg.classList.add('drag'); });
svg.addEventListener('pointermove', ev => { if(!ptr.has(ev.pointerId)) return; ptr.set(ev.pointerId, [ev.clientX, ev.clientY]);
  if(ptr.size === 2){ const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if(pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch / d); pinch = d; moved += 10; return; }
  const k = 1 / svg.getScreenCTM().a; vb.x -= (ev.clientX - last[0]) * k; vb.y -= (ev.clientY - last[1]) * k; moved += Math.abs(ev.clientX - last[0]) + Math.abs(ev.clientY - last[1]); last = [ev.clientX, ev.clientY]; setVB(); });
const up = ev => { ptr.delete(ev.pointerId); if(ptr.size < 2) pinch = 0; if(ptr.size === 1) last = [...ptr.values()][0]; if(!ptr.size) svg.classList.remove('drag'); };
svg.addEventListener('pointerup', ev => { const click = moved < 6 && ptr.size === 1; up(ev); if(!click) return;
  const hit = document.elementsFromPoint(ev.clientX, ev.clientY).map(x => x.closest && x.closest('.cd[data-id]')).find(Boolean);
  if(hit) pick(hit.dataset.id); else if(sel){ sel = null; clearHL(); det.classList.remove('show'); anim = null; } });
svg.addEventListener('pointercancel', up);
document.getElementById('fit').onclick = fit;
addEventListener('resize', () => { firstFit = true; fit(); }); fit();
</script>
