<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>財務管理系統 - 尚益資產</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1F4D3D" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="尚益財務" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#2F5FEA; --navy-hover:#4A78F5; --cream:#F3F5FB; --white:#ffffff;
    --ink:#1E2433; --muted:#8A93A6; --border:#E7EAF3;
    --green:#16A34A; --red:#EF4444; --blue:#6366F1; --teal:#7C3AED; --amber:#F59E0B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink);}
  h1,h2,h3,.page-title,.modal-head h3,.brand-text .t1,.login-box h2{font-weight:800;letter-spacing:-.01em;}
  #app{display:flex;min-height:100vh;}

  /* Login */
  #login-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--navy);}
  .login-box{background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(47,95,234,.15);padding:36px 34px;width:100%;max-width:380px;}
  .login-logo{width:44px;height:44px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:19px;margin-bottom:16px;}
  .login-box h2{margin:0 0 4px 0;font-size:20px;}
  .login-box p.sub{color:var(--muted);font-size:13px;margin:0 0 22px 0;}
  .login-box .field{margin-bottom:14px;}
  .login-box .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .login-box .field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font-size:14px;}
  .login-error{background:#FEE2E2;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .login-msg{background:#DCFCE7;color:var(--green);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .login-submit{width:100%;padding:12px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px;}
  .login-forgot{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--blue);cursor:pointer;}
  .pending-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);}
  .pending-box{background:#fff;border-radius:16px;padding:40px;max-width:420px;text-align:center;}
  .pending-box h2{margin:0 0 10px 0;}
  .pending-box p{color:var(--muted);font-size:14px;line-height:1.7;}

  /* Sidebar */
  #sidebar{width:230px;background:var(--navy);color:#FFFFFF;flex-shrink:0;display:flex;flex-direction:column;padding:20px 14px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px 8px;border-bottom:1px solid #4A78F5;margin-bottom:14px;}
  .brand-logo{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
  .brand-text .t1{color:#fff;font-weight:700;font-size:14.5px;}
  .brand-text .t2{color:#DCE6FE;font-size:11.5px;}
  .nav-group-label{font-size:10.5px;letter-spacing:.08em;color:#C7D4FB;padding:6px 10px;margin-top:6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#FFFFFF;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.14);}
  .nav-item.active{background:#FFFFFF;color:var(--navy);font-weight:700;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .sidebar-footer{margin-top:auto;padding:14px 10px 0 10px;border-top:1px solid #4A78F5;}
  .user-chip{font-size:12.5px;color:#FFFFFF;margin-bottom:2px;word-break:break-all;}
  .role-chip{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:100px;margin-top:6px;margin-bottom:10px;}
  .role-chip.admin{background:rgba(255,255,255,.18);color:#ffffff;}
  .role-chip.editor{background:rgba(255,255,255,.18);color:#ffffff;}
  .role-chip.viewer{background:rgba(255,255,255,.18);color:#ffffff;}
  .role-chip.staffAdmin{background:rgba(255,255,255,.18);color:#ffffff;}
  .role-chip.staffSales{background:rgba(255,255,255,.18);color:#ffffff;}
  .logout-btn{width:100%;padding:8px;border-radius:8px;border:1px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer;font-size:12.5px;}

  /* Main */
  #main{flex:1;padding:34px 40px;max-width:1400px;}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:23px;font-weight:900;margin:0 0 4px 0;}
  .page-sub{color:var(--muted);font-size:13.5px;margin:0;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.primary:hover{background:#3F66E8;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn.ghost:hover{background:#F3F5FB;}
  .btn.sm{padding:6px 11px;font-size:12.5px;}

  .card{background:var(--white);border-radius:16px;padding:22px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(30,36,51,.04);}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  .stat-label{color:var(--muted);font-size:13px;margin-bottom:8px;}
  .stat-value{font-size:26px;font-weight:700;}
  .stat-value.green{color:var(--green);}
  .stat-value.red{color:var(--red);}
  .stat-value.blue{color:var(--blue);}

  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;}
  .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:13px;cursor:pointer;}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .filter-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .filter-field{display:flex;flex-direction:column;gap:5px;}
  .filter-field label{font-size:12px;color:var(--muted);}
  .filter-field select, .filter-field input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#F8F9FC;min-width:130px;}
  .search-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--white);}

  /* Transactions: summary bar, category tags, grouping, cards */
  .tx-summary-bar{display:flex;gap:24px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:16px;flex-wrap:wrap;}
  .tx-summary-bar .item{font-size:12.5px;color:var(--muted);}
  .tx-summary-bar .item b{display:block;color:var(--ink);font-size:16px;margin-top:2px;font-weight:700;}
  .tx-summary-bar .item b.green{color:var(--green);}
  .tx-summary-bar .item b.red{color:var(--red);}
  .cat-tag{display:inline-block;padding:2px 10px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .amount-outlier::after{content:' ⚠';font-size:11px;}
  .tx-group-row td{background:#F3F5FB !important;font-weight:700;font-size:12.5px;padding:8px 12px !important;border-bottom:1px solid var(--border) !important;}
  .tx-group-date{margin-right:14px;}
  .tx-group-sub{color:var(--muted);font-weight:400;}

  .tx-card-view{display:none;}
  .tx-card-group-date{font-weight:700;font-size:12.5px;color:var(--muted);margin:16px 0 8px 0;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
  .tx-card-group-date:first-child{margin-top:0;}
  .tx-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .tx-card-outlier{border-color:#FCA5A5;}
  .tx-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
  .tx-card-top .amt{font-size:15px;font-weight:700;}
  .tx-card-mid{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .tx-card-note{font-size:12.5px;color:var(--ink);margin-top:8px;background:#F5F7FC;padding:7px 9px;border-radius:8px;}
  .tx-card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid #EEF1F8;}

  @media (max-width:900px){
    .tx-table-view{display:none;}
    .tx-card-view{display:block;}
  }

  /* Reports comparison */
  .rpt-compare-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .rpt-compare-row label{font-size:12.5px;color:var(--muted);margin-right:4px;}
  .delta-up{color:var(--green);font-size:12.5px;font-weight:700;}
  .delta-down{color:var(--red);font-size:12.5px;font-weight:700;}
  .delta-flat{color:var(--muted);font-size:12.5px;}
  .rpt-legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .rpt-legend span{display:inline-flex;align-items:center;gap:5px;}
  .rpt-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:12px;border-bottom:1px solid #EEF1F8;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;overflow-x:auto;}
  .table-wrap .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;}
  .amount-pos{color:var(--green);font-weight:600;}
  .amount-neg{color:var(--red);font-weight:600;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:600;border:none;}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .badge.income{background:#DCFCE7;color:var(--green);}
  .badge.expense{background:#FEE2E2;color:var(--red);}
  .badge.pending{background:#FEF3C7;color:var(--amber);}
  .badge.active{background:#DCFCE7;color:var(--green);}
  .badge.resigned{background:#F1F2F6;color:var(--muted);}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{background:transparent;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#EEF1F8;color:var(--ink);}
  .edited-note{font-size:11px;color:var(--muted);}

  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding:10px 4px 0 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .bar-pair{display:flex;align-items:flex-end;gap:3px;height:170px;}
  .bar{width:9px;border-radius:3px 3px 0 0;}
  .bar.income-bar{background:var(--green);}
  .bar.expense-bar{background:var(--red);}
  .bar-col .m-label{font-size:11px;color:var(--muted);margin-top:2px;}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .cat-row{display:flex;align-items:center;gap:12px;padding:9px 0;}
  .cat-row .name{width:100px;font-size:13px;flex-shrink:0;}
  .cat-row .track{flex:1;height:8px;background:#EEF1F8;border-radius:6px;overflow:hidden;}
  .cat-row .fill{height:100%;border-radius:6px;}
  .cat-row .val{width:96px;text-align:right;font-size:12.5px;color:var(--muted);flex-shrink:0;}

  .cat-card{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .cat-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .cat-card-head h4{margin:0;font-size:14.5px;}
  .sub-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .sub-chip{display:flex;align-items:center;gap:6px;background:#F3F5FB;border-radius:100px;padding:5px 6px 5px 12px;font-size:12.5px;}
  .sub-chip button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 5px;}
  .add-sub-chip{border:1px dashed var(--border);background:transparent;border-radius:100px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;}

  select#year-select{padding:9px 14px;border:1px solid var(--border);border-radius:9px;background:var(--white);font-size:13.5px;}
  select.role-select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}

  /* AI Chat widget */
  .ai-chat-fab{
    position:fixed;right:24px;bottom:24px;width:54px;height:54px;border-radius:50%;
    background:var(--navy);color:#fff;border:none;font-size:22px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:90;display:flex;align-items:center;justify-content:center;
  }
  .ai-chat-panel{
    position:fixed;right:24px;bottom:90px;width:340px;max-width:calc(100vw - 32px);height:440px;max-height:70vh;
    background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:90;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .ai-chat-panel.hidden{display:none;}
  .ai-chat-header{background:var(--navy);color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .ai-chat-header button{background:transparent;border:none;color:#fff;font-size:15px;cursor:pointer;}
  .ai-chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F5F7FC;}
  .ai-msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;}
  .ai-msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px;}
  .ai-msg.ai{align-self:flex-start;background:#EEF1FB;color:var(--ink);border-bottom-left-radius:3px;}
  .ai-msg.loading{align-self:flex-start;background:#EEF1FB;color:var(--muted);font-style:italic;}
  .ai-chat-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 10px;}
  .ai-chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
  .ai-chat-form input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:20px;font-size:13px;}
  .ai-chat-form button{background:var(--navy);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:13px;cursor:pointer;}

  #modal-overlay{position:fixed;inset:0;background:rgba(20,22,28,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #modal-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16.5px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;}
  .field span{color:var(--muted);font-size:12.5px;}
  .field input, .field select, .field textarea{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#F8F9FC;}
  .field textarea{min-height:64px;resize:vertical;}
  .field.checkbox{flex-direction:row;align-items:center;gap:8px;}
  .field.checkbox input{width:16px;height:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .confirm-text{font-size:14px;line-height:1.6;margin-bottom:20px;}
  .card-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .card-head-row h3{margin:0;font-size:15px;}
  .card-head-row .hint{font-size:12px;color:var(--muted);font-weight:400;}

  /* Mobile top bar */
  #mobile-topbar{display:none;}
  .sidebar-backdrop{display:none;}

  @media (max-width:900px){
    #app{flex-direction:column;}
    #mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;
      background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:60;
    }
    #mobile-topbar .mt-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;}
    #hamburger-btn{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;padding:2px 8px;}
    #sidebar{
      position:fixed;top:0;left:0;bottom:0;width:250px;z-index:80;
      transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto;
    }
    #sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;
    }
    .sidebar-backdrop.open{display:block;}
    .sidebar-footer{display:block;}
    #main{padding:18px;}
    .grid-3{grid-template-columns:1fr;}
    .grid-2{grid-template-columns:1fr;}
    .page-header{flex-direction:column;align-items:stretch;}
    .filter-row{flex-direction:column;align-items:stretch;}
    .filter-field select, .filter-field input{min-width:0;width:100%;}
    table{font-size:12.5px;}
    th, td{padding:9px 8px;}
    .login-box{padding:28px 22px;}
  }
</style>
</head>
<body>
<div id="app">載入中…</div>
<div id="modal-overlay"><div id="modal-box"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, updateDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB527mQtDRdH4BYW4WIB0lDOOqHUpff2Ws",
  authDomain: "shangyiloan-financial.firebaseapp.com",
  projectId: "shangyiloan-financial",
  storageBucket: "shangyiloan-financial.firebasestorage.app",
  messagingSenderId: "622583676341",
  appId: "1:622583676341:web:5b6c7d405cb3b98d6b2dfc"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ---------------- State ---------------- */
const todayStr = () => new Date().toISOString().slice(0,10);
const nowYear = new Date().getFullYear();
const nowMonthKey = todayStr().slice(0,7);
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ n = Number(n)||0; return 'NT$' + Math.round(n).toLocaleString('zh-TW'); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }
function sum(list){ return list.reduce((a,t)=>a+(Number(t.amount)||0),0); }
function stamp(obj){ return { ...obj, _by: APP.userEmail || '', _at: new Date().toISOString() }; }
function editedLabel(item){
  if(!item || !item._by) return '—';
  const d = item._at ? new Date(item._at) : null;
  const dateStr = d ? d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

function dashboardHTML(){
  const year = APP.year;
  const txYear = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year));
  const totalIncome = sum(txYear.filter(t=>t.type==='income'));
  const totalExpense = sum(txYear.filter(t=>t.type==='expense'));
  const now = new Date();
  const isCurYear = year===now.getFullYear();
  const curMonthStr = String(year)+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthTx = isCurYear ? txYear.filter(t=>t.date.slice(0,7)===curMonthStr) : [];
  const monthIncome = sum(monthTx.filter(t=>t.type==='income'));
  const monthExpense = sum(monthTx.filter(t=>t.type==='expense'));

  const monthly = Array.from({length:12},(_,i)=>{
    const mStr = String(year)+'-'+String(i+1).padStart(2,'0');
    const mi = sum(txYear.filter(t=>t.date.slice(0,7)===mStr && t.type==='income'));
    const me = sum(txYear.filter(t=>t.date.slice(0,7)===mStr && t.type==='expense'));
    return {m:i+1, mi, me};
  });
  const maxVal = Math.max(1, ...monthly.map(m=>Math.max(m.mi,m.me)));
  const barsHtml = monthly.map(m=>{
    const hi = Math.round((m.mi/maxVal)*170);
    const he = Math.round((m.me/maxVal)*170);
    return `<div class="bar-col"><div class="bar-pair">
      <div class="bar income-bar" style="height:${hi}px" title="收入 ${money(m.mi)}"></div>
      <div class="bar expense-bar" style="height:${he}px" title="支出 ${money(m.me)}"></div>
    </div><div class="m-label">${m.m}月</div></div>`;
  }).join('');

  const PIE_COLORS = ['#2F5FEA','#16A34A','#F59E0B','#EF4444','#7C3AED','#0EA5E9','#DB2777','#84CC16','#F97316','#14B8A6'];
  function pieChartSvg(rows, size){
    const total = rows.reduce((a,r)=>a+r[1],0) || 1;
    const cx = size/2, cy = size/2, r = size/2 - 2;
    let angleStart = -90;
    if(rows.length===1){
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE_COLORS[0]}"/></svg>`;
    }
    const paths = rows.map(([name,val],i)=>{
      const pct = val/total;
      const angleEnd = angleStart + pct*360;
      const largeArc = (angleEnd-angleStart) > 180 ? 1 : 0;
      const s = angleStart*Math.PI/180, e = angleEnd*Math.PI/180;
      const x1 = cx + r*Math.cos(s), y1 = cy + r*Math.sin(s);
      const x2 = cx + r*Math.cos(e), y2 = cy + r*Math.sin(e);
      const d = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
      angleStart = angleEnd;
      return `<path d="${d}" fill="${PIE_COLORS[i%PIE_COLORS.length]}"/>`;
    }).join('');
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
  }
  function pieLegendHtml(rows, total){
    return rows.map(([name,val],i)=>{
      const pct = Math.round((val/total)*100);
      return `<div class="cat-row"><div class="name" style="width:auto;flex:1;display:flex;align-items:center;gap:6px;">
        <span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PIE_COLORS[i%PIE_COLORS.length]};flex-shrink:0;"></span>${escHtml(name)}</div>
        <div class="val" style="width:auto;">${money(val)} · ${pct}%</div></div>`;
    }).join('');
  }
  function catBreakdown(type){
    const txs = txYear.filter(t=>t.type===type);
    const total = sum(txs) || 1;
    const map = {};
    txs.forEach(t=>{ map[t.mainCategory] = (map[t.mainCategory]||0) + Number(t.amount||0); });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
    if(rows.length===0) return `<div class="table-wrap"><div class="empty">尚無資料</div></div>`;
    return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
      <div style="flex-shrink:0;">${pieChartSvg(rows, 150)}</div>
      <div style="flex:1;min-width:180px;">${pieLegendHtml(rows, total)}</div>
    </div>`;
  }

  const yearOptions = [];
  for(let y=nowYear-3; y<=nowYear+1; y++) yearOptions.push(`<option value="${y}" ${y===year?'selected':''}>${y} 年度</option>`);

  /* ---- Layer 1: 本月營運脈動 ---- */
  const adThisMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey);
  const chThisMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===nowMonthKey);
  const progressAdThisMonth = APP.data.progressAd.filter(c=>monthKey(c.date)===nowMonthKey);
  const progressChThisMonth = APP.data.progressChannel.filter(c=>monthKey(c.date)===nowMonthKey);
  const allProgressThisMonth = [...progressAdThisMonth, ...progressChThisMonth];
  const disbursedCount = allProgressThisMonth.filter(c=>STATUS_DONE.includes(c.status)).length;
  const pendingCount = allProgressThisMonth.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const todayLedger = APP.data.staffBonusLedger.filter(e=>e.date===todayStr());
  const todayBonusTotal = sum(todayLedger.map(e=>({amount:(Number(e.businessBonus)||0)+(Number(e.xiaojiangBonus)||0)})));

  /* ---- Layer 3a: 業務排行榜(本月公司利潤) ---- */
  const profitByStaff = {};
  adThisMonth.forEach(c=>{ const k=c.staff||'（未填）'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  chThisMonth.forEach(c=>{ const k=c.staff||'（未填）'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  const ranking = Object.entries(profitByStaff).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const rankHtml = ranking.length===0 ? `<div class="empty">本月尚無資料</div>` : ranking.map(([name,val],i)=>`

      <div class="val">${money(val)}</div></div>`).join('');

  /* ---- Layer 3b: 待處理提醒 ---- */
  const staleThresholdMs = 7*24*60*60*1000;
  const nowMs = Date.now();
  function isStale(c){
    if(STATUS_DONE.includes(c.status) || STATUS_CLOSED.includes(c.status)) return false;
    const ref = c._at ? new Date(c._at).getTime() : (c.date ? new Date(c.date).getTime() : 0);
    return ref && (nowMs-ref) > staleThresholdMs;
  }
  const staleAd = APP.data.progressAd.filter(isStale);
  const staleCh = APP.data.progressChannel.filter(isStale);
  const staleCount = staleAd.length + staleCh.length;
  const unpaidBonusCases = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey && !c.bonusPaid);

  return `

      <div class="card"><div class="stat-label">本月撥款完成</div><div class="stat-value green">${disbursedCount} 件</div></div>

      <div class="card"><div class="stat-label">今日應發獎金</div><div class="stat-value" style="color:var(--teal);">${money(todayBonusTotal)}</div></div>
    </div>

    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="card"><div class="stat-label">${year} 年度總收入</div><div class="stat-value green">${money(totalIncome)}</div></div>
      <div class="card"><div class="stat-label">${year} 年度總支出</div><div class="stat-value red">${money(totalExpense)}</div></div>
    </div>
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card"><div class="stat-label">當月收入</div><div class="stat-value green">${money(monthIncome)}</div></div>
      <div class="card"><div class="stat-label">當月支出</div><div class="stat-value red">${money(monthExpense)}</div></div>
      <div class="card"><div class="stat-label">當月結餘</div><div class="stat-value blue">${money(monthIncome-monthExpense)}</div></div>
    </div>

    <div class="grid grid-2" style="margin-bottom:20px;">
      <div class="card">
        <div class="card-head-row"><h3>業務排行榜</h3><span class="hint">本月公司利潤貢獻</span></div>
        ${rankHtml}
      </div>
      <div class="card">
        <div class="card-head-row"><h3>待處理提醒</h3></div>
        <div class="cat-row"><div class="name" style="width:auto;flex:1;">案件超過 7 天未更新狀態</div><div class="val" style="width:auto;color:${staleCount>0?'var(--red)':'var(--muted)'};font-weight:700;">${staleCount} 件</div></div>
        <div class="cat-row"><div class="name" style="width:auto;flex:1;">本月獎金尚未發放</div><div class="val" style="width:auto;color:${unpaidBonusCases.length>0?'var(--amber)':'var(--muted)'};font-weight:700;">${unpaidBonusCases.length} 件 · ${money(unpaidBonusTotal)}</div></div>
        ${(staleCount===0 && unpaidBonusCases.length===0) ? `<p style="color:var(--muted);font-size:12.5px;margin-top:10px;">目前沒有需要特別留意的事項</p>` : ''}

      <div class="card-head-row"><h3>月度收支</h3></div>
      <div class="legend"><span><span class="dot" style="background:var(--green)"></span>收入</span><span><span class="dot" style="background:var(--red)"></span>支出</span></div>
      ${txYear.length===0 ? `<div class="empty" style="padding:60px 0;">尚無資料，請先新增收支記錄</div>` : `<div class="bar-chart">${barsHtml}</div>`}
    </div>
    <div class="grid grid-2">
      <div class="card"><div class="card-head-row"><h3>支出分類</h3></div>${catBreakdown('expense')}</div>
      <div class="card"><div class="card-head-row"><h3>收入分類</h3></div>${catBreakdown('income')}</div>
    </div>
  `;
}

function catColor(name){
  const palette = ['#8A6A2E','#16a34a','#d97706','#A63A2E','#7c3aed','#0891b2','#db2777','#65a30d','#B8935A','#9333ea'];
  let hash = 0;
  for(let i=0;i<String(name).length;i++){ hash = String(name).charCodeAt(i) + ((hash<<5)-hash); }
  return palette[Math.abs(hash)%palette.length];
}
function dateGroupLabel(d){
  const weekdayNames = ['日','一','二','三','四','五','六'];
  const dt = new Date(d+'T00:00:00');
  return isNaN(dt) ? d : `${d}（週${weekdayNames[dt.getDay()]}）`;
}

/* ================= REPORTS ================= */
function getPresetRange(preset, year){
  const pad = n => String(n).padStart(2,'0');
  const y = year;
  if(preset==='thisMonth'){
    const now = new Date();
    const s = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    return {start:s, end:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(last)}`, label:'本月'};
  }
  if(preset==='lastMonth'){
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return {start:`${d.getFullYear()}-${pad(d.getMonth()+1)}-01`, end:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(last)}`, label:'上月'};
  }
  const qMap = { q1:[1,3], q2:[4,6], q3:[7,9], q4:[10,12] };
  if(qMap[preset]){
    const [m1,m2] = qMap[preset];
    const lastDay = new Date(y, m2, 0).getDate();
    return {start:`${y}-${pad(m1)}-01`, end:`${y}-${pad(m2)}-${pad(lastDay)}`, label:preset.toUpperCase()};
  }
  if(preset==='thisYear') return {start:`${y}-01-01`, end:`${y}-12-31`, label:`${y} 全年`};
  if(preset==='lastYear') return {start:`${y-1}-01-01`, end:`${y-1}-12-31`, label:`${y-1} 全年`};
  return null;
}
function prevPeriodRange(start, end){
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
  const days = Math.round((e-s)/86400000) + 1;
  const prevEnd = new Date(s); prevEnd.setDate(prevEnd.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate()-(days-1));
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start: fmt(prevStart), end: fmt(prevEnd) };
}
function trailingMonths(endDateStr, count){
  const end = new Date(endDateStr+'T00:00:00');
  const months = [];
  for(let i=count-1;i>=0;i--){
    const d = new Date(end.getFullYear(), end.getMonth()-i, 1);
    const y = d.getFullYear(), m = d.getMonth()+1;
    const last = new Date(y, m, 0).getDate();
    months.push({ label:`${y}/${String(m).padStart(2,'0')}`, start:`${y}-${String(m).padStart(2,'0')}-01`, end:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}` });
  }
  return months;
}
function deltaBadge(current, previous){
  if(previous===0){
    if(current===0) return `<span class="delta-flat">—</span>`;
    return `<span class="delta-up">▲ 新增</span>`;
  }
  const pct = ((current-previous)/Math.abs(previous))*100;
  const up = pct>=0;
  return `<span class="${up?'delta-up':'delta-down'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function lineChartSVG(months, incomeVals, expenseVals){
  const w=640, h=220, padL=44, padR=16, padT=16, padB=26;
  const maxVal = Math.max(1, ...incomeVals, ...expenseVals);
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = months.length>1 ? innerW/(months.length-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH*(1-v/maxVal);
  const ptsStr = vals => vals.map((v,i)=>`${xOf(i)},${yOf(v)}`).join(' ');
  let grid = '';
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const y = padT + innerH*(i/ticks);
    const val = Math.round(maxVal*(1-i/ticks));
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EEF1FB" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" font-size="10" fill="#8A8874" text-anchor="end">${val>=10000?Math.round(val/1000)+'k':val}</text>`;
  }
  const xLabels = months.map((m,i)=>`<text x="${xOf(i)}" y="${h-8}" font-size="10" fill="#8A8874" text-anchor="middle">${m.label.slice(5)}</text>`).join('');
  const incomeDots = incomeVals.map((v,i)=>`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3" fill="#2F6B4F"/>`).join('');
  const expenseDots = expenseVals.map((v,i)=>`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3" fill="#A63A2E"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px;">
    ${grid}
    <polyline points="${ptsStr(incomeVals)}" fill="none" stroke="#2F6B4F" stroke-width="2.5"/>
    <polyline points="${ptsStr(expenseVals)}" fill="none" stroke="#A63A2E" stroke-width="2.5"/>
    ${incomeDots}${expenseDots}
    ${xLabels}
  </svg>`;
}

          <div class="card-head-row"><h3>期間比較</h3><span class="hint">本期：${s} ~ ${e}　比較期：${cs} ~ ${ce}</span></div>
          <div class="grid grid-2" style="margin-bottom:18px;">
            <div><div class="stat-label">收入變化</div><div class="stat-value" style="font-size:19px;">${money(inc)} <span style="color:var(--muted);font-size:13px;">vs ${money(cInc)}</span> ${deltaBadge(inc,cInc)}</div></div>
            <div><div class="stat-label">支出變化</div><div class="stat-value" style="font-size:19px;">${money(exp)} <span style="color:var(--muted);font-size:13px;">vs ${money(cExp)}</span> ${deltaBadge(exp,cExp)}</div></div>
          </div>
          <div class="rpt-legend">
            <span><span class="rpt-dot" style="background:var(--navy)"></span>本期</span>
            <span><span class="rpt-dot" style="background:#FFFFFF"></span>比較期</span>
          </div>
          <div class="bar-chart" style="height:200px;">
            <div class="bar-col"><div class="bar-pair" style="height:170px;">
              <div class="bar" style="height:${barH(inc)}px;background:var(--green);"></div>
              <div class="bar" style="height:${barH(cInc)}px;background:#BFD0FB;"></div>
            </div><div class="m-label">收入</div></div>
            <div class="bar-col"><div class="bar-pair" style="height:170px;">
              <div class="bar" style="height:${barH(exp)}px;background:var(--red);"></div>
              <div class="bar" style="height:${barH(cExp)}px;background:#FCA5A5;"></div>
            </div><div class="m-label">支出</div></div>
          </div>
        </div>`;
    }

    const months = trailingMonths(e, 6);
    const monthIncome = months.map(m=>sum(APP.data.transactions.filter(t=>t.type==='income' && t.date>=m.start && t.date<=m.end)));
    const monthExpense = months.map(m=>sum(APP.data.transactions.filter(t=>t.type==='expense' && t.date>=m.start && t.date<=m.end)));
    const trendBlock = `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-head-row"><h3>近 6 個月趨勢</h3></div>
        <div class="rpt-legend">
          <span><span class="rpt-dot" style="background:var(--green)"></span>收入</span>
          <span><span class="rpt-dot" style="background:var(--red)"></span>支出</span>
        </div>
        ${lineChartSVG(months, monthIncome, monthExpense)}
      </div>`;

    function breakdown(type){
      const list = txs.filter(t=>t.type===type);
      const map = {};
      list.forEach(t=>{ map[t.mainCategory]=(map[t.mainCategory]||0)+Number(t.amount||0); });
      const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
      if(rows.length===0) return `<tr><td colspan="2" style="color:var(--muted);text-align:center;padding:20px;">無資料</td></tr>`;
      return rows.map(([n,v])=>`<tr><td>${escHtml(n)}</td><td style="text-align:right;">${money(v)}</td></tr>`).join('');
    }

    resultHtml = `
      <div class="grid grid-3" style="margin:20px 0 16px 0;">
        <div class="card"><div class="stat-label">總收入</div><div class="stat-value green">${money(inc)}</div>${hasCompare?deltaBadge(inc,cInc):''}</div>
        <div class="card"><div class="stat-label">總支出</div><div class="stat-value red">${money(exp)}</div>${hasCompare?deltaBadge(exp,cExp):''}</div>
        <div class="card"><div class="stat-label">淨損益</div><div class="stat-value ${inc-exp>=0?'blue':'red'}">${money(inc-exp)}</div>${hasCompare?deltaBadge(inc-exp,cInc-cExp):''}</div>
      </div>
      ${compareBlock}
      ${trendBlock}
      <div class="grid grid-2">
        <div class="card"><h3 style="margin-top:0;">收入明細</h3><table><tbody>${breakdown('income')}</tbody></table></div>
        <div class="card"><h3 style="margin-top:0;">支出明細</h3><table><tbody>${breakdown('expense')}</tbody></table></div>
      </div>`;
  }
  return `
    <div class="page-header"><div><h1 class="page-title">財報</h1><p class="page-sub">選取期間生成完整財務報告，支援與上一期或自訂期間比較</p></div></div>
    <div class="card">
      <div class="chip-row">${chips}</div>
      <div class="filter-row" style="border:none;padding:0;margin-bottom:0;">
        <div class="filter-field"><label>開始日期</label><input type="date" id="report-start" value="${start}"/></div>
        <div class="filter-field"><label>結束日期</label><input type="date" id="report-end" value="${end}"/></div>
        <button class="btn primary" data-action="generate-report">生成財報</button>
      </div>
      <div class="rpt-compare-row">
        <label>比較：</label>${compareChips}
        ${customCompareFields}
      </div>
    </div>
    ${resultHtml}
  `;
}

/* ---------------- Router render ---------------- */
function render(){
  document.querySelectorAll('.nav-item').forEach(el=>{ el.classList.toggle('active', el.dataset.view===APP.view); });
  const main = document.getElementById('main');
  if(!main) return;
  const staffOnlyViews = ['progress','personalLog','attendance','calendar','personalDashboard'];
  if(isStaffAny() && !staffOnlyViews.includes(APP.view)){ APP.view = 'personalDashboard'; }
  const roomOk = isStaffAny() || (isCore() && APP.viewingStaff);
  if(APP.view==='dashboard' && isCore()) main.innerHTML = dashboardHTML();
  else if(APP.view==='transactions' && isCore()) main.innerHTML = transactionsHTML();
  else if(APP.view==='reports' && isCore()) main.innerHTML = reportsHTML();
  else if(APP.view==='settings' && isCore()) main.innerHTML = settingsHTML();
  else if(APP.view==='hr' && isCore()) main.innerHTML = hrHTML();
  else if(APP.view==='vendors' && isCore()) main.innerHTML = vendorsHTML();
  else if(APP.view==='cases' && isCore()) main.innerHTML = casesHTML();
  else if(APP.view==='staffOverview' && isCore()) main.innerHTML = staffOverviewHTML();
  else if(APP.view==='progress') main.innerHTML = progressHTML();
  else if(APP.view==='personalLog' && roomOk) main.innerHTML = personalLogPageHTML();
  else if(APP.view==='attendance' && roomOk) main.innerHTML = attendancePageHTML();
  else if(APP.view==='calendar' && roomOk) main.innerHTML = calendarPageHTML();
  else if(APP.view==='personalDashboard' && roomOk) main.innerHTML = personalDashboardPageHTML();
  else if(APP.view==='users' && isAdmin()) main.innerHTML = usersHTML();
  else { APP.view = isCore() ? 'dashboard' : 'personalDashboard'; main.innerHTML = isCore() ? dashboardHTML() : personalDashboardPageHTML(); }
}

function myProgressView(){
  const me = effectiveStaffName();
  if(!me){
    return `<div class="table-wrap"><div class="empty">你的帳號還沒有設定「對應業務姓名」，請聯絡管理員在「帳號管理」幫你設定後才能使用。</div></div>`;
  }
  const myAd = APP.data.progressAd.filter(c=>c.staff===me);
  const myCh = APP.data.progressChannel.filter(c=>c.staff===me);
  const combined = [
    ...myAd.map(c=>({...c, _type:'ad'})),
    ...myCh.map(c=>({...c, _type:'channel'}))
  ].sort((a,b)=> b.date.localeCompare(a.date));

  const byMonth = {};
  combined.forEach(c=>{ const mk = monthKey(c.date); (byMonth[mk]=byMonth[mk]||[]).push(c); });
  const months = Object.keys(byMonth).sort().reverse();

  const rows = combined.map(c=>`
    <tr>
      <td>${c.date}</td>
      <td><span class="badge ${c._type==='ad'?'income':'expense'}">${c._type==='ad'?'廣告客':'直客通路'}</span></td>
      <td>${escHtml(c.customer)}<div style="color:var(--muted);font-size:12px;">${escHtml(c.phone||'')}</div></td>
      <td>${escHtml(c.plan||'—')}</td>
      <td><span class="badge ${statusBadgeClass(c.status)}">${escHtml(c.status||'—')}</span></td>
      <td style="max-width:180px;white-space:normal;color:var(--muted);font-size:12.5px;">${escHtml(c.note||'—')}</td>
    </tr>`).join('');

  const monthSummary = months.map(m=>{
    const list = byMonth[m];
    const done = list.filter(c=>STATUS_DONE.includes(c.status)).length;
    const closed = list.filter(c=>STATUS_CLOSED.includes(c.status)).length;
    return `<div class="cat-row"><div class="name">${m}</div><div class="val" style="width:auto;flex:1;text-align:left;">共 ${list.length} 件 · 撥款完成 ${done} 件 · 婉拒/客拒 ${closed} 件</div></div>`;
  }).join('');

  return `
    <div class="page-header" style="margin-bottom:14px;">
      <div><p class="hint" style="color:var(--muted);font-size:12.5px;">這裡只顯示屬於你的正式送件案件（唯讀），狀態與備註由行政統一維護。想記錄自己的開發過程，請用「個人業務進度紀錄」。</p></div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" data-action="open-progress-ad-modal">＋ 新增廣告客</button>
        <button class="btn primary" data-action="open-progress-channel-modal">＋ 新增直客／通路</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3 style="margin-top:0;">逐月處理效率</h3>
      ${monthSummary || `<div class="empty">尚無資料</div>`}
    </div>
    <div class="table-wrap">
      ${combined.length===0?`<div class="empty">尚無你的客戶資料，點右上角新增</div>`:`
      <table><thead><tr><th>日期</th><th>類型</th><th>客戶</th><th>方案</th><th>狀態</th><th>備註</th></tr></thead>
      <tbody>${rows}</tbody></table>`}
    </div>
  `;
}

function myDashboardView(){
  const me = effectiveStaffName();
  const meUid = effectiveUid();
  const profile = APP.staffProfiles[meUid] || {};
  if(!me){
    return `<div class="table-wrap"><div class="empty">你的帳號還沒有設定「對應業務姓名」，請聯絡管理員設定後才能看到獎金資料。</div></div>`;
  }
  const thisMonth = nowMonthKey;
  const myEntries = APP.data.staffBonusLedger.filter(e=>e.staffName===me && monthKey(e.date)===thisMonth);
  const byDay = {};
  myEntries.forEach(e=>{
    const total = (Number(e.businessBonus)||0) + (Number(e.xiaojiangBonus)||0);
    byDay[e.date] = (byDay[e.date]||0) + total;
  });
  const days = Object.keys(byDay).sort().reverse();
  const monthTotal = Object.values(byDay).reduce((a,b)=>a+b,0);
  const rows = days.map(d=>`<tr><td>${d}</td><td class="amount-pos">${money(byDay[d])}</td></tr>`).join('');

  /* 本月自己的案件狀態統計 */
  const myAd = APP.data.progressAd.filter(c=>c.staff===me && monthKey(c.date)===thisMonth);
  const myCh = APP.data.progressChannel.filter(c=>c.staff===me && monthKey(c.date)===thisMonth);
  const myAll = [...myAd, ...myCh];
  const myDone = myAll.filter(c=>STATUS_DONE.includes(c.status)).length;
  const myPending = myAll.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const myClosed = myAll.filter(c=>STATUS_CLOSED.includes(c.status)).length;

  /* 近期行事曆 */
  const today = todayStr();
  const upcoming = APP.data.calendar.filter(c=>c.staffUid===meUid && c.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);

  return `
    <div class="card-head-row" style="margin-top:0;"><h3 style="font-size:15px;">本月案件狀態</h3></div>
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card"><div class="stat-label">處理中</div><div class="stat-value blue">${myPending} 件</div></div>
      <div class="card"><div class="stat-label">撥款完成</div><div class="stat-value green">${myDone} 件</div></div>
      <div class="card"><div class="stat-label">婉拒／客拒</div><div class="stat-value" style="color:var(--muted);">${myClosed} 件</div></div>
    </div>

    <div class="card-head-row"><h3 style="font-size:15px;">本月收入</h3></div>
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card"><div class="stat-label">本月底薪</div><div class="stat-value blue">${money(profile.baseSalary||0)}</div></div>
      <div class="card"><div class="stat-label">本月獎金累計</div><div class="stat-value green">${money(monthTotal)}</div></div>
      <div class="card"><div class="stat-label">本月預估總收入</div><div class="stat-value blue" style="font-size:22px;">${money((profile.baseSalary||0)+monthTotal)}</div></div>
    </div>

    <div class="grid grid-2">
      <div class="table-wrap">
        ${days.length===0?`<div class="empty">本月尚無獎金紀錄</div>`:`
        <table><thead><tr><th>日期</th><th>當日獎金</th></tr></thead><tbody>${rows}</tbody></table>`}
      </div>
      <div class="card">
        <h3 style="margin-top:0;">即將到來的行程</h3>
        ${upcoming.length===0?`<div class="empty">目前沒有即將到來的行程</div>`:
        upcoming.map(c=>`<div class="cat-row"><div class="name" style="width:80px;">${c.date}</div><div class="val" style="width:auto;flex:1;text-align:left;color:var(--ink);">${escHtml(c.title)}</div></div>`).join('')}
      </div>
    </div>
  `;
}

function statusBadgeClass(s){
  if(STATUS_DONE.includes(s)) return 'active';
  if(STATUS_CLOSED.includes(s)) return 'resigned';
  return 'pending';
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
function monthBoundsStart(mk){ return mk ? `${mk}-01` : ''; }
function monthBoundsEnd(mk){
  if(!mk) return '';
  const [y,m] = mk.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return `${mk}-${String(last).padStart(2,'0')}`;
}
function selectOptionsHtml(list, current){
  const opts = list.slice();
  if(current && !opts.includes(current)) opts.unshift(current);
  return `<option value="">請選擇</option>` + opts.map(o=>`<option value="${escAttr(o)}" ${o===current?'selected':''}>${escHtml(o)}</option>`).join('');
}
function staffOrChannelFieldHtml(name, current){
  if(isStaffSales()){
    return `<input type="text" name="${name}" value="${escAttr(myStaffName())}" readonly/>`;
  }
  return `<input type="text" name="${name}" list="staff-suggest-list" value="${escAttr(current||'')}" placeholder="選業務，或直接輸入通路夥伴名稱"/>
    <datalist id="staff-suggest-list">${APP.data.caseSettings.staffOptions.map(s=>`<option value="${escAttr(s)}">`).join('')}</datalist>`;
}
function calcBusinessBonus(afterCost){ return Math.round((Number(afterCost)||0) * APP.data.caseSettings.businessBonusRate); }
function calcXiaojiangBonus(afterCost, ordinalInMonth){
  const cs = APP.data.caseSettings;
  const rate = ordinalInMonth <= cs.xiaojiangThreshold ? cs.xiaojiangRateBelow : cs.xiaojiangRateAbove;
  return Math.round((Number(afterCost)||0) * rate);
}
function adCaseOrdinal(caseId, dateStr){
  const mk = monthKey(dateStr);
  const sameMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===mk).slice().sort((a,b)=> a.date===b.date ? (a._createdSeq||0)-(b._createdSeq||0) : a.date.localeCompare(b.date));
  const idx = sameMonth.findIndex(c=>c.id===caseId);
  return idx>=0 ? idx+1 : sameMonth.length+1;
}
function recalcAdCase(c){
  const ordinal = adCaseOrdinal(c.id, c.date);
  if(!c.businessBonusOverride) c.businessBonus = calcBusinessBonus(c.afterCost);
  if(!c.xiaojiangBonusOverride) c.xiaojiangBonus = calcXiaojiangBonus(c.afterCost, ordinal);
  if(!c.companyProfitOverride) c.companyProfit = (Number(c.afterCost)||0) - (Number(c.businessBonus)||0) - (Number(c.xiaojiangBonus)||0);
  return c;
}
function recalcChannelCase(c){
  if(!c.companyProfitOverride) c.companyProfit = (Number(c.afterCost)||0) - (Number(c.partnerProfit)||0);
  return c;
}

function overrideTag(isOverride){
  return isOverride ? `<span class="badge pending" style="margin-left:6px;">已手動調整</span>` : '';
}

function availableYears(...dateArrays){
  const years = new Set();
  dateArrays.forEach(arr=>arr.forEach(d=>{ if(d) years.add(String(d).slice(0,4)); }));
  const list = Array.from(years).sort().reverse();
  return list.length ? list : [String(new Date().getFullYear())];
}

function dailyBonusView(){
  const d = APP.dailyBonusDate || todayStr();
  const adToday = APP.data.casesAd.filter(c=>c.date===d);
  const chToday = APP.data.casesChannel.filter(c=>c.date===d);

  const byStaff = {};
  let xiaojiangTotal = 0;
  adToday.forEach(c=>{
    const key = c.staff || '（未填業務）';
    if(!byStaff[key]) byStaff[key] = {count:0, businessBonus:0};
    byStaff[key].count++;
    byStaff[key].businessBonus += Number(c.businessBonus)||0;
    xiaojiangTotal += Number(c.xiaojiangBonus)||0;
  });
  const byReferrer = {};
  chToday.forEach(c=>{
    const key = c.staff || '（未填業務）';
    if(!byReferrer[key]) byReferrer[key] = {count:0, profit:0};
    byReferrer[key].count++;
    byReferrer[key].profit += Number(c.partnerProfit)||0;
  });

  const businessBonusSum = Object.values(byStaff).reduce((a,v)=>a+v.businessBonus,0);
  const referrerSum = Object.values(byReferrer).reduce((a,v)=>a+v.profit,0);
  const grandTotal = businessBonusSum + xiaojiangTotal + referrerSum;

  const staffRows = Object.entries(byStaff).map(([name,v])=>`
    <tr><td>${escHtml(name)}</td><td>${v.count} 件</td><td class="amount-pos">${money(v.businessBonus)}</td></tr>`).join('');
  const referrerRows = Object.entries(byReferrer).map(([name,v])=>`

  return `

function computeFixedCost(mk){
  const list = APP.data.transactions.filter(t=>t.type==='expense' && monthKey(t.date)===mk && (t.mainCategory==='房租水電' || t.mainCategory==='薪資支出'));
  return sum(list);
}
function adSpendView(){
  const editable = canEdit();
  const list = APP.data.adSpend.slice().sort((a,b)=>b.month.localeCompare(a.month));
  const cs = APP.data.caseSettings;

  const rows = list.map(a=>{
    const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===a.month);
    const chCasesInMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===a.month);
    const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
    const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
    const spend = Number(a.spend||0);
    const adNetBeforeFixed = adRevenue - spend;
    const roi = spend===0 ? 0 : (adNetBeforeFixed - spend) / spend;
    const fixedCostThisMonth = computeFixedCost(a.month);
    const adTotalNet = adRevenue - fixedCostThisMonth - spend;
    const pilotBonus = Math.max(0, adTotalNet) * cs.pilotBonusRate;
    const adFinalNet = adTotalNet - pilotBonus;
    const companyFinalNet = adFinalNet + chProfit;
    const cpc = a.messages ? (spend/Number(a.messages)) : 0;
    const cpa = a.approved ? (spend/Number(a.approved)) : 0;
    const approveRate = a.submitted ? (Number(a.approved||0)/Number(a.submitted)) : 0;
    const submitRate = a.messages ? (Number(a.submitted||0)/Number(a.messages)) : 0;
    return `<tr>
      <td>${a.month}</td>
      <td>${money(a.spend)}</td>
      <td>${a.messages||'—'}</td>
      <td>${a.submitted||'—'}</td>
      <td>${a.approved||'—'}</td>
      <td>${cpc?money(cpc):'—'}</td>
      <td>${cpa?money(cpa):'—'}</td>
      <td>${approveRate?(approveRate*100).toFixed(1)+'%':'—'}</td>
      <td>${(roi*100).toFixed(1)}%</td>
      <td>${money(adRevenue)}</td>
      <td style="color:var(--muted);">${money(fixedCostThisMonth)}</td>
      <td class="${adTotalNet>=0?'amount-pos':'amount-neg'}">${money(adTotalNet)}</td>
      <td class="amount-neg">${money(pilotBonus)}</td>
      <td class="${adFinalNet>=0?'amount-pos':'amount-neg'}">${money(adFinalNet)}</td>
      <td class="${companyFinalNet>=0?'amount-pos':'amount-neg'}" style="font-weight:700;">${money(companyFinalNet)}</td>
      ${editable?`<td><div class="row-actions">
        <button class="icon-btn" data-action="edit-adspend" data-id="${a.id}">編輯</button>
        <button class="icon-btn" data-action="delete-adspend" data-id="${a.id}">刪除</button>
      </div></td>`:''}
    </tr>`;
  }).join('');

  return `
    <div class="page-header" style="margin-bottom:14px;">
      <div><p class="hint" style="color:var(--muted);font-size:12.5px;max-width:640px;">房租＋固定人事成本，由廣告線全額吸收，<b>自動抓收支明細裡當月「房租水電」＋「薪資支出」的實際加總</b>；廣告投手月獎金 ＝（廣告線案件利潤加總 − 固定成本 − 廣告投放金額）× ${(cs.pilotBonusRate*100).toFixed(0)}%，於每月 5 號發放，此區塊公式固定不開放手動調整。</p></div>
      ${editable?`<button class="btn primary" data-action="open-adspend-modal">＋ 新增月份資料</button>`:''}
    </div>
    <div class="table-wrap">
      ${list.length===0?`<div class="empty">尚無資料</div>`:`
      <table><thead><tr><th>月份</th><th>投放金額</th><th>私訊數</th><th>送件數</th><th>核准數</th><th>CPC</th><th>CPA</th><th>核准率</th><th>ROI</th><th>廣告線利潤</th><th>固定成本</th><th>廣告總淨利</th><th>投手月獎金(5號發)</th><th>廣告線最終淨利</th><th>全公司最終淨利</th>${editable?'<th></th>':''}</tr></thead>
      <tbody>${rows}</tbody></table>`}
    </div>
  `;
}

let modalOnSubmit = null;

function openConfirm(message, onConfirm){

}

function openAiImportModal(){
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-head"><h3>AI 貼上匯入收支</h3><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:0;">把收支相關的文字貼進來（記帳筆記、對話紀錄、收據內容都可以），AI 會幫你整理成一筆筆紀錄，確認後才會真正新增到系統。</p>
    <textarea id="ai-import-text" style="width:100%;min-height:140px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;" placeholder="例如：8/15 廣告費 iG投放 1200元&#10;8/16 收到王小明貸款仲介費 15000"></textarea>
    <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button>
    <button type="button" class="btn primary" id="ai-import-extract-btn">AI 解析</button></div>
    <div id="ai-import-result"></div>`;
  document.getElementById('ai-import-extract-btn').addEventListener('click', async ()=>{
    const text = document.getElementById('ai-import-text').value.trim();
    if(!text) return;
    const btn = document.getElementById('ai-import-extract-btn');
    btn.disabled = true; btn.textContent = '解析中…';
    document.getElementById('ai-import-result').innerHTML = '';
    try{
      const resp = await fetch(AI_WORKER_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          mode:'extract', text, today: todayStr(),
          categories: { expense: APP.data.categories.expense.map(c=>c.name), income: APP.data.categories.income.map(c=>c.name) }
        })
      });
      const data = await resp.json();
      let rows = null;
      try{
        let raw = (data.raw || '').trim();
        raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
        rows = JSON.parse(raw);
      }catch(e){ rows = null; }
      if(!rows || !Array.isArray(rows) || rows.length===0){
        document.getElementById('ai-import-result').innerHTML = `<div class="empty" style="padding:20px;">沒有辨識出可用的收支項目，請調整內容再試一次。</div>`;
      } else {
        renderAiImportPreview(rows);
      }
    }catch(e){
      document.getElementById('ai-import-result').innerHTML = `<div class="login-error">解析失敗，請稍後再試一次。</div>`;
    }
    btn.disabled = false; btn.textContent = 'AI 解析';
  });
}
function renderAiImportPreview(rows){
  const box = document.getElementById('ai-import-result');
  box.innerHTML = `<div id="ai-import-rows" style="margin-top:14px;max-height:260px;overflow-y:auto;">
    ${rows.map((r,i)=>buildTxRowHtml(r,i)).join('')}
  </div>
  <div class="modal-actions"><button type="button" class="btn primary" id="ai-import-confirm-btn">確認新增選取的紀錄</button></div>`;
  document.getElementById('ai-import-confirm-btn').addEventListener('click', ()=>{
    const rowEls = document.querySelectorAll('#ai-import-rows .tx-row');
    let count = 0;
    rowEls.forEach(rowEl=>{
      const chk = rowEl.querySelector('.ai-row-check');
      if(!chk.checked) return;
      const data = { note:'', pending:false };
      rowEl.querySelectorAll('.ai-row-field').forEach(f=>{ data[f.dataset.key] = f.value; });
      data.amount = Number(data.amount) || 0;
      APP.data.transactions.push(stamp({id:uid(), ...data}));
      count++;
    });
    if(count>0) saveTransactions();
    closeModal();
  });
}

      <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button type="submit" class="btn primary">儲存</button></div>
    </form>`;
  function recalc(){
    const ac = Number(document.getElementById('cc-afterCost').value)||0;
    const pp = Number(document.getElementById('cc-partnerProfit').value)||0;
    document.getElementById('cc-companyProfit-display').textContent = money(ac-pp);
  }
  document.getElementById('cc-afterCost').addEventListener('input', recalc);
  document.getElementById('cc-partnerProfit').addEventListener('input', recalc);
  document.getElementById('channel-case-form').addEventListener('submit',(e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const afterCost = Number(document.getElementById('cc-afterCost').value)||0;
    const partnerProfit = Number(document.getElementById('cc-partnerProfit').value)||0;
    const data = {
      date: fd.get('date'), customer: fd.get('customer'), plan: fd.get('plan'), staff: fd.get('staff'),
      source: fd.get('source'), referrer: fd.get('referrer'), profitPaid: fd.get('profitPaid')==='on',
      afterCost, partnerProfit, companyProfit: afterCost-partnerProfit, note: fd.get('note')
    };
    const wasPaidBefore = existing ? !!existing.profitPaid : false;
    if(existing) Object.assign(existing, stamp(data));
    else APP.data.casesChannel.push(stamp({id:uid(), linkedTxId:null, profitTxId:null, ...data}));
    const chRec = existing || APP.data.casesChannel[APP.data.casesChannel.length-1];
    if(data.profitPaid && !wasPaidBefore && !chRec.profitTxId){
      postBonusPayoutToTransactions(chRec, partnerProfit, `業務或通路利潤發放（${data.staff}／${data.customer}）`);
      chRec.profitTxId = chRec.bonusTxId; // reuse same tx-id field set by helper
    }
    saveCasesChannel(); closeModal();
  });
}

function buildFinanceContext(){
  const year = nowYear;
  const txThis = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year));
  const txLast = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year-1));
  const incThis = sum(txThis.filter(t=>t.type==='income'));
  const expThis = sum(txThis.filter(t=>t.type==='expense'));
  const incLast = sum(txLast.filter(t=>t.type==='income'));
  const expLast = sum(txLast.filter(t=>t.type==='expense'));

  function catSummary(list, type){
    const map={};
    list.filter(t=>t.type===type).forEach(t=>{ map[t.mainCategory]=(map[t.mainCategory]||0)+Number(t.amount||0); });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${money(v)}`);
    return rows.join('、') || '無';
  }

  const recent = APP.data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25)
    .map(t=>`${t.date} ${t.type==='income'?'收入':'支出'} ${t.mainCategory} ${money(t.amount)}${t.vendor?(' 對象:'+t.vendor):''}${t.note?(' 備註:'+t.note):''}`).join('\n');

  const assetsTotal = sum(APP.data.assets);
  const liabTotal = sum(APP.data.liabilities);
  const empActive = APP.data.hr.employees.filter(e=>e.status!=='resigned').length;

  /* ---- 業務案件與進度（本月） ---- */
  const progAdThis = APP.data.progressAd.filter(c=>monthKey(c.date)===nowMonthKey);
  const progChThis = APP.data.progressChannel.filter(c=>monthKey(c.date)===nowMonthKey);
  const allProgThis = [...progAdThis, ...progChThis];
  const doneCount = allProgThis.filter(c=>STATUS_DONE.includes(c.status)).length;
  const pendingCount = allProgThis.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const closedCount = allProgThis.filter(c=>STATUS_CLOSED.includes(c.status)).length;
  const statusMap = {};
  allProgThis.forEach(c=>{ statusMap[c.status]=(statusMap[c.status]||0)+1; });
  const statusSummary = Object.entries(statusMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${v}`).join('、');

  /* ---- 本月業務利潤排行 ---- */
  const profitByStaff = {};
  APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey).forEach(c=>{ const k=c.staff||'未填'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  APP.data.casesChannel.filter(c=>monthKey(c.date)===nowMonthKey).forEach(c=>{ const k=c.staff||'未填'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  const rankingLines = Object.entries(profitByStaff).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${money(v)}`).join('、');

  /* ---- 本月獎金發放狀況 ---- */
  const unpaidBonus = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey && !c.bonusPaid);
  const unpaidTotal = sum(unpaidBonus.map(c=>({amount:(Number(c.businessBonus)||0)+(Number(c.xiaojiangBonus)||0)})));
  const paidBonusTotal = sum(APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey && c.bonusPaid).map(c=>({amount:(Number(c.businessBonus)||0)+(Number(c.xiaojiangBonus)||0)})));

  /* ---- 廣告投放成效（近4個月） ---- */
  const adSpendSorted = APP.data.adSpend.slice().sort((a,b)=>b.month.localeCompare(a.month)).slice(0,4);
  const adSpendLines = adSpendSorted.map(a=>{
    const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===a.month);
    const chCasesInMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===a.month);
    const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
    const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
    const spend = Number(a.spend||0);
    const fixedCostThisMonth = computeFixedCost(a.month);
    const adTotalNet = adRevenue - fixedCostThisMonth - spend;
    const roi = spend===0?0:((adRevenue-spend)-spend)/spend;
    const cpc = a.messages? spend/Number(a.messages) : 0;
    const cpa = a.approved? spend/Number(a.approved) : 0;
    const approveRate = a.submitted? Number(a.approved||0)/Number(a.submitted) : 0;
    return `${a.month}：投放金額 ${money(spend)}，私訊數 ${a.messages||0}，送件數 ${a.submitted||0}，核准數 ${a.approved||0}，核准率 ${(approveRate*100).toFixed(1)}%，CPC ${cpc?money(cpc):'—'}，CPA ${cpa?money(cpa):'—'}，ROI ${(roi*100).toFixed(1)}%，廣告線案件利潤 ${money(adRevenue)}，固定成本(房租+薪資) ${money(fixedCostThisMonth)}，廣告總淨利 ${money(adTotalNet)}，通路線利潤 ${money(chProfit)}`;
  }).join('\n');

  return `公司：${APP.data.company.name || '（未設定）'}
${year}年度：收入 ${money(incThis)}，支出 ${money(expThis)}，淨損益 ${money(incThis-expThis)}
${year-1}年度：收入 ${money(incLast)}，支出 ${money(expLast)}
${year}年度支出分類：${catSummary(txThis,'expense')}
${year}年度收入分類：${catSummary(txThis,'income')}
資產總計：${money(assetsTotal)}，負債總計：${money(liabTotal)}，淨資產：${money(assetsTotal-liabTotal)}
在職員工人數：${empActive}
廠商數量：${APP.data.vendors.length}
最近25筆收支紀錄：
${recent || '無'}

【業務案件與進度】（本月 ${nowMonthKey}）
本月案件狀態：撥款完成 ${doneCount} 件、處理中 ${pendingCount} 件、婉拒/客拒 ${closedCount} 件
詳細狀態分布：${statusSummary || '無'}
本月業務利潤貢獻排行（含廣告線+通路線）：${rankingLines || '無'}
本月獎金：已發放 ${money(paidBonusTotal)}，尚未發放 ${unpaidBonus.length} 筆合計 ${money(unpaidTotal)}

【廣告投放成效】（近 ${adSpendSorted.length} 個月，由新到舊）
${adSpendLines || '無資料'}`;
}

/* 業務／行政專用的資料摘要——只包含本人自己的資料，完全不含公司財務數字、其他同事的資料 */
function buildStaffContext(){
  const meUid = APP.user.uid;
  const meName = myStaffName();
  const profile = APP.staffProfiles[meUid] || {};
  const thisMonth = nowMonthKey;

  const myAd = APP.data.progressAd.filter(c=>c.staff===meName && monthKey(c.date)===thisMonth);
  const myCh = APP.data.progressChannel.filter(c=>c.staff===meName && monthKey(c.date)===thisMonth);
  const myAll = [...myAd, ...myCh];
  const doneCount = myAll.filter(c=>STATUS_DONE.includes(c.status)).length;
  const pendingCount = myAll.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const closedCount = myAll.filter(c=>STATUS_CLOSED.includes(c.status)).length;
  const statusMap = {};
  myAll.forEach(c=>{ statusMap[c.status]=(statusMap[c.status]||0)+1; });
  const statusSummary = Object.entries(statusMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${v}`).join('、');

  const myEntries = APP.data.staffBonusLedger.filter(e=>e.staffName===meName && monthKey(e.date)===thisMonth);
  const byDay = {};
  myEntries.forEach(e=>{ const t=(Number(e.businessBonus)||0)+(Number(e.xiaojiangBonus)||0); byDay[e.date]=(byDay[e.date]||0)+t; });
  const monthTotal = Object.values(byDay).reduce((a,b)=>a+b,0);
  const dayLines = Object.entries(byDay).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,v])=>`${d}：${money(v)}`).join('\n');

  const myLogs = APP.data.personalProgress.filter(c=>c.staffUid===meUid && monthKey(c.date)===thisMonth);
  const myAttendance = APP.data.attendance.filter(a=>a.staffUid===meUid && monthKey(a.date)===thisMonth);
  const today = todayStr();
  const upcoming = APP.data.calendar.filter(c=>c.staffUid===meUid && c.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10)
    .map(c=>`${c.date} ${c.title}${c.note?('：'+c.note):''}`).join('\n');

  return `你正在跟「${meName || APP.userEmail}」對話，以下只有他自己的資料摘要（不包含公司財務、其他同事的資料，你也不知道其他人的任何數字，遇到問這類問題請說明你只看得到他自己的資料）：

本月底薪：${money(profile.baseSalary||0)}
本月案件狀態：撥款完成 ${doneCount} 件、處理中 ${pendingCount} 件、婉拒/客拒 ${closedCount} 件
詳細狀態分布：${statusSummary || '無'}
本月獎金累計：${money(monthTotal)}
每日獎金明細（由新到舊）：
${dayLines || '無'}
本月個人開發紀錄筆數：${myLogs.length} 筆
本月請假次數：${myAttendance.length} 次
即將到來的行程：
${upcoming || '無'}`;
}

function renderChat(){
  const panel = document.getElementById('ai-chat-panel');
  const box = document.getElementById('ai-chat-messages');
  if(!panel || !box) return;
  panel.classList.toggle('hidden', !APP.chatOpen);
  if(APP.chatMessages.length===0 && !APP.chatLoading){
    box.innerHTML = isCore()
      ? `<div class="ai-chat-empty">可以問財務、案件進度、業務排行、廣告投放成效（例如「這個月 ROI 怎麼樣」「哪個業務貢獻最多」），也可以請它給建議，或直接說要記一筆帳（例如「幫我記一筆 8/15 廣告費 1200」）。</div>`
      : isStaffSales()
        ? `<div class="ai-chat-empty">可以問你自己的案件進度、獎金、行程，也可以直接說要記一筆客戶開發記錄（例如「幫我記一筆，陳小姐 0912345678，在談和潤，客戶還在考慮」），AI 會幫你整理成一筆個人業務進度紀錄，確認後才會真的存進去。它只看得到你自己的資料。</div>`
        : `<div class="ai-chat-empty">可以問案件進度、獎金發放狀況，也可以直接說要登記一筆正式案件（例如「幫我新增一筆，王先生 0987654321，JET方案，指派給秉，狀態教照會」），AI 會幫你整理成一筆進度追蹤紀錄，確認後才會真的存進去。它只看得到進度追蹤資料，看不到財務數字。</div>`;
  } else {
    box.innerHTML = APP.chatMessages.map((m,i)=>{
      if(m.role==='user') return `<div class="ai-msg user">${escHtml(m.text)}</div>`;
      let inner = `<div class="ai-msg ai">${escHtml(m.text)}`;
      if(m.pendingTx && m.pendingTx.length>0 && !m.confirmed){
        const kind = m.pendingKind || 'tx';
        const rowBuilder = kind==='personallog' ? buildPersonalLogRowHtml : kind==='progresstrack' ? buildProgressTrackRowHtml : buildTxRowHtml;
        inner += `<div id="chat-pending-${i}" style="margin-top:10px;background:#fff;border-radius:8px;padding:8px;" data-kind="${kind}">
          ${m.pendingTx.map((r,j)=>rowBuilder(r,j)).join('')}
          <button type="button" class="btn primary sm" style="margin-top:6px;width:100%;" data-action="chat-tx-confirm" data-msgidx="${i}">確認新增選取的紀錄</button>
        </div>`;
      } else if(m.confirmed){
        inner += `<div style="margin-top:6px;color:var(--green);font-size:12px;">✓ 已新增 ${m.confirmedCount} 筆紀錄</div>`;
      }
      inner += `</div>`;
      return inner;
    }).join('') + (APP.chatLoading ? `<div class="ai-msg loading">AI 思考中…</div>` : '');
  }
  box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(question){
  APP.chatMessages.push({role:'user', text:question});
  APP.chatLoading = true;
  renderChat();
  try{
    const ctx = isCore() ? buildFinanceContext() : buildStaffContext();
    const resp = await fetch(AI_WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question, context: ctx, today: todayStr(),
        role: APP.role,
        categories: isCore() ? { expense: APP.data.categories.expense.map(c=>c.name), income: APP.data.categories.income.map(c=>c.name) } : { expense:[], income:[] },
        caseOptions: { plan: APP.data.caseSettings.planOptions, staff: APP.data.caseSettings.staffOptions, dealProduct: DEAL_PRODUCT_OPTIONS, contactStatus: CONTACT_STATUS_OPTIONS, status: STATUS_OPTIONS }
      })
    });
    const data = await resp.json();
    let text = data.answer || data.error || '沒有取得回應，請再試一次。';
    let rows = null;
    let pendingKind = 'tx';
    if(isCore()){
      const match = text.match(/<transactions>([\s\S]*?)<\/transactions>/i);
      if(match){
        try{ rows = JSON.parse(match[1].trim()); }catch(e){ rows = null; }
        text = text.replace(match[0], '').trim();
      }
    } else if(isStaffSales()){
      const match = text.match(/<personallog>([\s\S]*?)<\/personallog>/i);
      if(match){
        try{ rows = JSON.parse(match[1].trim()); }catch(e){ rows = null; }
        text = text.replace(match[0], '').trim();
      }
      pendingKind = 'personallog';
      text = text.replace(/<transactions>[\s\S]*?<\/transactions>/i, '').trim();
    } else if(isStaffAdmin()){
      const match = text.match(/<progresstrack>([\s\S]*?)<\/progresstrack>/i);
      if(match){
        try{ rows = JSON.parse(match[1].trim()); }catch(e){ rows = null; }
        text = text.replace(match[0], '').trim();
      }
      pendingKind = 'progresstrack';
      text = text.replace(/<transactions>[\s\S]*?<\/transactions>/i, '').trim();
    }
    APP.chatMessages.push({ role:'ai', text, pendingTx: (rows && Array.isArray(rows) && rows.length>0) ? rows : null, pendingKind });
  }catch(e){
    APP.chatMessages.push({role:'ai', text:'連線失敗，請確認網路連線後再試一次。'});
  }
  APP.chatLoading = false;
  renderChat();
}

      const rowEls = container.querySelectorAll('.tx-row');
      let count = 0;
      rowEls.forEach(rowEl=>{
        const chk = rowEl.querySelector('.ai-row-check');
        if(!chk.checked) return;
        const data = {};
        rowEl.querySelectorAll('.ai-row-field').forEach(f=>{ data[f.dataset.key] = f.value; });
        if(kind==='tx'){
          data.note = data.note || ''; data.pending = false;
          data.amount = Number(data.amount) || 0;
          APP.data.transactions.push(stamp({id:uid(), ...data}));
          count++;
        } else if(kind==='personallog'){
          data.customer = data.customer || '';

          }
          count++;
        }
      });
      if(kind==='tx' && count>0) saveTransactions();
      APP.chatMessages[msgIdx].confirmed = true;
      APP.chatMessages[msgIdx].confirmedCount = count;
      renderChat();
    }
    return;
  }
  if(e.target.id==='logout-btn' || e.target.id==='pending-logout'){ signOut(auth); return; }
  if(e.target.id==='forgot-link'){
    const emailInput = document.querySelector('#login-form input[name="email"]');

    if(!email){ APP.authError='請先在上方輸入你的電子郵件，再點一次「忘記密碼」'; renderRoot(); return; }

    updateDoc(doc(db,'users',uidTarget), { role: e.target.value }).then(()=>render());

  if(e.target.classList && e.target.classList.contains('display-name-input')){
    const uidTarget = e.target.dataset.uid;
    saveStaffProfile(uidTarget, { displayName: e.target.value.trim() });
    return;
  }
  if(e.target.classList && e.target.classList.contains('avatar-upload-input')){
    const uidTarget = e.target.dataset.uid;
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ alert('圖片太大，請選 5MB 以內的圖片'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width-minSide)/2, sy = (img.height-minSide)/2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        saveStaffProfile(uidTarget, { avatarDataUrl: dataUrl });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    return;
  }
});

    APP.data.company = { name:fd.get('name'), taxId:fd.get('taxId'), phone:fd.get('phone'), address:fd.get('address') };
    saveCompany(); return;
  }
  if(['asset-form','category-form','subcategory-form','employee-form','collab-form','history-form','vendor-form','case-option-form','adspend-form','export-year-form','personal-log-form','attendance-form','calendar-form'].includes(e.target.id)){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fd.forEach((v,k)=>{ data[k]=v; });
    if(modalOnSubmit) modalOnSubmit(data);
    closeModal();
  }
});
</script>
</body>
