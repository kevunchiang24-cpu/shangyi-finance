// 一次最多改 400 筆（Firestore 一批的上限是 500）
async function opBatch(col, recs, patch){
  for(let i=0; i<recs.length; i+=400){
    const batch = writeBatch(db);
    recs.slice(i, i+400).forEach(c=>{ batch.set(doc(db, col, c.id), stamp({ ...patch }), { merge:true }); Object.assign(c, patch); });
    await batch.commit();
  }
}
// 改名時，自己設定的顏色跟著帶到新名稱
function opMoveColors(cat, renames){
  const cur = APP.data.optionColors && APP.data.optionColors[cat]; if(!cur || !renames.length) return;
  const m = { ...cur }; let changed = false;
  renames.forEach(r=>{ if(m[r.from]){ if(!m[r.to]) m[r.to] = m[r.from]; delete m[r.from]; changed = true; } });
  if(!changed) return;
  const oc = { ...APP.data.optionColors, [cat]:m }; APP.data.optionColors = oc; saveOptionColors(oc).catch(()=>{});
}

// 找出改名：舊名稱 → 新名稱（新名稱跟其他保留下來的舊名稱一樣時不算改名）
function opRenames(){
  const kept = new Set(OP.rows.map(r=>r.name.trim()).filter(Boolean)), out = [];
  OP.rows.forEach(r=>{ const n = r.name.trim(); if(n && r.old && n!==r.old && !kept.has(r.old) && !out.some(x=>x.from===r.old)) out.push({ from:r.old, to:n }); });
  return out;
}
async function opSave(){
  const F = OP_FIELDS[OP.key], list = Array.from(new Set(OP.rows.map(r=>r.name.trim()).filter(Boolean))), renames = opRenames();
  OP.busy = true; opRender();
  try{ await F.save(list, renames); OP = null; opRender(); render(); plToast(renames.length ? `已儲存，${renames.map(r=>`「${r.from}」改成「${r.to}」`).join('、')}，舊資料一起改好了` : '已儲存'); }
  catch(err){ console.error('選項儲存失敗', err); OP.busy = false; OP.confirm = null; opRender(); alert('儲存失敗，請檢查網路後再試一次：' + (err && err.message ? err.message : err)); }
}

function pgEditor(c){
  if(!c || !c._by) return '';
  const u = (APP.users||[]).find(x=>x.email===c._by);
  const short = c._by.replace(/@.*/, '');
  const name = u ? (u.staffName || displayNameFor(u.id, short)) : short;
  const d = c._at ? new Date(c._at) : null;
  const t = d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
  return name + (t ? ' · '+t : '');
}
function pgOptColor(f, v){
  if(!v) return null;
  if(f==='plan' || f==='status'){ const c = colorForOption(v, f); return [c.bg, c.text]; } // 沿用「選單顏色設定」
  if(f==='source') return ocPair(ocOpt('pgSource', v)) || PG_SRC_COLOR[v] || PG_STAFF_COLOR;
  return ocPair(ocOpt('pgStaff', v)) || PG_STAFF_COLOR;
}
function pgOptGroups(f){
  if(f==='status') return PG_ST_GROUPS;
  if(f==='plan') return [['', pgPlans()]];
  if(f==='source') return [['', ['直客','通路']]];
  return [['', pgStaffOpts()]];
}

function pgInQuick(c){
  const S = pgS(), d = c.date||'';
  if(S.quick==='today') return d===todayStr();
  if(S.quick==='week'){ const t = new Date(); t.setDate(t.getDate()-((t.getDay()+6)%7)); return d>=formatDateLocal(t); }
  if(S.quick==='month') return d.startsWith(plThisM());
  if(S.quick.startsWith('m:') || S.quick.startsWith('y:')) return d.startsWith(S.quick.slice(2));
  return true;
}
function pgFiltered(){
  const S = pgS(), q = S.search.trim().toLowerCase();
  return pgList().filter(c=> (q ? true : S.stat ? PG_STATS[S.stat].f(c) : pgInQuick(c))
    && (S.group==='all' || (S.group==='open')===pgIsOpen(c.status))
    && (!S.status || c.status===S.status)
    && (!S.plan || c.plan===S.plan)
    && (!S.staff || c.staff===S.staff)
    && (!q || ['customer','phone','note','staffNote','plan','staff','referrer','status','source','wizardHatNote']
      .some(k=>String(c[k]||'').toLowerCase().includes(q))));
}
// 排序：先依月份分段（日期舊→新時月份也舊→新），月份內照選的欄位排；空白的一律排最後
function pgSorted(arr){
  const { key, dir } = pgS().sort, sign = dir==='asc' ? 1 : -1, ord = pgOrder();
  const cmp = (a, b)=>{
    const x = a[key]||'', y = b[key]||'';
    if(key==='date' || key==='_at') return x.localeCompare(y);
    if(ord[key]){ const ix = ord[key].indexOf(x), iy = ord[key].indexOf(y); return (ix<0?999:ix) - (iy<0?999:iy); }
    return plZh.compare(x, y);
  };
  const mSign = key==='date' ? sign : -1;
  return arr.slice().sort((a, b)=>{
    const mc = plMKey(a.date).localeCompare(plMKey(b.date)); if(mc) return mSign*mc;
    const x = a[key]||'', y = b[key]||''; if(!x !== !y) return x ? -1 : 1;
    return sign*cmp(a, b) || (b.date||'').localeCompare(a.date||'');
  });
}
const pgDirLabel = (k, d)=> (k==='date' || k==='_at') ? (d==='desc'?'新→舊':'舊→新') : pgOrder()[k] ? (d==='asc'?'照選單順序':'選單順序反過來') : (d==='asc'?'筆畫少→多':'筆畫多→少');
function pgQuickLabel(){
  const S = pgS(), q = S.quick;
  if(S.stat) return PG_STATS[S.stat].t;
  if(q.startsWith('m:')) return plMLabel(q.slice(2));
  if(q.startsWith('y:')) return q.slice(2)+' 全年';
  return { today:'今天', week:'本週', month:plMLabel(plThisM()), all:'全部日期' }[q];
}
function pgSummary(){
  if(lxSearching(pgS())) return '搜尋中・全部日期';
  const S = pgS();
  return `${pgQuickLabel()}・${S.status || { all:'全部狀態', open:'未結案', closed:'已結案' }[S.group]}${S.plan?'・'+S.plan:''}${S.staff?'・'+S.staff:''}`;
}
// 依內容區寬度選排版：寬＝完整表格；中＝「最後編輯」併到客戶欄；窄（或手機）＝卡片
function pgLayout(){
  if(plIsMobile()) return 'cards';
  const main = document.getElementById('main');
  let w = window.innerWidth;
  if(main){ const cs = getComputedStyle(main); w = main.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0); }
  return w < 860 ? 'cards' : w < 1100 ? 'compact' : 'table';
}

    : '沒有符合的案件，換個篩選條件看看。';

function pgFilterPicker(k){
  const S = pgS();
  const btn = (val, label, on, c, long)=>{ c = c || PL_NEUTRAL; long = long===undefined ? label.length>6 : long;
    return `<button type="button" class="pl-pill${long?' long':''}" data-pg-fpick="${k}" data-pg-val="${escAttr(val)}" aria-pressed="${on}" style="background:${c[0]};color:${c[1]};">${on?'✓ ':''}${escHtml(label)}</button>`; };
  const sec = (t, html)=>`<div class="pl-pickgrp">${t}</div><div class="pl-picks">${html}</div>`;
  if(k==='group') return sec('範圍', [['all','全部'],['open','未結案'],['closed','已結案']].map(([v,t])=>btn('g:'+v, t, !S.status && S.group===v)).join(''))
    + PG_ST_GROUPS.map(([g, a])=>sec('只看一種・'+g, a.map(s=>btn('s:'+s, s, S.status===s, pgOptColor('status', s))).join(''))).join('');
  if(k==='plan') return `<div class="pl-picks">${btn('', '全部方案', !S.plan)}${pgPlans().map(p=>btn(p, p, S.plan===p, pgOptColor('plan', p))).join('')}</div>`;
  if(k==='staff'){
    const names = Array.from(new Set(pgAll(pgKind()).map(c=>c.staff).filter(Boolean))).sort(plZh.compare);
    const inner = names.filter(n=>pgStaffOpts().includes(n)), outer = names.filter(n=>!pgStaffOpts().includes(n));
    return `<div class="pl-picks">${btn('', '全部', !S.staff)}</div>` + (inner.length ? sec('公司業務', inner.map(n=>btn(n, n, S.staff===n)).join('')) : '')
      + (outer.length ? sec('通路夥伴', outer.map(n=>btn(n, n, S.staff===n)).join('')) : '');
  }
  if(k==='month'){
    // 先選年、再選月：年份一排（新到舊），下面固定 12 格月份
    const L = pgList();
    const cur = S.stat ? '' : S.quick==='month' ? plThisM() : S.quick.startsWith('m:') ? S.quick.slice(2) : '';
    const years = Array.from(new Set(L.map(c=>(c.date||'').slice(0,4)).filter(Boolean).concat([plThisY()]))).sort().reverse();
    const py = S.pickYear || (cur || (S.quick.startsWith('y:') ? S.quick.slice(2) : plThisY())).slice(0,4);
    const n = p => L.filter(c=>(c.date||'').startsWith(p)).length;
    const months = Array.from({length:12}, (_, i)=>`${py}-${String(i+1).padStart(2,'0')}`);
    const mBtn = mk=>{
      const cnt = n(mk), on = cur===mk, now = mk===plThisM(), off = !cnt && !now;
      return `<button type="button" class="pl-pill mcell${now?' now':''}" data-pg-fpick="month" data-pg-val="m:${mk}" aria-pressed="${on}" ${off?'disabled':''}>${on?'✓ ':''}${Number(mk.slice(5))} 月<small>${now?`本月・${cnt}`:`${cnt} 件`}</small></button>`;
    };
    return `<div class="pl-picks">${btn('all','全部月份', S.quick==='all' && !S.stat)}</div>`
      + `<div class="pl-pickgrp">年份</div><div class="pl-picks yrs">${years.map(y=>`<button type="button" class="pl-pill ycell" data-pg-fpick="month" data-pg-val="py:${y}" aria-pressed="${y===py}">${y}</button>`).join('')}</div>`
      + `<div class="pl-pickgrp">${py} 年${py===plThisY()?'（今年）':''}</div>`
      + `<div class="pl-picks">${btn('y:'+py, `${py} 全年（${n(py)} 件）`, !S.stat && S.quick==='y:'+py, PL_NEUTRAL, false).replace('class="pl-pill', 'class="pl-pill wide')}</div>`
      + `<div class="pl-picks mgrid">${months.map(mBtn).join('')}</div>`;
  }
  return sec('依哪一欄排序', PG_SORTS.map(([v,t])=>btn('k:'+v, t, S.sort.key===v)).join(''))
    + sec('順序', ((S.sort.key==='date' || S.sort.key==='_at') ? ['desc','asc'] : ['asc','desc']).map(d=>btn('d:'+d, pgDirLabel(S.sort.key, d), S.sort.dir===d)).join(''));
}

    return `<button type="button" class="pl-pill${o.length>6?' long':''}" data-pg-pick="${escAttr(o)}" data-pg-pt="${escAttr(target)}" data-pg-f="${f}" aria-pressed="${cur===o}" style="background:${c[0]};color:${c[1]};">${cur===o?'✓ ':''}${escHtml(o)}</button>`; }).join('')}</div>`;

function pgShouldDefer(){
  const S = pgS(); if(S._force) return false;

    if(pgTyping()) return;

function pgUpdate(kind, id, patch){
  const c = pgAll(kind).find(x=>x.id===id);
  const was = c ? (c.status||'') : '';
  let extra = '', followup = false;
  if('status' in patch && patch.status!==was){
    if(patch.status==='對保'){ patch.guarantorStatusDate = todayStr(); extra = '，已記下對保日期'; }
    if(patch.status==='撥款完成'){ patch.disbursedDate = todayStr(); extra = '，已記下撥款日期'; followup = true; }
  }
  const full = stamp(patch);
  if(c) Object.assign(c, full);
  updateDoc(doc(db, pgCol(kind), id), full).catch(pgFail);
  if(c && followup && ensureFollowupOnDisbursed(c, kind)) extra += '並建立客戶關懷追蹤';
  return extra;
}
function pgOpenNew(base){

function pgSaveModal(next){
  const S = pgS(), M = S.modal; if(!M) return;
  pgCaptureForm();
  const r = M.rec, kind = M.kind, keys = kind==='channel' ? PG_KEYS_CH : PG_KEYS_AD;
  if(!(r.customer||'').trim()){ M.err = '請填客戶姓名'; pgRender(); const el = document.getElementById('pg-fName'); if(el) el.focus(); return; }
  if(!r.date){ M.err = '請選日期'; pgRender(); return; }
  M.err = '';
  if(M.edit){
    const c = pgAll(kind).find(x=>x.id===r.id);
    if(!c){ S.modal = null; pgRender(); plToast('這筆案件已經被刪除了'); return; }
    // 只寫有改的欄位；只差前後空白不算改（舊資料有些尾巴帶空白，不要因為按儲存就被改掉）
    const patch = {};
    keys.forEach(k=>{
      const a = r[k]||'', o = M.orig[k]||'';
      if(a===o || (k!=='note' && a.trim()===o.trim())) return;
      patch[k] = k==='note' ? a : a.trim();
    });
    const n = Object.keys(patch).length, extra = n ? pgUpdate(kind, c.id, patch) : '';
    S.modal = null; pgRender();
    plToast(n ? `已儲存「${r.customer.trim()}」${extra}` : '沒有變更');
    return;
  }
  const rec = stamp({ id:uid(), ...keys.reduce((o, k)=>(o[k] = k==='note' ? (r[k]||'') : (r[k]||'').trim(), o), {}) });
  if(!rec.status) rec.status = '教照會';
  if(kind==='channel' && !rec.source) rec.source = '直客';
  let extra = '';
  if(rec.status==='對保'){ rec.guarantorStatusDate = todayStr(); extra = '，已記下對保日期'; }
  if(rec.status==='撥款完成'){ rec.disbursedDate = todayStr(); extra = '，已記下撥款日期'; }
  (kind==='channel' ? saveProgressChannelCase : saveProgressAdCase)(rec).catch(pgFail);
  if(rec.status==='撥款完成' && ensureFollowupOnDisbursed(rec, kind)) extra += '並建立客戶關懷追蹤';
  if(next){ pgOpenNew({ date:rec.date, plan:rec.plan, staff:rec.staff, ...(kind==='channel' ? { source:rec.source } : {}) }); plToast(`已新增「${rec.customer}」${extra}，接著填下一筆`); }
  else { S.modal = null; pgRender(); plToast(`已新增「${rec.customer}」${extra}`); if(M.pa) paNext('pg', true); }
}

const BK_LABEL = { customerName:'客戶姓名', phone:'電話', status:'狀態', owner:'誰的客人', channel:'送件管道', packJob:'包工作', plan:'方案', approvedAmount:'核准額度', note:'狀態備註' };
const BK_SORTS = [['date','日期'],['customerName','客戶'],['status','狀態'],['owner','誰的客人'],['channel','送件管道'],['packJob','包工作'],['plan','方案'],['approvedAmount','核准額度'],['note','狀態備註']];
// 各欄寬度（%）：#、日期、客戶、狀態、誰的客人、管道、包工作、方案、核准額度、狀態備註、編輯/刪除（管道、包工作分兩欄，每列只要一行高）
const BK_COLW = [3, 6, 11, 13, 8, 9, 9, 12, 6, 14, 9];
const BK_COLW_C = [3, 7, 12, 13, 10, 10, 12, 7, 16, 10]; // 中等寬度（約 1280 螢幕）：管道、包工作疊在同一欄，誰的客人才放得下
const BK_TEXT_KEYS = ['status','date','owner','customerName','phone','packJob','channel','plan','note'];
// 統計卡：評估、送件中、對保、培養中＝現在手上的案件（不分月份）；本月撥款照撥款日期
const BK_STATS = {
  eval:    { t:'評估／等確定', note:'不分月份', f:c=>bkGroupOf(c.status)==='eval' },
  sent:    { t:'送件中', note:'不分月份', f:c=>bkGroupOf(c.status)==='sent' },
  sign:    { t:'對保', note:'不分月份', f:c=>bkGroupOf(c.status)==='sign' },
  nurture: { t:'培養中', note:'不分月份', f:c=>bkGroupOf(c.status)==='nurture' },
  paid:    { t:'本月撥款', f:c=>c.status==='撥款完成' && (c.disbursedDate||c.date||'').startsWith(plThisM()) },
};

function bkS(){
  if(!APP.bk) APP.bk = { quick:'month', group:'active', status:'', pack:'', owner:'', channel:'', stat:'', search:'', limit:20, filterOpen:false,
    pop:null, pickYear:'', sort:{key:'date', dir:'desc'}, delRow:null, modal:null, pending:false, _force:false };
  return APP.bk;
}
const bkAll = () => APP.data.bankLoanCases || [];
function bkGroupOf(s){
  const t = String(s||'').trim();
  if(!t) return 'eval';
  const g = (APP.bankLoanStatusGroups||{})[t];
  if(g && BK_GROUPS.some(x=>x[0]===g)) return g;
  const hit = BANKLOAN_STATUSES.find(x=>x[0]===t);
  if(hit) return BK_BUILTIN_GROUP[hit[3]];
  return BK_DEFAULT_GROUP[t] || 'sent';
}
const bkIsEnded = s => bkGroupOf(s)==='end';
const bkAmt = v => (v===null || v===undefined || v==='') ? '' : String(v);
function bkOptColor(f, v){
  if(!v) return null;
  if(f==='status') return bankLoanStatusColor(v); // 沿用狀態選項設定的顏色
  if(f==='packJob'){ const cu = ocPair(ocOpt('bkPack', v)); if(cu) return cu; const p = BK_PACK.find(x=>x[0]===v); return p ? [p[1], p[2]] : PL_NEUTRAL; }
  return ocPair(ocOpt('bkChannel', v)) || ['#F1F3F7','#2B3245'];
}
function bkOptGroups(f){
  if(f==='status'){ const list = bankLoanStatusList(); return BK_GROUPS.map(([g, n])=>[n, list.filter(s=>bkGroupOf(s)===g)]).filter(x=>x[1].length); }
  if(f==='packJob') return [['', BK_PACK.map(p=>p[0])]];
  return [['', bkChannels()]];
}

function bkInQuick(c){
  const S = bkS(), d = c.date||'';
  if(S.quick==='today') return d===todayStr();
  if(S.quick==='week'){ const t = new Date(); t.setDate(t.getDate()-((t.getDay()+6)%7)); return d>=formatDateLocal(t); }
  if(S.quick==='month') return d.startsWith(plThisM());
  if(S.quick.startsWith('m:') || S.quick.startsWith('y:')) return d.startsWith(S.quick.slice(2));
  return true;
}
function bkFiltered(){
  const S = bkS(), q = S.search.trim().toLowerCase();
  return bkAll().filter(c=> (q ? true : S.stat ? BK_STATS[S.stat].f(c) : bkInQuick(c))
    && (q || S.stat || S.group==='all' || (S.group==='ended')===bkIsEnded(c.status))
    && (!S.status || c.status===S.status)
    && (!S.pack || (S.pack==='__none__' ? !c.packJob : c.packJob===S.pack))
    && (!S.owner || c.owner===S.owner)
    && (!S.channel || c.channel===S.channel)
    && (!q || ['customerName','phone','owner','channel','plan','note','status','packJob','approvedAmount']
      .some(k=>String(c[k]==null?'':c[k]).toLowerCase().includes(q))));
}
// 排序：先依月份分段，月份內照選的欄位排；空白的一律排最後
function bkSorted(arr){
  const { key, dir } = bkS().sort, sign = dir==='asc' ? 1 : -1, ord = bankLoanStatusList();
  const val = c => key==='approvedAmount' ? bkAmt(c.approvedAmount) : (c[key]||'');
  const cmp = (a, b)=>{
    const x = val(a), y = val(b);
    if(key==='date') return x.localeCompare(y);
    if(key==='approvedAmount') return Number(x) - Number(y);
    if(key==='status'){ const ix = ord.indexOf(x), iy = ord.indexOf(y); return (ix<0?999:ix) - (iy<0?999:iy); }
    return plZh.compare(x, y);
  };
  const mSign = key==='date' ? sign : -1;
  return arr.slice().sort((a, b)=>{
    const mc = plMKey(a.date).localeCompare(plMKey(b.date)); if(mc) return mSign*mc;
    const x = val(a), y = val(b); if(!x !== !y) return x ? -1 : 1;
    return sign*cmp(a, b) || (b.date||'').localeCompare(a.date||'');
  });
}
const bkDirLabel = (k, d)=> k==='date' ? (d==='desc'?'新→舊':'舊→新') : k==='approvedAmount' ? (d==='asc'?'少→多':'多→少') : k==='status' ? (d==='asc'?'照選單順序':'選單順序反過來') : (d==='asc'?'筆畫少→多':'筆畫多→少');
function bkQuickLabel(){
  const S = bkS(), q = S.quick;
  if(S.stat) return BK_STATS[S.stat].t;
  if(q.startsWith('m:')) return plMLabel(q.slice(2));
  if(q.startsWith('y:')) return q.slice(2)+' 全年';
  return { today:'今天', week:'本週', month:plMLabel(plThisM()), all:'全部日期' }[q];
}
const bkPackLabel = v => v==='__none__' ? '未定' : v;
function bkSummary(){
  if(lxSearching(bkS())) return '搜尋中・全部日期';
  const S = bkS();
  return `${bkQuickLabel()}${S.stat ? '' : '・'+(S.status || { active:'進行中', ended:'已結束', all:'全部狀態' }[S.group])}${S.pack?'・'+bkPackLabel(S.pack):''}${S.owner?'・'+S.owner:''}${S.channel?'・'+S.channel:''}`;
}
function bkLayout(){
  if(plIsMobile()) return 'cards';
  const main = document.getElementById('main');
  let w = window.innerWidth;
  if(main){ const cs = getComputedStyle(main); w = main.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0); }
  return w < 900 ? 'cards' : w < 1100 ? 'compact' : 'table';
}
function bkEditor(c){
  if(!c || !c._by) return '';
  const u = (APP.users||[]).find(x=>x.email===c._by);
  const short = c._by.replace(/@.*/, '');
  const name = u ? (u.staffName || displayNameFor(u.id, short)) : short;
  const d = c._at ? new Date(c._at) : null;
  const t = d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
  return name + (t ? ' · '+t : '');
}

// ---- 畫面片段 ----
function bkPickBtn(c, f, target){
  const v = c[f]||'', col = bkOptColor(f, v);
  const empty = { status:'選狀態', packJob:'未定', channel:'選管道' }[f];
  return `<button type="button" class="pl-inl${f==='status' ? '' : ' pr'}${v?'':' empty'}" data-bk-pk="${escAttr(target||c.id)}" data-bk-f="${f}" aria-haspopup="true" aria-label="${escAttr((c.customerName||'')+' 的'+BK_LABEL[f]+'：'+(v||'未填'))}" style="${col?`background-color:${col[0]};color:${col[1]};`:''}">${escHtml(v||empty)}</button>`;
}
function bkTxt(c, f, ph, cls, area, list){
  const aria = escAttr((c.customerName||'')+' 的'+BK_LABEL[f]);
  if(area) return `<textarea class="pl-t bk-t ${cls||''}" rows="1" data-bk-id="${escAttr(c.id)}" data-bk-t="${f}" placeholder="${ph}" aria-label="${aria}">${plTa(c[f])}</textarea>`;
  const v = f==='approvedAmount' ? bkAmt(c[f]) : (c[f]||'');
  return `<input type="text" class="pl-t bk-t ${cls||''}" ${list?`list="${list}"`:''} ${f==='approvedAmount'?'inputmode="decimal"':''} data-bk-id="${escAttr(c.id)}" data-bk-t="${f}" value="${escAttr(v)}" placeholder="${ph}" aria-label="${aria}"/>`;
}
function bkDelCtl(c){
  if(bkS().delRow===c.id) return `<div class="pl-confirm">確定刪除「${escHtml(c.customerName||'')}」？<button type="button" class="pl-btn danger" data-bk-delyes="${escAttr(c.id)}">刪除</button><button type="button" class="pl-btn sec" data-bk-delno>不要刪</button></div>`;
  return `<button type="button" class="pl-del" data-bk-del="${escAttr(c.id)}">刪除</button>`;
}
const bkActs = c => `<div class="pl-acts"><button type="button" class="pl-link" data-bk-open="${escAttr(c.id)}">編輯</button>${bkDelCtl(c)}</div>`;
const bkFBtn = (k, label, cls) => `<button type="button" class="pl-fpk${cls?' '+cls:''}" data-bk-fk="${k}" aria-haspopup="true">${escHtml(label)}</button>`;
const bkSortBtn = () => { const S = bkS(); return bkFBtn('sort', `⇅ ${BK_SORTS.find(s=>s[0]===S.sort.key)[1]}・${bkDirLabel(S.sort.key, S.sort.dir)}`, 'pl-sortsel'); };

function bkStatsHTML(){
  const S = bkS(), L = bkAll();
  return `<div class="pl-stats pg-stats">${Object.keys(BK_STATS).map(k=>{ const s = BK_STATS[k];
    return `<button type="button" class="pl-stat" data-bk-stat="${k}" aria-pressed="${!lxSearching(S) && S.stat===k}"><div class="k">${s.t}</div><div class="v">${L.filter(s.f).length}${s.note?`<small class="pg-vnote">${s.note}</small>`:''}</div></button>`; }).join('')}</div>`;
}
function bkFilterHTML(m){
  const S = bkS();

  const sels = bkFBtn('month', `月份：${S.quick.startsWith('m:')||S.quick.startsWith('y:') ? bkQuickLabel() : S.quick==='month' ? '本月' : '全部月份'}`)
    + bkFBtn('group', `狀態：${S.status || {active:'進行中', ended:'已結束', all:'全部'}[S.group]}`)
    + bkFBtn('pack', `包工作：${S.pack ? bkPackLabel(S.pack) : '全部'}`)
    + bkFBtn('owner', `誰的客人：${S.owner||'全部'}`)
    + bkFBtn('channel', `管道：${S.channel||'全部'}`);

    ${S.filterOpen ? `<div class="pl-panel">${sels}<button type="button" class="pl-btn sec" data-bk-ftoggle>完成</button></div>` : ''}`;

function bkRowsHTML(all, layout){
  const S = bkS(), rows = all.slice(0, S.limit);
  const more = all.length > S.limit ? `<button type="button" class="pl-btn sec pl-more" data-bk-more>顯示更多（還有 ${all.length-S.limit} 件）</button>` : '';

      ${c.plan ? `<div class="bk-lbl">方案</div>${bkTxt(c,'plan','方案','nbox',true)}` : ''}
      ${bkTxt(c,'note','狀態備註','nbox',true)}
      ${S.delRow===c.id ? bkDelCtl(c) : `<div class="foot"><span>${lxDateCtl('bk', c, true)}${bkAmt(c.approvedAmount) ? `・核准 <b class="bk-amtb">${escHtml(bkAmt(c.approvedAmount))} 萬</b>` : ''}</span>${bkActs(c)}</div>`}
    </div>`, (k, n)=>`<div class="pl-mhead pl-mlabel">${k}<span class="pl-sub">${n} 件</span></div>`, (y, n)=>`<div class="pl-yhead">${y}<span class="pl-sub">共 ${n} 件</span></div>`)}</div>${more}`;
  const th = (k, t)=>{ const on = S.sort.key===k; return `<th${k==='approvedAmount'?' class="bk-amt"':''}><button type="button" class="pl-thbtn${on?' on':''}" data-bk-sort="${k}" aria-label="依${t}排序">${t}<span>${on?(S.sort.dir==='asc'?'▲':'▼'):'↕'}</span></button></th>`; };
  const compact = layout==='compact', span = compact ? 10 : 11;
  const cols = compact ? BK_SORTS.filter(s=>s[0]!=='packJob') : BK_SORTS;
  return `<div class="pl-tablewrap"><table class="pl-table pg-table bk-table">
    <colgroup>${(compact ? BK_COLW_C : BK_COLW).map(w=>`<col style="width:${w}%">`).join('')}</colgroup>
    <thead><tr><th class="no">#</th>${cols.map(([k,t])=>th(k, { channel:'管道', approvedAmount:'額度(萬)' }[k] || t)).join('')}<th></th></tr></thead>
    <tbody>${plWithMonths(all, rows, (c, i)=>`<tr>
      <td class="no">${i+1}</td>

        : `<td class="bk-pc">${bkPickBtn(c,'channel')}</td><td class="bk-pc">${bkPickBtn(c,'packJob')}</td>`}
      <td>${bkTxt(c,'plan','方案','',true)}</td>
      <td class="bk-amt">${bkTxt(c,'approvedAmount','—')}</td>
      <td>${bkTxt(c,'note','點擊輸入備註','',true)}</td>
      <td>${S.delRow===c.id ? bkDelCtl(c) : bkActs(c)}</td>
    </tr>`, (k, n)=>`<tr class="pl-mrow"><td colspan="${span}"><div class="pl-mlabel">${k}<span class="pl-sub">${n} 件</span></div></td></tr>`,

}
function bkListHTML(all, layout){
  const S = bkS(), L = bkAll();
  const count = lxSearching(S) ? lxSearchNote('bk', all.length, '件') : `<div class="pl-count">符合 <b>${all.length}</b> 件・全部 <b>${L.length}</b> 件</div>`;

  const msg = !L.length ? '尚無銀行信貸案件，按「＋ 新增案件」開始登記。'
    : S.quick==='month' && !S.stat && !L.some(c=>(c.date||'').startsWith(plThisM())) ? `${plMLabel(plThisM())}還沒有案件。要看上個月，點「月份」選。`
    : '沒有符合的案件，換個篩選條件看看。';
  return count + `<div class="pl-empty">${msg}</div>`;
}
function bkFilterPicker(k){
  const S = bkS();
  const btn = (val, label, on, c, long)=>{ c = c || PL_NEUTRAL; long = long===undefined ? label.length>6 : long;
    return `<button type="button" class="pl-pill${long?' long':''}" data-bk-fpick="${k}" data-bk-val="${escAttr(val)}" aria-pressed="${on}" style="background:${c[0]};color:${c[1]};">${on?'✓ ':''}${escHtml(label)}</button>`; };
  const sec = (t, html)=>`<div class="pl-pickgrp">${t}</div><div class="pl-picks">${html}</div>`;
  if(k==='group') return sec('範圍', [['active','進行中'],['ended','已結束'],['all','全部']].map(([v,t])=>btn('g:'+v, t, !S.status && S.group===v)).join(''))
    + bkOptGroups('status').map(([g, a])=>sec('只看一種・'+g, a.map(s=>btn('s:'+s, s, S.status===s, bkOptColor('status', s))).join(''))).join('');
  if(k==='pack') return `<div class="pl-picks">${btn('', '全部', !S.pack)}${BK_PACK.map(p=>btn(p[0], p[0], S.pack===p[0], [p[1], p[2]])).join('')}${btn('__none__', '未定', S.pack==='__none__')}</div>`;
  if(k==='owner' || k==='channel'){
    const names = Array.from(new Set(bkAll().map(c=>c[k]).concat(k==='channel' ? bkChannels() : []).filter(Boolean))).sort(plZh.compare);
    return `<div class="pl-picks">${btn('', '全部', !S[k])}${names.map(n=>btn(n, n, S[k]===n)).join('')}</div>`;
  }
  if(k==='month'){
    const L = bkAll();
    const cur = S.stat ? '' : S.quick==='month' ? plThisM() : S.quick.startsWith('m:') ? S.quick.slice(2) : '';
    const years = Array.from(new Set(L.map(c=>(c.date||'').slice(0,4)).filter(Boolean).concat([plThisY()]))).sort().reverse();
    const py = S.pickYear || (cur || (S.quick.startsWith('y:') ? S.quick.slice(2) : plThisY())).slice(0,4);
    const n = p => L.filter(c=>(c.date||'').startsWith(p)).length;
    const months = Array.from({length:12}, (_, i)=>`${py}-${String(i+1).padStart(2,'0')}`);
    const mBtn = mk=>{
      const cnt = n(mk), on = cur===mk, now = mk===plThisM(), off = !cnt && !now;
      return `<button type="button" class="pl-pill mcell${now?' now':''}" data-bk-fpick="month" data-bk-val="m:${mk}" aria-pressed="${on}" ${off?'disabled':''}>${on?'✓ ':''}${Number(mk.slice(5))} 月<small>${now?`本月・${cnt}`:`${cnt} 件`}</small></button>`;
    };
    return `<div class="pl-picks">${btn('all','全部月份', S.quick==='all' && !S.stat)}</div>`
      + `<div class="pl-pickgrp">年份</div><div class="pl-picks yrs">${years.map(y=>`<button type="button" class="pl-pill ycell" data-bk-fpick="month" data-bk-val="py:${y}" aria-pressed="${y===py}">${y}</button>`).join('')}</div>`
      + `<div class="pl-pickgrp">${py} 年${py===plThisY()?'（今年）':''}</div>`
      + `<div class="pl-picks">${btn('y:'+py, `${py} 全年（${n(py)} 件）`, !S.stat && S.quick==='y:'+py, PL_NEUTRAL, false).replace('class="pl-pill', 'class="pl-pill wide')}</div>`
      + `<div class="pl-picks mgrid">${months.map(mBtn).join('')}</div>`;
  }
  return sec('依哪一欄排序', BK_SORTS.map(([v,t])=>btn('k:'+v, t, S.sort.key===v)).join(''))
    + sec('順序', (S.sort.key==='date' ? ['desc','asc'] : ['asc','desc']).map(d=>btn('d:'+d, bkDirLabel(S.sort.key, d), S.sort.dir===d)).join(''));
}
function bkPicker(f, cur, target){

    return `<button type="button" class="pl-pill${o.length>6?' long':''}" data-bk-pick="${escAttr(o)}" data-bk-pt="${escAttr(target)}" data-bk-f="${f}" aria-pressed="${cur===o}" style="background:${c[0]};color:${c[1]};">${cur===o?'✓ ':''}${escHtml(o)}</button>`; }).join('')}</div>`;

}
function bkPopHTML(){
  const S = bkS(); if(!S.pop) return '';

function bkUpdate(id, patch){
  const c = bkAll().find(x=>x.id===id);
  let extra = '';
  if('status' in patch && c && patch.status!==(c.status||'') && patch.status==='撥款完成'){ patch.disbursedDate = todayStr(); extra = '，已記下撥款日期'; }

function bkSaveModal(next){
  const S = bkS(), M = S.modal; if(!M) return;
  bkCaptureForm();
  const r = M.rec;
  if(!(r.customerName||'').trim()){ M.err = '請填客戶姓名'; bkRender(); const el = document.getElementById('bk-fName'); if(el) el.focus(); return; }
  const amt = bkParseAmt(r.approvedAmount);
  if(amt===undefined){ M.err = '核准額度請填數字（單位：萬）'; bkRender(); return; }
  M.err = '';
  if(M.edit){
    const c = bkAll().find(x=>x.id===r.id);
    if(!c){ S.modal = null; bkRender(); plToast('這筆案件已經被刪除了'); return; }
    // 只寫有改的欄位；只差前後空白不算改
    const patch = {};
    BK_TEXT_KEYS.forEach(k=>{
      const a = String(r[k]==null?'':r[k]), o = String(M.orig[k]==null?'':M.orig[k]);
      if(a===o || (k!=='note' && k!=='plan' && a.trim()===o.trim())) return;
      patch[k] = (k==='note' || k==='plan') ? a : a.trim();
    });
    const oAmt = M.orig.approvedAmount==='' || M.orig.approvedAmount==null ? null : Number(M.orig.approvedAmount);
    if(amt!==oAmt) patch.approvedAmount = amt;
    const n = Object.keys(patch).length, extra = n ? bkUpdate(c.id, patch) : '';
    S.modal = null; bkRender();
    plToast(n ? `已儲存「${r.customerName.trim()}」${extra}` : '沒有變更');
    return;
  }
  const rec = stamp({ id:uid(), ...BK_TEXT_KEYS.reduce((o, k)=>(o[k] = (k==='note' || k==='plan') ? String(r[k]||'') : String(r[k]||'').trim(), o), {}), approvedAmount:amt });
  if(!rec.status) rec.status = '評估中';
  let extra = '';
  if(rec.status==='撥款完成'){ rec.disbursedDate = todayStr(); extra = '，已記下撥款日期'; }
  saveBankLoanCase(rec).catch(bkFail);
  if(next){ bkOpenNew({ date:rec.date, owner:rec.owner, channel:rec.channel, packJob:rec.packJob }); plToast(`已新增「${rec.customerName}」${extra}，接著填下一筆`); }
  else { S.modal = null; bkRender(); plToast(`已新增「${rec.customerName}」${extra}`); if(M.pa) paNext('bk', true); }
}

   - 方案只要內容有變，後端就會推播到 LINE（onValuationCaseWritten）→ 方案不在列表上直接打字，點開專用框按「儲存並推播」才存

const VA_CATS = [['銀行','#E6F1FA','#1E5A85'],['民間','#FDF0E1','#8A4B0F']];
const VA_LABEL = { customerName:'客戶姓名', handler:'經手人', status:'狀態', category:'類別', area:'地址', valuation:'估價資訊', plan:'方案', memo:'備註' };

// 各欄寬度（%）：#、日期、客戶（＋類別）、經手人、狀態、地址、估價資訊、方案、備註、編輯/刪除
const VA_COLW = [3, 6, 10, 8, 10, 12, 10, 15, 17, 9];
const VA_COLW_C = [3, 7, 14, 11, 13, 10, 16, 17, 9]; // 中等寬度（約 1280 螢幕）：沒有經手人欄，經手人放在客戶欄的類別旁邊
const VA_KEYS = ['date','status','handler','customerName','area','category','valuation','plan','memo'];
// 統計卡：本月新增估價；評估中、已開盤、處理中不分月份（狀態是就算）
const VA_STATS = {
  month: { t:'本月新增估價', f:c=>(c.date||'').startsWith(plThisM()) },
  eval:  { t:'評估中', note:'不分月份', f:c=>c.status==='評估中' },
  open:  { t:'已開盤', note:'不分月份', f:c=>c.status==='已開盤' },
  doing: { t:'處理中', note:'不分月份', f:c=>c.status==='處理中' },
};

function vaS(){
  if(!APP.va) APP.va = { quick:'all', status:'', handler:'', cat:'', plan:'', stat:'', search:'', limit:20, filterOpen:false,
    pop:null, pickYear:'', sort:{key:'date', dir:'desc'}, delRow:null, modal:null, planEdit:null, memoEdit:null, pending:false, _force:false };
  return APP.va;
}
const vaAll = () => APP.data.valuationCases || [];
const vaHasPlan = c => !!String(c.plan||'').trim();
function vaOptColor(f, v){
  if(!v) return null;
  if(f==='status') return ocPair(ocOpt('vaStatus', v)) || valuationStatusColor(v); // 沒自己設定就跟舊版同一套顏色
  const cu = ocPair(ocOpt('vaCategory', v)); if(cu) return cu;
  const c = VA_CATS.find(x=>x[0]===v); return c ? [c[1], c[2]] : PL_NEUTRAL;
}
const vaOptList = f => f==='status' ? valuationStatusList() : VA_CATS.map(c=>c[0]);

function vaInQuick(c){
  const S = vaS(), d = c.date||'';
  if(S.quick==='today') return d===todayStr();
  if(S.quick==='week'){ const t = new Date(); t.setDate(t.getDate()-((t.getDay()+6)%7)); return d>=formatDateLocal(t); }
  if(S.quick==='month') return d.startsWith(plThisM());
  if(S.quick.startsWith('m:') || S.quick.startsWith('y:')) return d.startsWith(S.quick.slice(2));
  return true;
}
function vaFiltered(){
  const S = vaS(), q = S.search.trim().toLowerCase();
  return vaAll().filter(c=> (q ? true : S.stat ? VA_STATS[S.stat].f(c) : vaInQuick(c))
    && (!S.status || (S.status==='__none__' ? !c.status : c.status===S.status))
    && (!S.handler || c.handler===S.handler)
    && (!S.cat || (S.cat==='__none__' ? !c.category : c.category===S.cat))
    && (!S.plan || (S.plan==='empty')===!vaHasPlan(c))
    && (!q || ['customerName','handler','area','valuation','plan','memo','status','category'].some(k=>String(c[k]||'').toLowerCase().includes(q))));
}
function vaSorted(arr){
  const { key, dir } = vaS().sort, sign = dir==='asc' ? 1 : -1, ord = valuationStatusList();
  const cmp = (a, b)=>{
    const x = a[key]||'', y = b[key]||'';
    if(key==='date') return x.localeCompare(y);
    if(key==='status'){ const ix = ord.indexOf(x), iy = ord.indexOf(y); return (ix<0?999:ix) - (iy<0?999:iy); }
    return plZh.compare(x, y);
  };
  const mSign = key==='date' ? sign : -1;
  return arr.slice().sort((a, b)=>{
    const mc = plMKey(a.date).localeCompare(plMKey(b.date)); if(mc) return mSign*mc;
    const x = a[key]||'', y = b[key]||''; if(!x !== !y) return x ? -1 : 1;
    return sign*cmp(a, b) || (b.date||'').localeCompare(a.date||'');
  });
}
const vaDirLabel = (k, d)=> k==='date' ? (d==='desc'?'新→舊':'舊→新') : k==='status' ? (d==='asc'?'照選單順序':'選單順序反過來') : (d==='asc'?'筆畫少→多':'筆畫多→少');
function vaQuickLabel(){
  const S = vaS(), q = S.quick;
  if(S.stat) return VA_STATS[S.stat].t;
  if(q.startsWith('m:')) return plMLabel(q.slice(2));
  if(q.startsWith('y:')) return q.slice(2)+' 全年';
  return { today:'今天', week:'本週', month:plMLabel(plThisM()), all:'全部日期' }[q];
}
const vaNone = v => v==='__none__' ? '未填' : v;
function vaSummary(){
  if(lxSearching(vaS())) return '搜尋中・全部日期';
  const S = vaS();
  return [vaQuickLabel(), S.plan && (S.plan==='empty'?'未填方案':'已填方案'), S.handler, S.cat && vaNone(S.cat), S.status && '狀態 '+vaNone(S.status)].filter(Boolean).join('・');
}
function vaLayout(){
  if(plIsMobile()) return 'cards';
  const main = document.getElementById('main');
  let w = window.innerWidth;
  if(main){ const cs = getComputedStyle(main); w = main.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0); }
  return w < 900 ? 'cards' : w < 1100 ? 'compact' : 'table';
}

// ---- 畫面片段 ----
function vaPickBtn(c, f, target){
  const v = c[f]||'', col = vaOptColor(f, v);
  if(f==='category') return `<button type="button" class="va-cat${v?'':' empty'}" data-va-pk="${escAttr(target||c.id)}" data-va-f="category" aria-haspopup="true" aria-label="${escAttr((c.customerName||'')+' 的類別：'+(v||'未填'))}" style="${col?`background:${col[0]};color:${col[1]};`:''}">${escHtml(v||'類別 ▾')}</button>`;
  return `<button type="button" class="pl-inl${v?'':' empty va-stempty'}" data-va-pk="${escAttr(target||c.id)}" data-va-f="status" aria-haspopup="true" aria-label="${escAttr((c.customerName||'')+' 的狀態：'+(v||'未填'))}" style="${col?`background-color:${col[0]};color:${col[1]};`:''}">${escHtml(v||'選狀態')}</button>`;
}
function vaTxt(c, f, ph, cls, area, list){
  const aria = escAttr((c.customerName||'')+' 的'+VA_LABEL[f]);
  if(area) return `<textarea class="pl-t va-t ${cls||''}" rows="1" data-va-id="${escAttr(c.id)}" data-va-t="${f}" placeholder="${ph}" aria-label="${aria}">${plTa(c[f])}</textarea>`;
  return `<input type="text" class="pl-t va-t ${cls||''}" ${list?`list="${list}"`:''} data-va-id="${escAttr(c.id)}" data-va-t="${f}" value="${escAttr(c[f]||'')}" placeholder="${ph}" aria-label="${aria}"/>`;
}
// 方案：點開專用框，按「儲存並推播」才存（打一半離開不會推播半成品）
const vaPlanBox = c => `<button type="button" class="va-planbox${vaHasPlan(c)?'':' empty'}" data-va-plan="${escAttr(c.id)}" aria-label="${escAttr((c.customerName||'')+' 的方案')}">${vaHasPlan(c) ? escHtml(c.plan) : '＋ 填方案'}</button>`;
function vaDelCtl(c){
  if(vaS().delRow===c.id) return `<div class="pl-confirm">確定刪除「${escHtml(c.customerName||'')}」？<button type="button" class="pl-btn danger" data-va-delyes="${escAttr(c.id)}">刪除</button><button type="button" class="pl-btn sec" data-va-delno>不要刪</button></div>`;
  return `<button type="button" class="pl-del" data-va-del="${escAttr(c.id)}">刪除</button>`;
}
const vaActs = c => `<div class="pl-acts"><button type="button" class="pl-link" data-va-open="${escAttr(c.id)}">編輯</button>${vaDelCtl(c)}</div>`;
const vaFBtn = (k, label, cls) => `<button type="button" class="pl-fpk${cls?' '+cls:''}" data-va-fk="${k}" aria-haspopup="true">${escHtml(label)}</button>`;
const vaSortBtn = () => { const S = vaS(); return vaFBtn('sort', `⇅ ${VA_SORTS.find(s=>s[0]===S.sort.key)[1]}・${vaDirLabel(S.sort.key, S.sort.dir)}`, 'pl-sortsel'); };

function vaStatsHTML(){
  const S = vaS(), L = vaAll();
  return `<div class="pl-stats">${Object.keys(VA_STATS).map(k=>{ const s = VA_STATS[k];
    return `<button type="button" class="pl-stat" data-va-stat="${k}" aria-pressed="${!lxSearching(S) && S.stat===k}"><div class="k">${s.t}</div><div class="v">${L.filter(s.f).length}${s.note?`<small class="pg-vnote">${s.note}</small>`:''}</div></button>`; }).join('')}</div>`;
}
function vaFilterHTML(m){
  const S = vaS();
  const chips = [['today','今天'],['week','本週'],['month','本月'],['all','全部']].map(([k,t])=>`<button type="button" class="pl-chip" data-va-quick="${k}" aria-pressed="${!lxSearching(S) && !S.stat && S.quick===k}">${t}</button>`).join('');
  const sels = vaFBtn('month', `月份：${S.quick.startsWith('m:')||S.quick.startsWith('y:') ? vaQuickLabel() : S.quick==='month' ? '本月' : '全部月份'}`)
    + vaFBtn('plan', `方案：${S.plan ? (S.plan==='empty'?'未填':'已填') : '全部'}`)
    + vaFBtn('handler', `經手人：${S.handler||'全部'}`)
    + vaFBtn('cat', `類別：${S.cat ? vaNone(S.cat) : '全部'}`)
    + vaFBtn('status', `狀態：${S.status ? vaNone(S.status) : '全部'}`);
  if(!m) return `<div class="pl-filters">${chips}${sels}</div>`;
  return `<div class="pl-filters">${chips}<button type="button" class="pl-chip pl-fbtn" data-va-ftoggle aria-expanded="${S.filterOpen}">${escHtml(vaSummary())} ▾</button>${vaSortBtn()}</div>
    ${S.filterOpen ? `<div class="pl-panel">${sels}<button type="button" class="pl-btn sec" data-va-ftoggle>完成</button></div>` : ''}`;
}
function vaRowsHTML(all, layout){
  const S = vaS(), rows = all.slice(0, S.limit);
  const more = all.length > S.limit ? `<button type="button" class="pl-btn sec pl-more" data-va-more>顯示更多（還有 ${all.length-S.limit} 件）</button>` : '';
  if(layout==='cards') return `<div class="pl-cards${plIsMobile()?'':' pg-cards2'}">${plWithMonths(all, rows, (c, i)=>`
    <div class="pl-card">
      <div class="top"><span class="no">${i+1}</span>${vaTxt(c,'customerName','客戶姓名','cname')}${vaPickBtn(c,'status')}</div>
      <div class="pg-ln">${vaPickBtn(c,'category')}<span>經手</span>${vaTxt(c,'handler','經手人','sub',false,'va-handler-list')}</div>
      <div class="bk-lbl">地址</div>${vaMemoBox(c,'area')}
      <div class="bk-lbl">估價資訊</div>${vaMemoBox(c,'valuation')}
      <div class="bk-lbl">方案</div>${vaPlanBox(c)}
      <div class="bk-lbl">備註</div>${vaMemoBox(c)}
      ${S.delRow===c.id ? vaDelCtl(c) : `<div class="foot"><span>${lxDateCtl('va', c, true)}</span>${vaActs(c)}</div>`}
    </div>`, (k, n)=>`<div class="pl-mhead pl-mlabel">${k}<span class="pl-sub">${n} 件</span></div>`, (y, n)=>`<div class="pl-yhead">${y}<span class="pl-sub">共 ${n} 件</span></div>`)}</div>${more}`;
  const th = (k, t)=>{ const on = S.sort.key===k; return `<th><button type="button" class="pl-thbtn${on?' on':''}" data-va-sort="${k}" aria-label="依${t}排序">${t}<span>${on?(S.sort.dir==='asc'?'▲':'▼'):'↕'}</span></button></th>`; };
  const compact = layout==='compact', span = compact ? 9 : 10, cols = compact ? VA_SORTS.filter(x=>x[0]!=='handler') : VA_SORTS;
  return `<div class="pl-tablewrap"><table class="pl-table pg-table bk-table va-table">
    <colgroup>${(compact ? VA_COLW_C : VA_COLW).map(w=>`<col style="width:${w}%">`).join('')}</colgroup>
    <thead><tr><th class="no">#</th>${cols.map(([k,t])=>th(k,t)).join('')}<th></th></tr></thead>
    <tbody>${plWithMonths(all, rows, (c, i)=>`<tr>
      <td class="no">${i+1}</td>
      <td class="date">${lxDateCtl('va', c, true)}</td>
      <td>${vaTxt(c,'customerName','客戶姓名','cname')}<div class="va-subrow">${vaPickBtn(c,'category')}${compact ? vaTxt(c,'handler','經手人','sub',false,'va-handler-list') : ''}</div></td>
      ${compact ? '' : `<td>${vaTxt(c,'handler','經手人','',false,'va-handler-list')}</td>`}
      <td>${vaPickBtn(c,'status')}</td>
      <td>${vaMemoBox(c,'area')}</td>
      <td>${vaMemoBox(c,'valuation')}</td>
      <td>${vaPlanBox(c)}</td>
      <td>${vaMemoBox(c)}</td>
      <td>${S.delRow===c.id ? vaDelCtl(c) : vaActs(c)}</td>
    </tr>`, (k, n)=>`<tr class="pl-mrow"><td colspan="${span}"><div class="pl-mlabel">${k}<span class="pl-sub">${n} 件</span></div></td></tr>`,
      (y, n)=>`<tr class="pl-yrow"><td colspan="${span}"><div class="pl-yhead">${y}<span class="pl-sub">共 ${n} 件</span></div></td></tr>`)}</tbody></table></div>${more}`;
}
function vaListHTML(all, layout){
  const S = vaS(), L = vaAll();
  const count = lxSearching(S) ? lxSearchNote('va', all.length, '件') : `<div class="pl-count">符合 <b>${all.length}</b> 件・全部 <b>${L.length}</b> 件</div>`;
  if(all.length) return count + vaRowsHTML(all, layout);
  const msg = !L.length ? '尚無估價資料，按「＋ 新增估價」開始登記。'
    : S.quick==='month' && !S.stat && !L.some(c=>(c.date||'').startsWith(plThisM())) ? `${plMLabel(plThisM())}還沒有估價。要看上個月，點「月份」選。`
    : '沒有符合的估價，換個篩選條件看看。';
  return count + `<div class="pl-empty">${msg}</div>`;
}
function vaFilterPicker(k){
  const S = vaS();
  const btn = (val, label, on, c, long)=>{ c = c || PL_NEUTRAL; long = long===undefined ? label.length>6 : long;
    return `<button type="button" class="pl-pill${long?' long':''}" data-va-fpick="${k}" data-va-val="${escAttr(val)}" aria-pressed="${on}" style="background:${c[0]};color:${c[1]};">${on?'✓ ':''}${escHtml(label)}</button>`; };
  const sec = (t, html)=>`<div class="pl-pickgrp">${t}</div><div class="pl-picks">${html}</div>`;
  if(k==='status') return `<div class="pl-picks">${btn('', '全部', !S.status)}${valuationStatusList().map(s=>btn(s, s, S.status===s, vaOptColor('status', s))).join('')}${btn('__none__', '未填狀態', S.status==='__none__')}</div>`;
  if(k==='cat') return `<div class="pl-picks">${btn('', '全部', !S.cat)}${VA_CATS.map(c=>btn(c[0], c[0], S.cat===c[0], [c[1], c[2]])).join('')}${btn('__none__', '未填', S.cat==='__none__')}</div>`;
  if(k==='plan') return `<div class="pl-picks">${btn('', '全部', !S.plan)}${btn('empty', '未填方案', S.plan==='empty')}${btn('filled', '已填方案', S.plan==='filled')}</div>`;
  if(k==='handler'){
    // 經手人照件數多到少排，後面附件數
    const cnt = {}; vaAll().forEach(c=>{ if(c.handler) cnt[c.handler] = (cnt[c.handler]||0)+1; });
    const names = Object.keys(cnt).sort((a, b)=>cnt[b]-cnt[a] || plZh.compare(a, b));
    return `<div class="pl-picks">${btn('', '全部', !S.handler)}${names.map(n=>btn(n, `${n}（${cnt[n]}）`, S.handler===n)).join('')}</div>`;
  }
  if(k==='month'){
    const L = vaAll();
    const cur = S.stat ? '' : S.quick==='month' ? plThisM() : S.quick.startsWith('m:') ? S.quick.slice(2) : '';
    const years = Array.from(new Set(L.map(c=>(c.date||'').slice(0,4)).filter(Boolean).concat([plThisY()]))).sort().reverse();
    const py = S.pickYear || (cur || (S.quick.startsWith('y:') ? S.quick.slice(2) : plThisY())).slice(0,4);
    const n = p => L.filter(c=>(c.date||'').startsWith(p)).length;
    const months = Array.from({length:12}, (_, i)=>`${py}-${String(i+1).padStart(2,'0')}`);
    const mBtn = mk=>{
      const cnt = n(mk), on = cur===mk, now = mk===plThisM(), off = !cnt && !now;
      return `<button type="button" class="pl-pill mcell${now?' now':''}" data-va-fpick="month" data-va-val="m:${mk}" aria-pressed="${on}" ${off?'disabled':''}>${on?'✓ ':''}${Number(mk.slice(5))} 月<small>${now?`本月・${cnt}`:`${cnt} 件`}</small></button>`;
    };
    return `<div class="pl-picks">${btn('all','全部月份', S.quick==='all' && !S.stat)}</div>`
      + `<div class="pl-pickgrp">年份</div><div class="pl-picks yrs">${years.map(y=>`<button type="button" class="pl-pill ycell" data-va-fpick="month" data-va-val="py:${y}" aria-pressed="${y===py}">${y}</button>`).join('')}</div>`
      + `<div class="pl-pickgrp">${py} 年${py===plThisY()?'（今年）':''}</div>`
      + `<div class="pl-picks">${btn('y:'+py, `${py} 全年（${n(py)} 件）`, !S.stat && S.quick==='y:'+py, PL_NEUTRAL, false).replace('class="pl-pill', 'class="pl-pill wide')}</div>`
      + `<div class="pl-picks mgrid">${months.map(mBtn).join('')}</div>`;
  }
  return sec('依哪一欄排序', VA_SORTS.map(([v,t])=>btn('k:'+v, t, S.sort.key===v)).join(''))
    + sec('順序', (S.sort.key==='date' ? ['desc','asc'] : ['asc','desc']).map(d=>btn('d:'+d, vaDirLabel(S.sort.key, d), S.sort.dir===d)).join(''));
}
function vaPicker(f, cur, target){
  return `<div class="pl-picks">${vaOptList(f).map(o=>{ const c = vaOptColor(f, o);
    return `<button type="button" class="pl-pill${o.length>6?' long':''}" data-va-pick="${escAttr(o)}" data-va-pt="${escAttr(target)}" data-va-f="${f}" aria-pressed="${cur===o}" style="background:${c[0]};color:${c[1]};">${cur===o?'✓ ':''}${escHtml(o)}</button>`; }).join('')}</div>`
    + (cur ? `<button type="button" class="pl-pickclear" data-va-pick="" data-va-pt="${escAttr(target)}" data-va-f="${f}">清除，改回未填</button>` : '')
    + (f==='status' ? ocPairHTML('vaStatus', VA_LABEL[f], target==='__modal' ? '' : '<button type="button" class="pl-pickclear" data-va-opts>⚙ 狀態名稱</button>') : ocEditBtn('vaCategory', VA_LABEL[f]));
}
function vaPopHTML(){
  const S = vaS(); if(!S.pop) return '';
  const { id, f, fk } = S.pop;
  let title, body;
  if(fk){ title = { month:'選月份', plan:'篩選方案', handler:'篩選經手人', cat:'篩選類別', status:'篩選狀態', sort:'排序' }[fk]; body = vaFilterPicker(fk); }
  else {
    const c = id==='__modal' ? (S.modal && S.modal.rec) : vaAll().find(x=>x.id===id);
    if(!c){ S.pop = null; return ''; }
    title = `${escHtml(c.customerName||'新估價')}・${VA_LABEL[f]}`; body = vaPicker(f, c[f]||'', id);
  }
  if(plIsMobile()) return `<div class="pl-overlay sheet" data-va-popbg><div class="pl-dialog"><div class="pl-dlg-h"><h2>${title}</h2><button type="button" class="pl-x" data-va-popclose aria-label="關閉">×</button></div><div class="pl-dlg-b">${body}</div></div></div>`;
  return `<div class="pl-pop" id="va-pop" style="left:${S.pop.x}px;top:${S.pop.y}px;"><div class="pl-pophead">${title}</div>${body}</div>`;
}
const vaPushWarn = what => `<div class="va-pushwarn">按「<b>${what}</b>」後，如果方案內容有改，會把<b>客戶、地址、估價、方案、備註、狀態</b>推播到 LINE。只改錯字也會再推播一次；方案清空不推播。</div>`;
// 地址、估價資訊、備註：列表最多顯示 3 行，點了彈出大視窗看全文、修改（這三欄都不會推播）
const vaMemoBox = (c, f) => { f = f || 'memo'; return `<button type="button" class="va-memobox${c[f]?'':' empty'}" data-va-memo="${escAttr(c.id)}" data-va-mf="${f}" aria-label="${escAttr((c.customerName||'')+' 的'+VA_LABEL[f])}">${c[f] ? escHtml(c[f]) : '＋ '+VA_LABEL[f]}</button>`; };
function vaMemoDlgHTML(){
  const P = vaS().memoEdit; if(!P) return '';
  const c = vaAll().find(x=>x.id===P.id); if(!c){ vaS().memoEdit = null; return ''; }
  return `<div class="pl-overlay" data-va-memobg><form class="pl-dialog" id="va-memo-form" data-va-key="${P.key}" novalidate>
    <div class="pl-dlg-h"><h2>${VA_LABEL[P.f]}・${escHtml(c.customerName||'')}</h2><button type="button" class="pl-x" data-va-memoclose aria-label="關閉">×</button></div>
    <div class="pl-dlg-b"><label class="pl-field"><span>${VA_LABEL[P.f]}（修改不會推播）</span><textarea id="va-memo-ta" class="va-memo-ta" rows="12">${plTa(P.draft!=null ? P.draft : c[P.f])}</textarea></label></div>
    <div class="pl-dlg-f"><button type="button" class="pl-btn sec" data-va-memoclose>取消</button><button type="submit" class="pl-btn">儲存</button></div>
  </form></div>`;
}
function vaSaveMemo(){
  const S = vaS(), P = S.memoEdit; if(!P) return;
  vaCaptureForm();
  const c = vaAll().find(x=>x.id===P.id); S.memoEdit = null;
  if(!c){ vaRender(); plToast('這筆估價已經被刪除了'); return; }

function isStaleCase(c){

  const ref = c._at ? new Date(c._at).getTime() : (c.date ? new Date(c.date).getTime() : 0);

    ...APP.data.progressAd.filter(isStaleCase).map(c=>({...c, _lineType:'ad'})),
    ...APP.data.progressChannel.filter(isStaleCase).map(c=>({...c, _lineType:'channel'})),
  ].sort((a,b)=>{
    const ta = a._at?new Date(a._at).getTime():0, tb = b._at?new Date(b._at).getTime():0;
    return ta - tb; // 最久沒更新的排最前面
  });
}
function sortList(list, sortState, type){
  if(!sortState || !sortState.key) return list;
  const { key, dir } = sortState;
  const sorted = list.slice().sort((a,b)=>{
    let va = a[key], vb = b[key];
    if(type==='number'){ va = Number(va)||0; vb = Number(vb)||0; }
    else { va = (va===undefined||va===null?'':va).toString(); vb = (vb===undefined||vb===null?'':vb).toString(); }
    if(va < vb) return dir==='asc' ? -1 : 1;
    if(va > vb) return dir==='asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}
function thSort(label, key, stateKey){
  const state = APP[stateKey] || {};
  const arrow = state.key===key ? (state.dir==='asc'?' ▲':' ▼') : '';
  return `<th data-action="sort-table" data-statekey="${stateKey}" data-sortkey="${key}" style="cursor:pointer;user-select:none;white-space:nowrap;">${label}${arrow}</th>`;
}
function searchBoxHtml(stateKey, placeholder){
  const val = APP[stateKey] || '';
  return `<div class="filter-field"><label>搜尋</label><input type="text" class="table-search-input" data-statekey="${stateKey}" value="${escAttr(val)}" placeholder="${placeholder||'搜尋任何欄位內容'}" style="min-width:180px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;"/></div>`;
}
function matchesSearch(c, searchVal){
  if(!searchVal) return true;
  const q = searchVal.trim().toLowerCase();
  if(!q) return true;
  return Object.keys(c).some(key=>{
    if(key.startsWith('_')) return false; // 跳過內部時間戳記等技術欄位
    const v = c[key];
    if(v===null || v===undefined) return false;
    if(typeof v === 'string') return v.toLowerCase().includes(q);
    if(typeof v === 'number') return String(v).includes(q);
    return false;
  });
}

function calcBusinessBonus(afterCost){ return Math.round((Number(afterCost)||0) * APP.data.caseSettings.businessBonusRate); }
function calcXiaojiangBonus(afterCost, ordinalInMonth){
  const cs = APP.data.caseSettings;
  const rate = ordinalInMonth <= cs.xiaojiangThreshold ? cs.xiaojiangRateBelow : cs.xiaojiangRateAbove;
  return Math.round((Number(afterCost)||0) * rate);
}
function adCaseOrdinal(caseId, dateStr){
  const mk = monthKey(dateStr);
  const sameMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===mk).slice().sort((a,b)=> a.date===b.date ? (a._createdSeq||0)-(b._createdSeq||0) : a.date.localeCompare(b.date));
  const idx = sameMonth.findIndex(c=>c.id===caseId);
  return idx>=0 ? idx+1 : sameMonth.length+1;
}
function wizardHatDeduction(c){ return c.specialHandling ? (Number(c.specialFee)||0) : 0; }
function whIcon(size){ size = size||16; return `<span class="wizard-hat-icon" style="width:${size}px;height:${size}px;"></span>`; }
function recalcAdCase(c){
  const base = (Number(c.afterCost)||0) - wizardHatDeduction(c);
  const ordinal = adCaseOrdinal(c.id, c.date);
  if(!c.businessBonusOverride) c.businessBonus = calcBusinessBonus(base);
  if(!c.xiaojiangBonusOverride) c.xiaojiangBonus = calcXiaojiangBonus(base, ordinal);
  if(!c.companyProfitOverride) c.companyProfit = base - (Number(c.businessBonus)||0) - (Number(c.xiaojiangBonus)||0);
  return c;
}
function recalcChannelCase(c){
  const base = (Number(c.afterCost)||0) - wizardHatDeduction(c);
  if(!c.companyProfitOverride) c.companyProfit = base - (Number(c.partnerProfit)||0);
  return c;
}

function valuationFilterDefaults(){ return {month:'', status:'', handler:'', category:'', area:'', planState:'', from:'', to:''}; }
function valuationApplyFilters(all, f, ignoreKey){
  return all.filter(c=>{
    if(ignoreKey!=='month' && f.month && c.month!==f.month) return false;
    if(ignoreKey!=='status' && f.status){ if(f.status==='__none__' ? !!c.status : c.status!==f.status) return false; }
    if(ignoreKey!=='handler' && f.handler){ if(f.handler==='__none__' ? !!c.handler : c.handler!==f.handler) return false; }
    if(ignoreKey!=='category' && f.category){ if(f.category==='__none__' ? !!c.category : c.category!==f.category) return false; }
    if(ignoreKey!=='area' && f.area && !(c.area||'').includes(f.area)) return false;
    if(ignoreKey!=='planState' && f.planState){
      const has = !!String(c.plan||'').trim();
      if(f.planState==='filled' && !has) return false;
      if(f.planState==='empty' && has) return false;
    }
    if(ignoreKey!=='from' && f.from && (c.date||'') < f.from) return false;
    if(ignoreKey!=='to' && f.to && (c.date||'') > f.to) return false;
    return true;
  });
}

function valuationHTML(){
  const all = APP.data.valuationCases || [];
  const f = Object.assign(valuationFilterDefaults(), APP.valuationFilter||{});
  let list = valuationApplyFilters(all, f).filter(c=>matchesSearch(c, APP.valuationSearch));
  list = sortList(list, APP.valuationSort, 'text');
  // 狀態欄有填東西的優先置頂(兩組內部維持原本的排序)
  list = list.filter(c=>String(c.status||'').trim()).concat(list.filter(c=>!String(c.status||'').trim()));
  // 每個下拉選單的選項與數字,是「套用其他篩選條件後」各選項的筆數,方便預先看到選了會剩幾筆
  function optionsFor(key, field, labelFn){
    const base = valuationApplyFilters(all, f, key);
    const counts = {};
    base.forEach(c=>{ const v = c[field]||'__none__'; counts[v] = (counts[v]||0)+1; });
    const vals = Object.keys(counts).filter(v=>v!=='__none__').sort((a,b)=> field==='month' ? b.localeCompare(a) : a.localeCompare(b,'zh-Hant'));
    if(f[key] && f[key]!=='__none__' && !counts[f[key]]) vals.unshift(f[key]);
    let html = `<option value="">全部 (${base.length})</option>`;
    vals.forEach(v=>{ html += `<option value="${escAttr(v)}" ${f[key]===v?'selected':''}>${escHtml(labelFn?labelFn(v):v)} (${counts[v]||0})</option>`; });
    if(counts['__none__']) html += `<option value="__none__" ${f[key]==='__none__'?'selected':''}>(未填) (${counts['__none__']})</option>`;
    return html;
  }
  const sel = (key, label, field, labelFn)=>`<div class="filter-field"><label>${label}</label><select data-case-filter="valuation-f-${key}">${optionsFor(key, field, labelFn)}</select></div>`;
  const today = todayStr();
  const d = new Date(); const dow = (d.getDay()+6)%7; // 週一為一週開頭
  const weekStart = formatDateLocal(new Date(d.getFullYear(), d.getMonth(), d.getDate()-dow));
  const monthStart = today.slice(0,8)+'01';
  const isQuick = (q)=>{
    if(q==='today') return f.from===today && f.to===today;
    if(q==='week') return f.from===weekStart && f.to===today;
    if(q==='month') return f.from===monthStart && f.to===today;
    return false;
  };

function valuationParseDate(v){
  if(v instanceof Date && !isNaN(v)) return formatDateLocal(new Date(v.getTime()+12*3600*1000));
  if(typeof v==='number' && v>20000){ return formatDateLocal(new Date(Math.round((v-25569)*86400*1000)+12*3600*1000)); }
  return String(v==null?'':v).trim();
}
function openValuationImportModal(){
  openModal('匯入舊試算表(Excel)', `
    <p style="font-size:13px;color:var(--muted);line-height:1.6;">請先在 Google 試算表選「檔案 → 下載 → Microsoft Excel (.xlsx)」,再選那個檔案。分頁名稱需為「4月、9月、10月…」格式,欄位順序為:狀態、日期、經手人、客戶姓名、地區、案件類別、估價資訊、方案、備註。<br>匯入的舊資料<b>不會</b>推播到 LINE。重複匯入同一份檔案會覆蓋同一筆,不會變成兩筆。</p>
    <div class="grid grid-2">
      <label class="field"><span>這份試算表的年份</span><input type="number" name="year" value="${new Date().getFullYear()}" required/></label>
      <label class="field"><span>Excel 檔案</span><input type="file" name="file" accept=".xlsx,.xls" required/></label>
    </div>
    <div id="val-import-msg" style="font-size:13px;margin-top:8px;"></div>`, 'valuation-import-form', null);
  document.getElementById('valuation-import-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('val-import-msg');
    try{
      const fd = new FormData(e.target);
      const year = Number(fd.get('year'));
      const file = fd.get('file');
      if(!file || !file.size) return;
      msg.textContent = '讀取中…';
      const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
      const recs = [];
      wb.SheetNames.forEach(name=>{
        const m = name.trim().match(/^(\d{1,2})月$/);
        if(!m) return;
        const month = year + '-' + String(m[1]).padStart(2,'0');
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
        rows.slice(1).forEach((r, i)=>{
          const customerName = String(r[3]||'').trim();
          if(!customerName) return;
          recs.push(stamp({
            id:`imp-${year}-${String(m[1]).padStart(2,'0')}-${i+2}`,
            month, status:String(r[0]||'').trim(), date:valuationParseDate(r[1]), handler:String(r[2]||'').trim(),
            customerName, area:String(r[4]||'').trim(), category:String(r[5]||'').trim(),
            valuation:String(r[6]||'').trim(), plan:String(r[7]||'').trim(), memo:String(r[8]||'').trim(),
            _silent:true
          }));
        });
      });
      if(recs.length===0){ msg.textContent = '沒有找到可匯入的資料,請確認分頁名稱(例如「4月」)與欄位順序。'; return; }
      for(let i=0;i<recs.length;i+=400){
        const batch = writeBatch(db);
        recs.slice(i,i+400).forEach(r=>batch.set(doc(db,'valuationCases',r.id), r));
        await batch.commit();
      }
      alert(`匯入完成,共 ${recs.length} 筆。`);
      closeModal(); render();
    } catch(err){
      console.error('匯入估價資料失敗:', err);
      msg.textContent = '匯入失敗:' + (err && err.message ? err.message : err);
    }
  });
}

const BANKLOAN_STATUSES = [
  ['評估中','#FFE5A0','#473821','eval'],['等客人確定','#FFC8AA','#753800','eval'],['等通路確定','#FFC8AA','#753800','eval'],
  ['已送件','#11734B','#FFFFFF','sent'],['銀行聯絡中','#215A6C','#FFFFFF','sent'],['等照會','#FFCC03','#000000','sent'],
  ['補資料','#BBD3FF','#0B2E6B','sent'],['喬件','#D4EDBC','#11734B','sent'],['對保','#FFB27A','#4A1E00','sign'],
  ['撥款完成','#B10202','#FFFFFF','paid'],['結案','#B10202','#FFFFFF','end'],['培養','#215A6C','#FFFFFF','nurture'],
  ['婉拒','#3D3D3D','#FFFFFF','end'],['客拒','#3D3D3D','#FFFFFF','end']
];
const BANKLOAN_ENDED = ['撥款完成','結案','婉拒','客拒'];
function bankLoanStatusColor(s){
  const t = String(s||'').trim();
  const hit = BANKLOAN_STATUSES.find(x=>x[0]===t);
  const custom = (APP.bankLoanStatusColors||{})[t];
  if(custom && /^#[0-9a-fA-F]{6}$/.test(custom)) return [custom, bankLoanContrast(custom)];
  return hit ? [hit[1], hit[2]] : valuationStatusColor(t);
}
// 依底色亮度自動選黑字或白字,確保看得清楚
function bankLoanContrast(hex){
  const n = parseInt(hex.slice(1), 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return ((r*299 + g*587 + b*114)/1000) > 150 ? '#1F2433' : '#FFFFFF';
}
// 狀態選項:有自訂清單就用自訂的,沒有就用預設 14 種;資料裡正在用的狀態永遠保留
function bankLoanStatusList(extra){
  const custom = (APP.bankLoanStatusOptions||[]).map(x=>String(x).trim()).filter(Boolean);
  const set = new Set(custom.length ? custom : BANKLOAN_STATUSES.map(x=>x[0]));
  (APP.data.bankLoanCases||[]).forEach(c=>{ const t = String(c.status||'').trim(); if(t) set.add(t); });
  if(extra) set.add(extra);
  return Array.from(set);
}

    const renameJobs = renames.map(r=>({...r, cases:(APP.data.bankLoanCases||[]).filter(c=>c.status===r.from)})).filter(r=>r.cases.length>0);
    if(renameJobs.length>0){
      const msg = renameJobs.map(r=>`「${r.from}」→「${r.to}」:${r.cases.length} 筆案件`).join('\n');
      if(!confirm('這些狀態改名後,正在使用舊名稱的案件會一起改成新名稱:\n\n' + msg + '\n\n確定要儲存嗎?')) return;
    }
    try{
      for(const job of renameJobs){
        for(let i=0;i<job.cases.length;i+=400){
          const batch = writeBatch(db);
          job.cases.slice(i,i+400).forEach(c=>batch.set(doc(db,'bankLoanCases',c.id), stamp({status:job.to}), {merge:true}));
          await batch.commit();
        }
        if(APP.bankLoanFilter && APP.bankLoanFilter.status===job.from) APP.bankLoanFilter = Object.assign({}, APP.bankLoanFilter, {status:job.to});
      }
      const names = [], colors = {}, groups = {};
      const oldColors = APP.bankLoanStatusColors || {};
      form.querySelectorAll('.blo-row').forEach(row=>{
        const n = row.querySelector('.blo-name').value.trim();
        if(!n || names.includes(n)) return;
        names.push(n);
        groups[n] = row.querySelector('.blo-group').value;
        if(row.dataset.old && oldColors[row.dataset.old]) colors[n] = oldColors[row.dataset.old]; // 原本有設定顏色就照留（改名的帶到新名稱）；新狀態用自動顏色
      });
      await setDoc(doc(db,'appdata','bankLoanOptions'), stamp({statuses:names, colors, groups}));
    } catch(err){
      console.error('儲存銀行信貸狀態選項失敗:', err);
      alert('儲存失敗:' + (err && err.message ? err.message : err));
    } finally{
      closeModal(); render();
    }
  });
}

function bankLoanParseDate(v, year){
  let s = valuationParseDate(v);
  if(typeof s!=='string') return '';
  s = s.trim();
  let m = s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/);
  if(m) return `${year}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  return s;
}

// 打開面板:用 fixed 定位,自動判斷往下或往上展開,避免被表格或視窗邊緣切掉
function bankLoanOpenDropdown(sd){
  const btn = sd.querySelector('.sd-btn'), panel = sd.querySelector('.sd-panel');
  sd.classList.add('open');
  const r = btn.getBoundingClientRect();
  const w = Math.min(Math.max(r.width, 230), window.innerWidth-16);
  panel.style.width = w+'px';
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth-w-8))+'px';
  const below = window.innerHeight - r.bottom - 14, above = r.top - 14;
  if(below >= 260 || below >= above){ panel.style.top = (r.bottom+6)+'px'; panel.style.bottom = 'auto'; panel.style.maxHeight = Math.max(160, Math.min(380, below))+'px'; }
  else { panel.style.bottom = (window.innerHeight - r.top + 6)+'px'; panel.style.top = 'auto'; panel.style.maxHeight = Math.max(160, Math.min(380, above))+'px'; }
  APP._sdOpen = sd.dataset.id || null;
}

      const id = existing ? existing.id : uid();
      await saveBankLoanCase(stamp({...(existing||{}), id, ...data}));
    } catch(err){
      console.error('儲存銀行信貸時發生錯誤:', err);
      alert('儲存失敗:' + (err && err.message ? err.message : err));
    } finally{
      closeModal(); render();
    }
  });
}

        </tbody></table>`;
      msg.innerHTML = `共讀到 <b>${recs.length}</b> 筆。黃色欄位是需要你確認的地方,可以直接在預覽裡修改;確認無誤後按「確認匯入」才會寫入。`;

      msg.textContent = '匯入失敗:' + (err && err.message ? err.message : err);
    }

}
function buildBankLoanContext(){
  const all = APP.data.bankLoanCases || [];
  if(all.length===0) return '【銀行信貸】目前沒有資料';
  const cut = (v, n)=>{ const t = String(v||'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n)+'…' : t; };
  const months = Array.from(new Set(all.map(c=>monthKey(c.date)||'無日期'))).sort().reverse();
  const recent = months.slice(0,2);
  const statusCount = {};
  all.forEach(c=>{ const s = c.status||'(空白)'; statusCount[s] = (statusCount[s]||0)+1; });
  const lines = all.filter(c=>recent.includes(monthKey(c.date)||'無日期'))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
    .slice(0,150)
    .map(c=>`[id:${c.id}] ${c.date||'無日期'}｜狀態:${c.status||'—'}｜客戶:${c.customerName||''}｜電話:${c.phone||'—'}｜誰的客人:${c.owner||'—'}｜包工作:${c.packJob||'未定'}｜管道:${c.channel||'—'}｜方案:${cut(c.plan,40)}｜核准額度:${c.approvedAmount==null?'—':c.approvedAmount+'萬'}｜備註:${cut(c.note,50)}`);
  return `【銀行信貸】（只有核心看得到；共 ${all.length} 筆；各狀態件數：${Object.keys(statusCount).map(k=>k+' '+statusCount[k]).join('、')}）
近兩個月明細（最多 150 筆，由新到舊；更早的月份沒有逐筆明細）：
${lines.join('\n') || '無'}`;
}

    p.count++;
    if(adBusinessBonusPaid(c)) p.paidCount++; else p.unpaidCount++;
    const xj = Number(c.xiaojiangBonus)||0;

/* ---- 業績牌位：依本月公司利潤貢獻判定，回傳邊框樣式設定 ---- */
/* ---- 通路案件的獎金拆解（相容新格式三個獨立欄位／舊格式單一partnerProfit）---- */
function channelCaseHasNewFields(c){
  return c.businessBonusEnabled!==undefined || c.channelTakeEnabled!==undefined || c.huangBonusEnabled!==undefined;
}
function channelCaseBusinessBonus(c){
  if(channelCaseHasNewFields(c)) return c.businessBonusEnabled ? (Number(c.businessBonus)||0) : 0;
  return Number(c.partnerProfit)||0; // 舊資料相容：改版前的案件全部算在業務獎金
}
function channelCaseChannelTake(c){
  return channelCaseHasNewFields(c) && c.channelTakeEnabled ? (Number(c.channelTake)||0) : 0;
}
function channelCaseHuangBonus(c){
  return channelCaseHasNewFields(c) && c.huangBonusEnabled ? (Number(c.huangBonus)||0) : 0;
}
function channelCaseTotalPayout(c){
  return channelCaseBusinessBonus(c) + channelCaseChannelTake(c) + channelCaseHuangBonus(c);
}
/* ---- 獎金發放狀態獨立追蹤：業務獎金／小江獎金／通路實拿／煌獎金各自有自己的發放狀態，
   不會因為標記其中一個已發放，就連帶把其他人的份也標成已發放（例如小江沒有準時發，不該影響業務那份的紀錄）。
   新欄位不存在時（舊資料）回退看舊的整體欄位(bonusPaid/profitPaid)，確保這次改版之前已經標記過的資料不會突然變回未發放。 ---- */
function adBusinessBonusPaid(c){ return c.businessBonusPaid!==undefined ? !!c.businessBonusPaid : !!c.bonusPaid; }
function adXiaojiangBonusPaid(c){ return c.xiaojiangBonusPaid!==undefined ? !!c.xiaojiangBonusPaid : !!c.bonusPaid; }
function adAllPaid(c){
  const bbOk = (Number(c.businessBonus)||0)<=0 || adBusinessBonusPaid(c);
  const xjOk = (Number(c.xiaojiangBonus)||0)<=0 || adXiaojiangBonusPaid(c);
  return bbOk && xjOk;
}
function chBusinessBonusPaid(c){ return c.businessBonusPaid!==undefined ? !!c.businessBonusPaid : !!c.profitPaid; }
function chChannelTakePaid(c){ return c.channelTakePaid!==undefined ? !!c.channelTakePaid : !!c.profitPaid; }
function chHuangBonusPaid(c){ return c.huangBonusPaid!==undefined ? !!c.huangBonusPaid : !!c.profitPaid; }
function chAllPaid(c){
  const bbOk = channelCaseBusinessBonus(c)<=0 || chBusinessBonusPaid(c);
  const ctOk = channelCaseChannelTake(c)<=0 || chChannelTakePaid(c);
  const hbOk = channelCaseHuangBonus(c)<=0 || chHuangBonusPaid(c);
  return bbOk && ctOk && hbOk;
}

function computeFixedCost(mk){
  const list = APP.data.transactions.filter(t=>t.type==='expense' && monthKey(t.date)===mk && (t.mainCategory==='房租水電' || t.mainCategory==='薪資支出'));
  return sum(list);
}
/* ---- 公司月淨利模型：跟廣告支出報表用同一套公式，讓總覽的「當月結餘」跟獲利報表的「全公司最終淨利」永遠是同一個數字，
   不會再各自算出不一樣的結果。公式：(廣告案件利潤－固定成本－廣告投放金額－投手獎金) + 通路案件利潤 ---- */
function computeCompanyFinalNet(mk){
  const cs = APP.data.caseSettings;
  const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===mk);
  const chCasesInMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===mk);
  const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
  const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
  const adSpendRec = APP.data.adSpend.find(a=>a.month===mk);
  const spend = adSpendRec ? Number(adSpendRec.spend||0) : 0;
  const fixedCostThisMonth = computeFixedCost(mk);
  const adTotalNet = adRevenue - fixedCostThisMonth - spend;
  const pilotBonus = Math.max(0, adTotalNet) * cs.pilotBonusRate;
  const adFinalNet = adTotalNet - pilotBonus;
  return adFinalNet + chProfit;
}

/* 廣告支出報表：一次看一個月。每個月的數字照原本 adSpendView 的算法（下面這段式子一字不改搬過來） */
function csSpendCalc(a){
  const cs = APP.data.caseSettings;
  const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===a.month);
  const chCasesInMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===a.month);
  const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
  const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
  const spend = Number(a.spend||0);
  const adNetBeforeFixed = adRevenue - spend;
  const roi = spend===0 ? 0 : (adNetBeforeFixed - spend) / spend;
  const fixedCostThisMonth = computeFixedCost(a.month);
  const adTotalNet = adRevenue - fixedCostThisMonth - spend;
  const pilotBonus = Math.max(0, adTotalNet) * cs.pilotBonusRate;
  const adFinalNet = adTotalNet - pilotBonus;
  const companyFinalNet = computeCompanyFinalNet(a.month);
  const cpc = a.messages ? (spend/Number(a.messages)) : 0;
  const cpa = a.approved ? (spend/Number(a.approved)) : 0;
  const approveRate = a.submitted ? (Number(a.approved||0)/Number(a.submitted)) : 0;
  return { adRevenue, chProfit, spend, roi, fixedCostThisMonth, adTotalNet, pilotBonus, adFinalNet, companyFinalNet, cpc, cpa, approveRate };
}

function openAiImportModal(){
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-head"><h3>AI 貼上匯入收支</h3><button type="button" class="icon-btn" data-action="close-modal">✕</button></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:0;">把收支相關的文字貼進來（記帳筆記、對話紀錄、收據內容都可以），AI 會幫你整理成一筆筆紀錄，確認後才會真正新增到系統。</p>
    <textarea id="ai-import-text" style="width:100%;min-height:140px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;" placeholder="例如：8/15 廣告費 iG投放 1200元&#10;8/16 收到王小明貸款仲介費 15000"></textarea>
    <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button>
    <button type="button" class="btn primary" id="ai-import-extract-btn">AI 解析</button></div>
    <div id="ai-import-result"></div>`;
  document.getElementById('ai-import-extract-btn').addEventListener('click', async ()=>{
    const text = document.getElementById('ai-import-text').value.trim();
    if(!text) return;
    const btn = document.getElementById('ai-import-extract-btn');
    btn.disabled = true; btn.textContent = '解析中…';
    document.getElementById('ai-import-result').innerHTML = '';
    try{
      const resp = await fetch(AI_WORKER_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          mode:'extract', text, today: todayStr(),
          categories: { expense: APP.data.categories.expense.map(c=>c.name), income: APP.data.categories.income.map(c=>c.name) }
        })
      });
      const data = await resp.json();
      let rows = null;
      try{
        let raw = (data.raw || '').trim();
        raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
        rows = JSON.parse(raw);
      }catch(e){ rows = null; }
      if(!rows || !Array.isArray(rows) || rows.length===0){
        document.getElementById('ai-import-result').innerHTML = `<div class="empty" style="padding:20px;">沒有辨識出可用的收支項目，請調整內容再試一次。</div>`;
      } else {
        renderAiImportPreview(rows);
      }
    }catch(e){
      document.getElementById('ai-import-result').innerHTML = `<div class="login-error">解析失敗，請稍後再試一次。</div>`;
    }
    btn.disabled = false; btn.textContent = 'AI 解析';
  });
}
function renderAiImportPreview(rows){
  const box = document.getElementById('ai-import-result');
  box.innerHTML = `<div id="ai-import-rows" style="margin-top:14px;max-height:260px;overflow-y:auto;">
    ${rows.map((r,i)=>buildTxRowHtml(r,i)).join('')}
  </div>
  <div class="modal-actions"><button type="button" class="btn primary" id="ai-import-confirm-btn">確認新增選取的紀錄</button></div>`;
  document.getElementById('ai-import-confirm-btn').addEventListener('click', ()=>{
    const rowEls = document.querySelectorAll('#ai-import-rows .tx-row');
    let count = 0;
    rowEls.forEach(rowEl=>{
      const chk = rowEl.querySelector('.ai-row-check');
      if(!chk.checked) return;
      const data = { note:'', pending:false };
      rowEl.querySelectorAll('.ai-row-field').forEach(f=>{ data[f.dataset.key] = f.value; });
      data.amount = Number(data.amount) || 0;
      APP.data.transactions.push(stamp({id:uid(), ...data}));
      count++;
    });
    if(count>0) saveTransactions();
    closeModal();
  });
}

    document.getElementById('ac-specialFee').style.display = this.checked ? '' : 'none';
    recalcPreview();
  });
  document.getElementById('ac-specialFee').addEventListener('input', recalcPreview);
  document.querySelectorAll('.ac-percent-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('ac-deductionPercent').value = btn.dataset.percent;
      recalcPreview();
    });
  });

  function recalcPreview(){
    const approvedAmount = Number(document.getElementById('ac-approvedAmount').value)||0;
    const deductionPercent = Number(document.getElementById('ac-deductionPercent').value)||0;
    const setupFee = Number(document.getElementById('ac-setupFee').value)||0;
    const deductionAmount = approvedAmount * (deductionPercent/100);
    document.getElementById('ac-deductionAmount-display').textContent = money(deductionAmount);
    document.querySelectorAll('.ac-percent-btn').forEach(btn=>{
      const active = Number(btn.dataset.percent)===deductionPercent;
      btn.style.background = active ? 'var(--navy)' : '#fff';
      btn.style.color = active ? '#fff' : 'var(--ink)';
      btn.style.borderColor = active ? 'var(--navy)' : 'var(--border)';
    });
    const specialOn = document.getElementById('ac-special').checked;
    const specialFee = specialOn ? (Number(document.getElementById('ac-specialFee').value)||0) : 0;
    const withholding = Number(document.getElementById('ac-withholding').value)||0;
    const disbursement = Number(document.getElementById('ac-disbursement').value)||0;
    const afterCost = approvedAmount - deductionAmount - setupFee - withholding - specialFee - disbursement;
    document.getElementById('ac-afterCost-display').textContent = money(afterCost);
    const base = afterCost;
    const bbOverride = document.getElementById('ac-bb-override').checked;
    const xjOverride = document.getElementById('ac-xj-override').checked;
    const bbInput = document.getElementById('ac-businessBonus');
    const xjInput = document.getElementById('ac-xiaojiangBonus');
    bbInput.readOnly = !bbOverride;
    xjInput.readOnly = !xjOverride;
    if(!bbOverride) bbInput.value = calcBusinessBonus(base);
    if(!xjOverride){
      const dateVal = document.getElementById('ac-date').value || todayStr();
      const ordinal = existing ? adCaseOrdinal(existing.id, dateVal) : (APP.data.casesAd.filter(cc=>monthKey(cc.date)===monthKey(dateVal)).length + 1);
      xjInput.value = calcXiaojiangBonus(base, ordinal);
    }
    const bb = Number(bbInput.value)||0;
    const xj = Number(xjInput.value)||0;
    document.getElementById('ac-companyProfit-display').textContent = money(base - bb - xj);
  }
  ['ac-approvedAmount','ac-deductionPercent','ac-setupFee','ac-withholding','ac-disbursement','ac-businessBonus','ac-xiaojiangBonus'].forEach(id=>document.getElementById(id).addEventListener('input', recalcPreview));
  ['ac-bb-override','ac-xj-override'].forEach(id=>document.getElementById(id).addEventListener('change', recalcPreview));
  recalcPreview();

  document.getElementById('ad-case-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    try{
      const fd = new FormData(e.target);
      const approvedAmount = Number(document.getElementById('ac-approvedAmount').value)||0;
      const deductionPercent = Number(document.getElementById('ac-deductionPercent').value)||0;
      const setupFee = Number(document.getElementById('ac-setupFee').value)||0;
      const deductionAmount = approvedAmount * (deductionPercent/100);
      const specialHandling = document.getElementById('ac-special').checked;
      const specialFee = specialHandling ? (Number(document.getElementById('ac-specialFee').value)||0) : 0;
      const withholding = Number(document.getElementById('ac-withholding').value)||0;
      const disbursement = Number(document.getElementById('ac-disbursement').value)||0;
      const afterCost = approvedAmount - deductionAmount - setupFee - withholding - specialFee - disbursement;
      const base = afterCost;
      const businessBonusOverride = document.getElementById('ac-bb-override').checked;
      const xiaojiangBonusOverride = document.getElementById('ac-xj-override').checked;
      const businessBonus = Number(document.getElementById('ac-businessBonus').value)||0;
      const xiaojiangBonus = Number(document.getElementById('ac-xiaojiangBonus').value)||0;
      const companyProfit = base - businessBonus - xiaojiangBonus;
      const bonusPaidChecked = fd.get('bonusPaid')==='on';
      const data = {
        date: fd.get('date'), customer: fd.get('customer'), plan: fd.get('plan'),
        staff: fd.get('staff'), approvedAmount, deductionPercent, setupFee, deductionAmount, withholding, disbursement, afterCost, businessBonus, businessBonusOverride,
        xiaojiangBonus, xiaojiangBonusOverride, companyProfit, bonusPaid: bonusPaidChecked, businessBonusPaid: bonusPaidChecked, xiaojiangBonusPaid: bonusPaidChecked, note: fd.get('note'),
        specialHandling, specialFee
      };
      const caseId = existing ? existing.id : uid();
      if(existing) Object.assign(existing, stamp(data));
      else APP.data.casesAd.push(stamp({id:caseId, _createdSeq:Date.now(), linkedTxId:null, bonusTxId:null, ...data}));
      const rec = existing || APP.data.casesAd.find(x=>x.id===caseId);
      // 註：自動記帳已停用（見postBonusPayoutToTransactions的說明），這裡不再呼叫
      saveCasesAd();
      saveBonusLedgerEntry(stamp({ id:caseId, staffName:data.staff, date:data.date, businessBonus, xiaojiangBonus:0, customer:data.customer }));
      if(xiaojiangBonus>0){
        saveBonusLedgerEntry(stamp({ id:'xj-'+caseId, staffName:APP.data.caseSettings.xiaojiangName||'小江', date:data.date, businessBonus:0, xiaojiangBonus, customer:data.customer }));
      }
      syncWizardHatLedger(caseId, data.date, data.customer, specialFee);
    } catch(err){
      console.error('新增/編輯廣告客案件時發生錯誤：', err);
      alert('儲存時發生非預期錯誤，請截圖這則訊息回報給開發者：\n' + (err && err.message ? err.message : err));
    } finally{
      closeModal();
      render();
    }
  });
}

      // 註：自動記帳已停用（見postBonusPayoutToTransactions的說明），這裡不再呼叫、也不再嘗試讀取它設定的bonusTxId，
      // 之前這裡有一行 chRec.profitTxId = chRec.bonusTxId 會把undefined存進Firestore導致整筆存檔失敗，已經移除。
      if(businessBonus>0){
        saveBonusLedgerEntry(stamp({ id:'ch-'+chCaseId, staffName:data.staff, date:data.date, businessBonus, xiaojiangBonus:0, customer:data.customer }));

        deleteBonusLedgerEntry('ch-'+chCaseId);

      if(huangBonus>0){
        saveBonusLedgerEntry(stamp({ id:'huang-'+chCaseId, staffName:'煌', date:data.date, businessBonus:huangBonus, xiaojiangBonus:0, customer:data.customer }));
      } else {
        deleteBonusLedgerEntry('huang-'+chCaseId);
      }
      syncWizardHatLedger(chCaseId, data.date, data.customer, specialFee);
      saveCasesChannel();
    } catch(err){
      console.error('新增/編輯通路案件時發生錯誤：', err);
      alert('儲存時發生非預期錯誤，請截圖這則訊息回報給開發者：\n' + (err && err.message ? err.message : err));
    } finally{
      closeModal();
      render();
    }
  });
}

      <div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">取消</button><button type="submit" class="btn primary">儲存</button></div>
    </form>`;

      };

      saveTransactions();

      alert('儲存時發生非預期錯誤，請截圖這則訊息回報給開發者：\n' + (err && err.message ? err.message : err));
    } finally{
      closeModal();
      render();
    }
  });
}

let sbTipEl = null;

document.addEventListener('click', (e)=>{
  sbTipHide();
  const b = e.target.closest && e.target.closest('#sb-colbtn'); if(!b) return;
  const c = document.documentElement.classList.toggle('sb-col');
  try{ localStorage.setItem(SB_KEY, c ? '1' : '0'); }catch(_){}

});
document.addEventListener('mouseover', (e)=>{

  const txt = c.textContent.replace('☰', '').trim(); if(!txt) return sbTipHide();

  if(!sbTipEl){ sbTipEl = document.createElement('div'); sbTipEl.className = 'sb-tip'; document.body.appendChild(sbTipEl); }
  sbTipEl.textContent = txt; sbTipEl.style.left = Math.round(r.right + 10) + 'px'; sbTipEl.style.top = Math.round(r.top + r.height / 2) + 'px';
});

/* ---- 核心專用的財務資料摘要（含全公司財務、人事、獲利報表逐筆明細）---- */
function buildFinanceContext(){
  const year = nowYear;
  const txThis = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year));
  const txLast = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year-1));

  const expLast = sum(txLast.filter(t=>t.type==='expense'));

  function catSummary(list, type){
    const map={};
    list.filter(t=>t.type===type).forEach(t=>{ map[t.mainCategory]=(map[t.mainCategory]||0)+Number(t.amount||0); });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${money(v)}`);

  /* ---- 客戶關懷追蹤摘要：撥款完成後第1/2/3次關懷的逾期/已完成/追蹤中統計，讓AI能回答「誰還沒關懷」「未繳費有哪些人」這類問題 ---- */
  const allFollowups = APP.data.customerFollowups||[];
  const followupOverdueList = allFollowups.filter(f=>followupOverallStatus(f)==='overdue');

  const followupUnpaidList = allFollowups.filter(f=>f.paymentStatus==='unpaid');
  const followupOverdueLines = followupOverdueList.map(f=>`${f.customer||'未填'}（業務：${f.staff||'未填'}，方案：${f.plan||'未填'}，撥款日：${f.disbursedDate||'未填'}）`).join('\n');
  const followupUnpaidLines = followupUnpaidList.map(f=>`${f.customer||'未填'}（業務：${f.staff||'未填'}）`).join('、');

  const recent = APP.data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25)

  const assetsTotal = sum(APP.data.assets);
