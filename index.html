function getPresetRange(preset, year){
  const pad = n => String(n).padStart(2,'0');
  const y = year;
  if(preset==='thisMonth'){
    const now = new Date();
    const s = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    return {start:s, end:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(last)}`, label:'本月'};
  }
  if(preset==='lastMonth'){
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return {start:`${d.getFullYear()}-${pad(d.getMonth()+1)}-01`, end:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(last)}`, label:'上月'};
  }
  const qMap = { q1:[1,3], q2:[4,6], q3:[7,9], q4:[10,12] };
  if(qMap[preset]){
    const [m1,m2] = qMap[preset];
    const lastDay = new Date(y, m2, 0).getDate();
    return {start:`${y}-${pad(m1)}-01`, end:`${y}-${pad(m2)}-${pad(lastDay)}`, label:preset.toUpperCase()};
  }
  if(preset==='thisYear') return {start:`${y}-01-01`, end:`${y}-12-31`, label:`${y} 全年`};
  if(preset==='lastYear') return {start:`${y-1}-01-01`, end:`${y-1}-12-31`, label:`${y-1} 全年`};
  return null;
}
function prevPeriodRange(start, end){
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
  const days = Math.round((e-s)/86400000) + 1;
  const prevEnd = new Date(s); prevEnd.setDate(prevEnd.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate()-(days-1));
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return { start: fmt(prevStart), end: fmt(prevEnd) };
}
function trailingMonths(endDateStr, count){
  const end = new Date(endDateStr+'T00:00:00');
  const months = [];
  for(let i=count-1;i>=0;i--){
    const d = new Date(end.getFullYear(), end.getMonth()-i, 1);
    const y = d.getFullYear(), m = d.getMonth()+1;
    const last = new Date(y, m, 0).getDate();
    months.push({ label:`${y}/${String(m).padStart(2,'0')}`, start:`${y}-${String(m).padStart(2,'0')}-01`, end:`${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}` });
  }
  return months;
}
function deltaBadge(current, previous){
  if(previous===0){
    if(current===0) return `<span class="delta-flat">—</span>`;
    return `<span class="delta-up">▲ 新增</span>`;
  }
  const pct = ((current-previous)/Math.abs(previous))*100;
  const up = pct>=0;
  return `<span class="${up?'delta-up':'delta-down'}">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function lineChartSVG(months, incomeVals, expenseVals){
  const w=640, h=220, padL=44, padR=16, padT=16, padB=26;
  const maxVal = Math.max(1, ...incomeVals, ...expenseVals);
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = months.length>1 ? innerW/(months.length-1) : 0;
  const xOf = i => padL + i*stepX;
  const yOf = v => padT + innerH*(1-v/maxVal);
  const ptsStr = vals => vals.map((v,i)=>`${xOf(i)},${yOf(v)}`).join(' ');
  let grid = '';
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const y = padT + innerH*(i/ticks);
    const val = Math.round(maxVal*(1-i/ticks));
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EEF1FB" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" font-size="10" fill="#8A8874" text-anchor="end">${val>=10000?Math.round(val/1000)+'k':val}</text>`;
  }
  const xLabels = months.map((m,i)=>`<text x="${xOf(i)}" y="${h-8}" font-size="10" fill="#8A8874" text-anchor="middle">${m.label.slice(5)}</text>`).join('');
  const incomeDots = incomeVals.map((v,i)=>`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3" fill="#2F6B4F"/>`).join('');
  const expenseDots = expenseVals.map((v,i)=>`<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3" fill="#A63A2E"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px;">
    ${grid}
    <polyline points="${ptsStr(incomeVals)}" fill="none" stroke="#2F6B4F" stroke-width="2.5"/>
    <polyline points="${ptsStr(expenseVals)}" fill="none" stroke="#A63A2E" stroke-width="2.5"/>
    ${incomeDots}${expenseDots}
    ${xLabels}
  </svg>`;
}

function reportsHTML(){
  const year = APP.reportYear;
  const presets = [
    {key:'thisMonth',label:'本月'},{key:'lastMonth',label:'上月'},
    {key:'q1',label:'Q1'},{key:'q2',label:'Q2'},{key:'q3',label:'Q3'},{key:'q4',label:'Q4'},
    {key:'thisYear',label:year+' 全年'},{key:'lastYear',label:(year-1)+' 全年'}
  ];
  const activePreset = APP.reportRange && APP.reportRange.presetKey;
  const chips = presets.map(p=>`<button class="chip ${activePreset===p.key?'active':''}" data-action="report-preset" data-preset="${p.key}">${p.label}</button>`).join('');
  const start = APP.reportRange ? APP.reportRange.start : '';
  const end = APP.reportRange ? APP.reportRange.end : '';
  const cm = APP.reportCompareMode;

  const compareModes = [
    {key:'none', label:'不比較'},
    {key:'previous', label:'與上一期比較'},
    {key:'custom', label:'自訂比較期間'}
  ];
  const compareChips = compareModes.map(c=>`<button class="chip ${cm===c.key?'active':''}" data-action="report-compare-mode" data-mode="${c.key}">${c.label}</button>`).join('');
  const customCompareFields = cm==='custom' ? `
    <div class="filter-field"><label>比較開始</label><input type="date" id="report-compare-start"/></div>
    <div class="filter-field"><label>比較結束</label><input type="date" id="report-compare-end"/></div>` : '';

  let resultHtml = '';
  if(APP.reportRange && APP.reportRange.generated){
    const s = APP.reportRange.start, e = APP.reportRange.end;
    const txs = APP.data.transactions.filter(t=>t.date>=s && t.date<=e);
    const inc = sum(txs.filter(t=>t.type==='income'));
    const exp = sum(txs.filter(t=>t.type==='expense'));

    let compareBlock = '';
    let cInc=0, cExp=0, hasCompare=false;
    if(cm!=='none' && APP.reportRange.compareStart && APP.reportRange.compareEnd){
      hasCompare = true;
      const cs = APP.reportRange.compareStart, ce = APP.reportRange.compareEnd;
      const ctxs = APP.data.transactions.filter(t=>t.date>=cs && t.date<=ce);
      cInc = sum(ctxs.filter(t=>t.type==='income'));
      cExp = sum(ctxs.filter(t=>t.type==='expense'));
      const maxV = Math.max(1, inc, exp, cInc, cExp);
      const barH = v => Math.round((v/maxV)*170);
      compareBlock = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head-row"><h3>期間比較</h3><span class="hint">本期：${s} ~ ${e}　比較期：${cs} ~ ${ce}</span></div>
          <div class="grid grid-2" style="margin-bottom:18px;">
            <div><div class="stat-label">收入變化</div><div class="stat-value" style="font-size:19px;">${money(inc)} <span style="color:var(--muted);font-size:13px;">vs ${money(cInc)}</span> ${deltaBadge(inc,cInc)}</div></div>
            <div><div class="stat-label">支出變化</div><div class="stat-value" style="font-size:19px;">${money(exp)} <span style="color:var(--muted);font-size:13px;">vs ${money(cExp)}</span> ${deltaBadge(exp,cExp)}</div></div>
          </div>
          <div class="rpt-legend">
            <span><span class="rpt-dot" style="background:var(--navy)"></span>本期</span>
            <span><span class="rpt-dot" style="background:#FFFFFF"></span>比較期</span>
          </div>
          <div class="bar-chart" style="height:200px;">
            <div class="bar-col"><div class="bar-pair" style="height:170px;">
              <div class="bar" style="height:${barH(inc)}px;background:var(--green);"></div>
              <div class="bar" style="height:${barH(cInc)}px;background:#BFD0FB;"></div>
            </div><div class="m-label">收入</div></div>
            <div class="bar-col"><div class="bar-pair" style="height:170px;">
              <div class="bar" style="height:${barH(exp)}px;background:var(--red);"></div>
              <div class="bar" style="height:${barH(cExp)}px;background:#FCA5A5;"></div>
            </div><div class="m-label">支出</div></div>
          </div>
        </div>`;
    }

    const months = trailingMonths(e, 6);
    const monthIncome = months.map(m=>sum(APP.data.transactions.filter(t=>t.type==='income' && t.date>=m.start && t.date<=m.end)));
    const monthExpense = months.map(m=>sum(APP.data.transactions.filter(t=>t.type==='expense' && t.date>=m.start && t.date<=m.end)));
    const trendBlock = `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-head-row"><h3>近 6 個月趨勢</h3></div>
        <div class="rpt-legend">
          <span><span class="rpt-dot" style="background:var(--green)"></span>收入</span>
          <span><span class="rpt-dot" style="background:var(--red)"></span>支出</span>
        </div>
        ${lineChartSVG(months, monthIncome, monthExpense)}
      </div>`;

    function breakdown(type){
      const list = txs.filter(t=>t.type===type);
      const map = {};
      list.forEach(t=>{ map[t.mainCategory]=(map[t.mainCategory]||0)+Number(t.amount||0); });
      const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
      if(rows.length===0) return `<tr><td colspan="2" style="color:var(--muted);text-align:center;padding:20px;">無資料</td></tr>`;
      return rows.map(([n,v])=>`<tr><td>${escHtml(n)}</td><td style="text-align:right;">${money(v)}</td></tr>`).join('');
    }

    resultHtml = `
      <div class="grid grid-3" style="margin:20px 0 16px 0;">
        <div class="card"><div class="stat-label">總收入</div><div class="stat-value green">${money(inc)}</div>${hasCompare?deltaBadge(inc,cInc):''}</div>
        <div class="card"><div class="stat-label">總支出</div><div class="stat-value red">${money(exp)}</div>${hasCompare?deltaBadge(exp,cExp):''}</div>
        <div class="card"><div class="stat-label">淨損益</div><div class="stat-value ${inc-exp>=0?'blue':'red'}">${money(inc-exp)}</div>${hasCompare?deltaBadge(inc-exp,cInc-cExp):''}</div>
      </div>
      ${compareBlock}
      ${trendBlock}
      <div class="grid grid-2">
        <div class="card"><h3 style="margin-top:0;">收入明細</h3><table><tbody>${breakdown('income')}</tbody></table></div>
        <div class="card"><h3 style="margin-top:0;">支出明細</h3><table><tbody>${breakdown('expense')}</tbody></table></div>
      </div>`;
  }
  return `
    <div class="page-header"><div><h1 class="page-title">財報</h1><p class="page-sub">選取期間生成完整財務報告，支援與上一期或自訂期間比較</p></div></div>
    <div class="card">
      <div class="chip-row">${chips}</div>
      <div class="filter-row" style="border:none;padding:0;margin-bottom:0;">
        <div class="filter-field"><label>開始日期</label><input type="date" id="report-start" value="${start}"/></div>
        <div class="filter-field"><label>結束日期</label><input type="date" id="report-end" value="${end}"/></div>
        <button class="btn primary" data-action="generate-report">生成財報</button>
      </div>
      <div class="rpt-compare-row">
        <label>比較：</label>${compareChips}
        ${customCompareFields}
      </div>
    </div>
    ${resultHtml}
  `;
}

          return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="badge" style="background:${current.bg};color:${current.text};min-width:80px;text-align:center;">${escHtml(opt)}</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              ${OPTION_COLOR_PALETTE.map((c,idx)=>`<button type="button" class="option-color-swatch" data-action="option-color-swatch" data-category="${g.key}" data-option="${escAttr(opt)}" data-idx="${idx}" title="套用這個顏色" style="width:22px;height:22px;border-radius:6px;background:${c.bg};border:2px solid ${custom&&custom.bg===c.bg?c.text:'transparent'};cursor:pointer;padding:0;"></button>`).join('')}
              ${custom ? `<button type="button" class="option-color-reset" data-action="option-color-reset" data-category="${g.key}" data-option="${escAttr(opt)}" style="font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;cursor:pointer;">恢復自動</button>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
  return `
    <div class="page-header"><div><h1 class="page-title">下拉選單顏色設定</h1><p class="page-sub">進度追蹤跟我的客人紀錄的選項顏色，可以自己指定；跟收支明細、財報的分類顏色是分開的兩套邏輯，不會互相影響</p></div></div>
    ${groupsHtml}
  `;
}

function updateDailyBonusPulse(){
  const navEl = document.querySelector('.nav-item[data-view="dailyBonus"]');
  if(!navEl) return;
  const t = todayStr();
  const hasUnpaidToday = isCore() && (
    APP.data.casesAd.some(c=>c.date===t && !adAllPaid(c)) ||
    APP.data.casesChannel.some(c=>c.date===t && !chAllPaid(c)) ||
    [...APP.data.casesAd, ...APP.data.casesChannel].some(c=>c.date===t && c.specialHandling && Number(c.specialFee)>0 && !c.specialFeePaid)
  );
  navEl.classList.toggle('nav-item-pulse', hasUnpaidToday);
  let dot = navEl.querySelector('.nav-pulse-dot');
  if(hasUnpaidToday && !dot){
    dot = document.createElement('span');
    dot.className = 'nav-pulse-dot';
    navEl.appendChild(dot);
  } else if(!hasUnpaidToday && dot){
    dot.remove();
  }
}
function showXjToast(text, threadUid, kind){
  const existing = document.querySelectorAll('.xj-toast').length;
  const toast = document.createElement('div');
  toast.className = 'xj-toast';
  toast.textContent = text;
  toast.style.cssText = `position:fixed;bottom:${24+existing*58}px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9999;cursor:pointer;max-width:280px;animation:xj-toast-in .3s ease-out;transition:bottom .25s ease;`;
  toast.addEventListener('click', ()=>{
    toast.remove();
    if(kind==='announcement'){
      toggleNotifPanel(true);
    } else {
      APP.view='xiaojiangInbox'; APP.xjActiveThread = threadUid;
      render();
      const meIsXj = !!(APP.users.find(u=>u.id===APP.user.uid)||{}).isXiaojiang;
      if(meIsXj){
        (APP.data.xiaojiangInbox||[]).filter(m=>m.threadUid===threadUid && !m.senderIsXiaojiang && !m.readByXiaojiang)
          .forEach(m=>{ updateDoc(doc(db,'xiaojiangInbox', m.id), {readByXiaojiang:true}).catch(()=>{}); });
      }
    }
  });
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.style.transition='opacity .4s'; toast.style.opacity='0'; setTimeout(()=>toast.remove(), 400); }, 6000);
}

function showUpdateBanner(){

  bar.id = 'update-banner';
  bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9998;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:13.5px;box-shadow:0 -4px 16px rgba(0,0,0,.2);flex-wrap:wrap;';

/* ---- 分頁沒在看時，工作列(瀏覽器分頁/工作列縮圖)閃黃色圖示提醒 ---- */
let taskbarFlashTimer = null;
let taskbarFlashOriginalTitle = null;
let taskbarFlashOriginalFavicon = null;
let taskbarFlashCurrentText = '';
function startTaskbarFlash(alertText){
  if(document.hasFocus() && !document.hidden) return; // 使用者正在看畫面，不用閃
  taskbarFlashCurrentText = alertText;
  if(taskbarFlashTimer) return; // 已經在閃了，只更新文字，不重新記錄原始圖示
  const link = document.querySelector('link[rel="icon"]');
  taskbarFlashOriginalFavicon = link ? link.href : './icon-192.png';
  taskbarFlashOriginalTitle = document.title;
  const img = new Image();
  img.onload = ()=>{
    if(taskbarFlashTimer) return; // 圖片載入這段期間，使用者可能已經切回來看了
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 64, 64);
    ctx.beginPath();
    ctx.arc(48, 16, 15, 0, Math.PI*2);
    ctx.fillStyle = '#FACC15';
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    const alertFaviconUrl = canvas.toDataURL('image/png');
    let toggled = false;
    taskbarFlashTimer = setInterval(()=>{
      toggled = !toggled;
      if(link) link.href = toggled ? alertFaviconUrl : taskbarFlashOriginalFavicon;
      document.title = toggled ? ('🔔 '+taskbarFlashCurrentText) : taskbarFlashOriginalTitle;
    }, 700);
  };
  img.src = taskbarFlashOriginalFavicon;
}
function stopTaskbarFlash(){
  if(!taskbarFlashTimer) return;
  clearInterval(taskbarFlashTimer);
  taskbarFlashTimer = null;
  const link = document.querySelector('link[rel="icon"]');
  if(link && taskbarFlashOriginalFavicon) link.href = taskbarFlashOriginalFavicon;
  if(taskbarFlashOriginalTitle) document.title = taskbarFlashOriginalTitle;
}
window.addEventListener('focus', stopTaskbarFlash);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) stopTaskbarFlash(); });

function flashBellNotification(text, onClick){
  startTaskbarFlash(text);
  let flyout = document.getElementById('notif-bell-flyout');
  if(!flyout){
    flyout = document.createElement('div');
    flyout.id = 'notif-bell-flyout';
    document.body.appendChild(flyout);
  }
  flyout.textContent = text;
  flyout.onclick = ()=>{ flyout.classList.remove('show'); stopTaskbarFlash(); (onClick||(()=>toggleNotifPanel(true)))(); };
  requestAnimationFrame(()=>{ flyout.classList.add('show'); });
}
function updateNotifBell(){
  const bell = document.getElementById('notif-bell');
  if(!bell) return;
  if(!APP._notifReadIds) APP._notifReadIds = new Set();
  const unreadAnnouncements = (APP.data.announcements||[]).filter(a=>!APP._notifReadIds.has(a.id)).length;
  const meIsXj = !!(APP.users.find(u=>u.id===APP.user.uid)||{}).isXiaojiang;
  let unreadChat = 0;
  if(meIsXj){
    unreadChat = (APP.data.xiaojiangInbox||[]).filter(m=>!m.senderIsXiaojiang && !m.readByXiaojiang).length;
  } else {
    unreadChat = (APP.data.xiaojiangInbox||[]).filter(m=>m.senderIsXiaojiang && m.threadUid===APP.user.uid && !APP._notifReadIds.has(m.id)).length;
  }
  const total = unreadAnnouncements + unreadChat + (fuMyTodo().n ? 1 : 0);
  bell.classList.toggle('has-unread', total>0);
  const badge = bell.querySelector('.notif-badge');
  if(badge){
    if(total>0){ badge.textContent = total>9?'9+':String(total); badge.style.display='flex'; }
    else { badge.style.display='none'; }
  }
  const panel = document.getElementById('notif-panel');
  if(panel && panel.classList.contains('open')) panel.innerHTML = notifPanelHtml();
}
function toggleNotifPanel(forceOpen){
  const panel = document.getElementById('notif-panel');
  if(!panel) return;
  const willOpen = forceOpen!==undefined ? forceOpen : !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
  if(willOpen){
    if(!APP._notifReadIds) APP._notifReadIds = new Set();
    (APP.data.announcements||[]).forEach(a=>APP._notifReadIds.add(a.id));
    panel.innerHTML = notifPanelHtml();
    updateNotifBell();
  }
}

function render(){
  document.querySelectorAll('.nav-item').forEach(el=>{ el.classList.toggle('active', el.dataset.view===APP.view); });
  updateDailyBonusPulse();
  updateNotifBell();
  const main = document.getElementById('main');
  if(!main) return;
  if(APP.view==='personalLog' && plShouldDefer()) return; // 正在個人業務進度紀錄打字時先不重畫，離開欄位再補畫
  if(APP.view==='progress' && pgShouldDefer()) return; // 正在進度追蹤打字時也一樣
  if(APP.view==='bankLoan' && bkShouldDefer()) return; // 銀行信貸也一樣
  if(APP.view==='valuation' && vaShouldDefer()) return; // 房屋土地估價也一樣

  if(isStaffAny() && !staffOnlyViews.includes(APP.view)){ APP.view = 'personalDashboard'; }
  if(APP.view!=='chatRoom') crLeave(main);
  main.classList.toggle('cr-full', APP.view==='chatRoom');
  const roomOk = isStaffAny() || (isCore() && APP.viewingStaff);
  if(APP.view==='dashboard' && isCore()) main.innerHTML = dashboardHTML();
  else if(APP.view==='xiaojiangDashboard' && isCore()) main.innerHTML = xiaojiangDashboardView();
  else if(APP.view==='socialAccounts' && (isMeXiaojiang() || isMeHuang())) main.innerHTML = socialAccountsHTML();

  else if(APP.view==='reports' && isCore()) main.innerHTML = reportsHTML();

  else if(APP.view==='optionColors' && (isCore() || isStaffAdmin())) main.innerHTML = optionColorSettingsView();
  else if(APP.view==='hr' && isCore()) main.innerHTML = hrHTML();

  else if(APP.view==='cases' && isCore()) main.innerHTML = casesHTML();
  else if(APP.view==='valuation' && isCore()) main.innerHTML = valuationPageHTML();

/* ---- 依教戰守則的養號時間表，算出這個帳號從建立日到今天是第幾天、對應到哪個階段 ---- */
function daysSinceDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
const FOLLOWUP_STAGE2_3_GAP = 25;
const FOLLOWUP_MEDICAL_FIRST_DAYS = 12;
const FOLLOWUP_DEFAULT_FIRST_DAYS = 25;
/* ---- 客戶關懷追蹤的三階段提醒狀態：
   第1次——依方案不同，醫美是撥款後12天，其他方案都是撥款後25天；
   第2次——不是固定從撥款日算，而是「第1次完成後」再過25天；
   第3次——同樣是「第2次完成後」再過25天。
   所以第2/3次要等前一次真的打勾完成、才會有到期日；前一次還沒完成時，下一次視為「還沒開始」。
   isDue=已經到了該提醒的天數，isOverdue=到了天數但業務還沒打勾完成 ---- */
function followupStages(f){
  const isMedical = (f.plan||'').includes('醫美');
  const stage1Days = isMedical ? FOLLOWUP_MEDICAL_FIRST_DAYS : FOLLOWUP_DEFAULT_FIRST_DAYS;
  const r1 = f.reminder1 || {done:false, note:''};
  const r2 = f.reminder2 || {done:false, note:''};
  const r3 = f.reminder3 || {done:false, note:''};

  const disbursedDays = daysSinceDate(f.disbursedDate);
  const stage1IsDue = disbursedDays!==null && disbursedDays>=stage1Days;

  const daysSinceR1Done = r1.done ? daysSinceDate(r1.doneDate) : null;
  const stage2IsDue = daysSinceR1Done!==null && daysSinceR1Done>=FOLLOWUP_STAGE2_3_GAP;

  const daysSinceR2Done = r2.done ? daysSinceDate(r2.doneDate) : null;
  const stage3IsDue = daysSinceR2Done!==null && daysSinceR2Done>=FOLLOWUP_STAGE2_3_GAP;

  return [
    { num:1, thresholdLabel:`撥款後${stage1Days}天`, key:'reminder1', done:!!r1.done, note:r1.note||'', isDue:stage1IsDue, isOverdue: stage1IsDue && !r1.done, waitingOnPrevious:false },
    { num:2, thresholdLabel:'前次完成後25天', key:'reminder2', done:!!r2.done, note:r2.note||'', isDue:stage2IsDue, isOverdue: stage2IsDue && !r2.done, waitingOnPrevious: !r1.done },
    { num:3, thresholdLabel:'前次完成後25天', key:'reminder3', done:!!r3.done, note:r3.note||'', isDue:stage3IsDue, isOverdue: stage3IsDue && !r3.done, waitingOnPrevious: !r2.done },
  ];
}

/* ---- 個人帳號／粉絲專頁／廣告帳號是三種生命週期不同的獨立資源，各自有自己的「養多久才安全」門檻：

function personalAccountAgeInfo(createdDate){
  const days = daysSinceDate(createdDate);
  if(days===null) return null;
  const months = Math.floor(days/30);
  const ready = days>=90; // 建議至少3個月
  return { days, months, ready, label: months>0?`${months}個月`:`${days}天` };
}
function fanPageAgeInfo(createdDate){

  if(days===null) return null;

  return { days, weeks, ready, label: weeks>0?`${weeks}週`:`${days}天` };
}

function openSocialAccountModal(existing){
  const a = existing || {accountName:'',platform:'Facebook',status:'養號中',strategyStage:'新建',bmGroup:'',createdDate:todayStr(),lastLoginDate:'',loginAccount:'',password:'',twoFactor:'',boundPhone:'',boundEmail:'',adSpendNote:'',note:'',compliance:{},personalAccountId:'',fanPageId:''};
  const existingBmGroups = Array.from(new Set((APP.data.socialAccounts||[]).map(x=>x.bmGroup).filter(Boolean)));
  const compliance = a.compliance || {};
  const personalAccounts = APP.data.personalAccounts||[];
  const fanPages = APP.data.fanPages||[];
  openModal(existing?'編輯帳號':'新增帳號', `
    <label class="field"><span>帳號名稱／暱稱</span><input type="text" name="accountName" value="${escAttr(a.accountName)}" required placeholder="方便自己辨識用的名字"/></label>
    <div class="grid grid-2">
      <label class="field"><span>平台</span><select name="platform">${SOCIAL_ACCOUNT_PLATFORM_OPTIONS.map(p=>`<option value="${p}" ${a.platform===p?'selected':''}>${p}</option>`).join('')}</select></label>
      <label class="field"><span>狀態</span><select name="status">${SOCIAL_ACCOUNT_STATUS_OPTIONS.map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    <div class="grid grid-2">
      <label class="field"><span>培養策略階段</span><select name="strategyStage">${SOCIAL_ACCOUNT_STRATEGY_STAGES.map(s=>`<option value="${s}" ${a.strategyStage===s?'selected':''}>${s}</option>`).join('')}</select></label>
      <label class="field"><span>所屬BM</span><input type="text" name="bmGroup" list="bm-group-suggest" value="${escAttr(a.bmGroup||'')}" placeholder="例如：投放BM A、備用BM"/>
        <datalist id="bm-group-suggest">${existingBmGroups.map(g=>`<option value="${escAttr(g)}">`).join('')}</datalist>
      </label>
    </div>
    <div class="grid grid-2">
      <label class="field"><span>管理此帳號的個人帳號</span><select name="personalAccountId"><option value="">（未指定）</option>${personalAccounts.map(p=>`<option value="${p.id}" ${a.personalAccountId===p.id?'selected':''}>${escHtml(p.accountName)}</option>`).join('')}</select></label>
      <label class="field"><span>綁定的粉絲專頁</span><select name="fanPageId"><option value="">（未指定）</option>${fanPages.map(p=>`<option value="${p.id}" ${a.fanPageId===p.id?'selected':''}>${escHtml(p.pageName)}</option>`).join('')}</select></label>
    </div>
    <div class="grid grid-2">
      <label class="field"><span>帳號建立日期</span><input type="date" name="createdDate" value="${a.createdDate||''}"/><span style="color:var(--muted);font-size:11px;">用來自動算養號天數</span></label>
      <label class="field"><span>上次登入日期</span><input type="date" name="lastLoginDate" value="${a.lastLoginDate||''}"/><span style="color:var(--muted);font-size:11px;">備用帳號閒置超過30天會警示</span></label>
    </div>
    <label class="field"><span>登入帳號</span><input type="text" name="loginAccount" value="${escAttr(a.loginAccount)}"/></label>
    <label class="field"><span>密碼</span><input type="text" name="password" value="${escAttr(a.password)}"/></label>
    <label class="field"><span>2FA（金鑰或備用碼）</span><input type="text" name="twoFactor" value="${escAttr(a.twoFactor)}"/></label>
    <div class="grid grid-2">
      <label class="field"><span>綁定手機</span><input type="text" name="boundPhone" value="${escAttr(a.boundPhone)}"/></label>
      <label class="field"><span>綁定信箱</span><input type="text" name="boundEmail" value="${escAttr(a.boundEmail)}"/></label>
    </div>
    <label class="field"><span>花費／成效備註</span><input type="text" name="adSpendNote" value="${escAttr(a.adSpendNote)}" placeholder="例如：累計花費 $12,000，CPM表現穩定"/></label>
    <div class="field"><span>合規檢查</span>
      ${SOCIAL_ACCOUNT_COMPLIANCE_ITEMS.map(item=>`<label class="field checkbox" style="margin-bottom:6px;"><input type="checkbox" name="compliance_${item.key}" ${compliance[item.key]?'checked':''}/><span>${item.label}</span></label>`).join('')}
    </div>
    <label class="field"><span>備註</span><textarea name="note">${escHtml(a.note||'')}</textarea></label>
  `, 'social-account-form', (data)=>{
    const complianceResult = {};
    SOCIAL_ACCOUNT_COMPLIANCE_ITEMS.forEach(item=>{
      complianceResult[item.key] = data['compliance_'+item.key]==='on';
      delete data['compliance_'+item.key];
    });
    data.compliance = complianceResult;
    const rec = existing ? Object.assign(existing, stamp(data)) : stamp({id:uid(), ...data});
    saveSocialAccount(rec);

function myProgressView(){
  const me = effectiveStaffName();
  if(!me){
    return `<div class="table-wrap"><div class="empty">你的帳號還沒有設定「對應業務姓名」，請聯絡管理員在「帳號管理」幫你設定後才能使用。</div></div>`;
  }
  const myAd = APP.data.progressAd.filter(c=>c.staff===me);
  const myCh = APP.data.progressChannel.filter(c=>c.staff===me);
  const combined = [
    ...myAd.map(c=>({...c, _type:'ad'})),
    ...myCh.map(c=>({...c, _type:'channel'}))
  ].sort((a,b)=> b.date.localeCompare(a.date));

  const byMonth = {};
  combined.forEach(c=>{ const mk = monthKey(c.date); (byMonth[mk]=byMonth[mk]||[]).push(c); });
  const months = Object.keys(byMonth).sort().reverse();

  const rows = combined.map(c=>`
    <tr>
      <td>${c.date}</td>
      <td><span class="badge ${c._type==='ad'?'income':'expense'}">${c._type==='ad'?'廣告客':'直客通路'}</span></td>

    </tr>`).join('');

  const monthSummary = months.map(m=>{
    const list = byMonth[m];
    const done = list.filter(c=>STATUS_DONE.includes(c.status)).length;
    const closed = list.filter(c=>STATUS_CLOSED.includes(c.status)).length;
    return `<div class="cat-row"><div class="name">${m}</div><div class="val" style="width:auto;flex:1;text-align:left;">共 ${list.length} 件 · 撥款完成 ${done} 件 · 婉拒/客拒 ${closed} 件</div></div>`;

/* ---- 獎金日曆格狀顯示：把逐筆的{date,customer,amount}紀錄，畫成傳統月曆的樣子，
   每一天一個格子，有獎金的格子顯示總金額跟人數，點下去彈窗看當天詳細的每一筆 ---- */
/* ---- 客戶關懷追蹤清單：依撥款月份分組顯示，showStaffColumn決定要不要多顯示業務欄位(核心/小江總覽用) ---- */
function customerFollowupListHtml(followups, showStaffColumn, idPrefix){
  const canEditPayment = isCore() || isStaffAdmin();
  const tf = ensureFollowupFilter(idPrefix);
  const planList = Array.from(new Set(followups.map(f=>f.plan).filter(Boolean))).sort();
  const referrerList = Array.from(new Set(followups.map(f=>f.referrer).filter(Boolean))).sort();

  let filtered = followups;
  if(tf.plan!=='all') filtered = filtered.filter(f=>f.plan===tf.plan);
  if(tf.cared==='done') filtered = filtered.filter(f=>followupOverallStatus(f)==='done');
  else if(tf.cared==='notdone') filtered = filtered.filter(f=>followupOverallStatus(f)!=='done');
  else if(tf.cared==='needcare') filtered = filtered.filter(f=>followupOverallStatus(f)==='overdue');
  else if(tf.cared==='tracking') filtered = filtered.filter(f=>followupOverallStatus(f)==='tracking');
  if(tf.payment==='unpaid') filtered = filtered.filter(f=>f.paymentStatus==='unpaid');
  else if(tf.payment==='normal') filtered = filtered.filter(f=>f.paymentStatus!=='unpaid');
  if(tf.source==='ad') filtered = filtered.filter(f=>f.sourceType!=='channel');
  else if(tf.source==='channel') filtered = filtered.filter(f=>f.sourceType==='channel');
  if(tf.referrer!=='all') filtered = filtered.filter(f=>f.referrer===tf.referrer);

  const sortMode = tf.sort || 'overdue';
  const SORT_OPTIONS = [
    {value:'overdue', label:'逾期優先（預設）'},
    {value:'date-desc', label:'撥款日：新到舊'},
    {value:'date-asc', label:'撥款日：舊到新'},
    {value:'name', label:'客戶姓名'},
  ];

  const filterRowHtml = `
    <div class="filter-row">
      <div class="filter-field"><label>方案</label>
        <select data-case-filter="followup-plan-${idPrefix}"><option value="all" ${tf.plan==='all'?'selected':''}>全部</option>
        ${planList.map(p=>`<option value="${escAttr(p)}" ${tf.plan===p?'selected':''}>${escHtml(p)}</option>`).join('')}</select>
      </div>
      <div class="filter-field"><label>客源</label>
        <select data-case-filter="followup-source-${idPrefix}">
          <option value="all" ${tf.source==='all'?'selected':''}>全部</option>
          <option value="ad" ${tf.source==='ad'?'selected':''}>廣告客</option>
          <option value="channel" ${tf.source==='channel'?'selected':''}>直客/通路</option>
        </select>
      </div>
      <div class="filter-field"><label>通路夥伴</label>
        <select data-case-filter="followup-referrer-${idPrefix}"><option value="all" ${tf.referrer==='all'?'selected':''}>全部</option>
        ${referrerList.map(r=>`<option value="${escAttr(r)}" ${tf.referrer===r?'selected':''}>${escHtml(r)}</option>`).join('')}</select>
      </div>
      <div class="filter-field"><label>關懷狀態</label>
        <select data-case-filter="followup-cared-${idPrefix}">
          <option value="all" ${tf.cared==='all'?'selected':''}>全部</option>
          <option value="needcare" ${tf.cared==='needcare'?'selected':''}>⚠ 需要關懷（逾期未處理）</option>
          <option value="tracking" ${tf.cared==='tracking'?'selected':''}>追蹤中（尚未到期）</option>
          <option value="done" ${tf.cared==='done'?'selected':''}>已關懷（三次都完成）</option>
          <option value="notdone" ${tf.cared==='notdone'?'selected':''}>未關懷（含追蹤中＋逾期）</option>
        </select>
      </div>
      <div class="filter-field"><label>繳費狀態</label>
        <select data-case-filter="followup-payment-${idPrefix}">
          <option value="all" ${tf.payment==='all'?'selected':''}>全部</option>
          <option value="normal" ${tf.payment==='normal'?'selected':''}>正常</option>
          <option value="unpaid" ${tf.payment==='unpaid'?'selected':''}>未繳費</option>
        </select>
      </div>
      <div class="filter-field"><label>排序</label>
        <select data-case-filter="followup-sort-${idPrefix}">
          ${SORT_OPTIONS.map(o=>`<option value="${o.value}" ${sortMode===o.value?'selected':''}>${o.label}</option>`).join('')}
        </select>
      </div>
    </div>
  `;

  if(filtered.length===0) return filterRowHtml + `<div class="table-wrap"><div class="empty">沒有符合條件的客戶</div></div>`;

  const byMonth = {};
  filtered.forEach(f=>{
    const mk = monthKey(f.disbursedDate);
    if(!byMonth[mk]) byMonth[mk] = [];
    byMonth[mk].push(f);
  });
  const months = Object.keys(byMonth).sort().reverse();
  if(!APP.followupMonthFilter) APP.followupMonthFilter = {};
  const selectedMonth = (APP.followupMonthFilter[idPrefix] && months.includes(APP.followupMonthFilter[idPrefix]))
    ? APP.followupMonthFilter[idPrefix]
    : (months.includes(nowMonthKey) ? nowMonthKey : months[0]);
  const list = (byMonth[selectedMonth]||[]).slice().sort((a,b)=>{
    if(sortMode==='date-desc') return (b.disbursedDate||'').localeCompare(a.disbursedDate||'');
    if(sortMode==='date-asc') return (a.disbursedDate||'').localeCompare(b.disbursedDate||'');
    if(sortMode==='name') return (a.customer||'').localeCompare(b.customer||'');
    const aOverdue = followupOverallStatus(a)==='overdue', bOverdue = followupOverallStatus(b)==='overdue';
    if(aOverdue!==bOverdue) return aOverdue?-1:1;
    return (b.disbursedDate||'').localeCompare(a.disbursedDate||'');
  });
  return `
    ${filterRowHtml}
    <div class="filter-row">
      <div class="filter-field"><label>月份</label>
        <select data-case-filter="followup-month-${idPrefix}">${months.map(mk=>{
          const [y,m] = mk.split('-');
          return `<option value="${mk}" ${mk===selectedMonth?'selected':''}>${y}年${Number(m)}月</option>`;
        }).join('')}</select>
      </div>
    </div>
    <div class="table-wrap" style="margin-bottom:16px;">
      <table><thead><tr>
        <th>需要關懷</th><th>客戶</th><th>電話</th><th>客源</th><th>通路</th><th>核准方案</th>${showStaffColumn?'<th>業務</th>':''}<th>撥款日</th><th>第1次</th><th>第2次</th><th>第3次</th><th>繳費狀態</th>
      </tr></thead><tbody>
        ${list.map(f=>{
          const stages = followupStages(f);
          const isUnpaid = f.paymentStatus==='unpaid';
          const needsCare = followupOverallStatus(f)==='overdue';
          return `<tr${isUnpaid?' style="background:#FEE2E2;"':''}>
            <td>${needsCare?`<span class="badge expense">⚠ 需要關懷</span>`:''}</td>
            <td>${escHtml(f.customer||'—')}</td>
            <td>${escHtml(f.phone||'—')}</td>
            <td>${f.sourceType==='channel'?'直客/通路':'廣告客'}</td>
            <td>${escHtml(f.referrer||'—')}</td>
            <td>${optionBadgeHtml(f.plan, '—', 'plan')}</td>
            ${showStaffColumn?`<td>${escHtml(f.staff||'—')}</td>`:''}
            <td>${f.disbursedDate||'—'}</td>
            ${stages.map(s=>`<td>${followupStageCellHtml(f.id, s)}</td>`).join('')}
            <td>${canEditPayment?`
              <select class="payment-status-select" data-id="${f.id}">
                <option value="" ${!isUnpaid?'selected':''}>正常</option>
                <option value="unpaid" ${isUnpaid?'selected':''}>未繳費</option>
              </select>
            `:(isUnpaid?`<span class="badge expense">未繳費</span>`:`<span style="color:var(--muted);font-size:12px;">正常</span>`)}</td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>
  `;
}
function followupStageCellHtml(followupId, stage){
  if(stage.done){
    return `<span class="badge active">✓ 已完成</span>${stage.note?`<div style="font-size:11px;color:var(--muted);margin-top:2px;max-width:140px;">${escHtml(stage.note)}</div>`:''}`;
  }
  if(!stage.isDue){
    if(stage.waitingOnPrevious){
      return `<span style="color:var(--muted);font-size:12px;">待前次完成</span>`;
    }
    return `<span style="color:var(--muted);font-size:12px;">未到期（${stage.thresholdLabel}）</span>`;
  }
  return `<button type="button" class="btn sm" style="${stage.isOverdue?'background:var(--red);color:#fff;':''}" data-action="mark-followup-stage" data-id="${followupId}" data-stage="${stage.key}">${stage.isOverdue?'⚠ ':''}打勾完成</button>`;
}
/* ---- 請假日曆：沿用獎金日曆同一套月份瀏覽狀態（APP.bonusCalMonth）跟CSS樣式，有請假的格子顯示圓點，點進去看當天詳細假別 ---- */
function attendanceCalendarGrid(records, idPrefix){
  if(!APP.bonusCalMonth) APP.bonusCalMonth = {};
  const mk = APP.bonusCalMonth[idPrefix] || nowMonthKey;
  const monthRecords = records.filter(a=>monthKey(a.date)===mk);
  if(!APP._bonusCalEntries) APP._bonusCalEntries = {};
  APP._bonusCalEntries[idPrefix] = monthRecords;
  const [year, month] = mk.split('-').map(Number);
  const firstWeekday = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const byDate = {};
  monthRecords.forEach(a=>{
    if(!byDate[a.date]) byDate[a.date] = [];
    byDate[a.date].push(a);
  });
  const todayD = todayStr();
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push('');
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRecords = byDate[dateStr]||[];
    const isToday = dateStr===todayD;
    cells.push(`<div class="bonus-cal-cell${isToday?' today':''}${dayRecords.length>0?' has-leave':''}"${dayRecords.length>0?` data-action="show-attendance-day" data-prefix="${idPrefix}" data-date="${dateStr}"`:''}>
      <div class="bonus-cal-daynum">${month}/${d}</div>
      ${dayRecords.length>0?`<div class="bonus-cal-dot leave-dot"></div>`:''}
    </div>`);
  }
  while(cells.length % 7 !== 0) cells.push('<div class="bonus-cal-cell empty"></div>');
  const weekdayLabels = ['日','一','二','三','四','五','六'];
  return `
    <div class="bonus-cal">
      <div class="bonus-cal-title-row">
        <button type="button" class="icon-btn" data-action="bonus-cal-shift" data-prefix="${idPrefix}" data-dir="-1">←</button>
        <div class="bonus-cal-title">${year}年${month}月</div>
        <button type="button" class="icon-btn" data-action="bonus-cal-shift" data-prefix="${idPrefix}" data-dir="1">→</button>
      </div>
      <div class="bonus-cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="bonus-cal-grid">${cells.join('')}</div>
    </div>
  `;
}

function bonusCalendarGrid(allEntries, idPrefix){
  if(!APP.bonusCalMonth) APP.bonusCalMonth = {};
  const mk = APP.bonusCalMonth[idPrefix] || nowMonthKey;
  const entries = allEntries.filter(e=>monthKey(e.date)===mk);
  if(!APP._bonusCalEntries) APP._bonusCalEntries = {};
  APP._bonusCalEntries[idPrefix] = entries;
  const [year, month] = mk.split('-').map(Number);
  const firstWeekday = new Date(year, month-1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const byDate = {};
  entries.forEach(e=>{
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });
  const todayD = todayStr();
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push('');
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEntries = byDate[dateStr]||[];
    const isToday = dateStr===todayD;
    cells.push(`<div class="bonus-cal-cell${isToday?' today':''}${dayEntries.length>0?' has-bonus':''}"${dayEntries.length>0?` data-action="show-bonus-day" data-prefix="${idPrefix}" data-date="${dateStr}"`:''}>
      <div class="bonus-cal-daynum">${month}/${d}</div>
      ${dayEntries.length>0?`<div class="bonus-cal-dot"></div>`:''}
    </div>`);
  }
  while(cells.length % 7 !== 0) cells.push('<div class="bonus-cal-cell empty"></div>');
  const weekdayLabels = ['日','一','二','三','四','五','六'];
  return `
    <div class="bonus-cal">
      <div class="bonus-cal-title-row">
        <button type="button" class="icon-btn" data-action="bonus-cal-shift" data-prefix="${idPrefix}" data-dir="-1">←</button>
        <div class="bonus-cal-title">${year}年${month}月</div>
        <button type="button" class="icon-btn" data-action="bonus-cal-shift" data-prefix="${idPrefix}" data-dir="1">→</button>
      </div>
      <div class="bonus-cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="bonus-cal-grid">${cells.join('')}</div>
    </div>
  `;
}

/* ---- 病假看診單狀態：notneeded=不是病假不用管、uploaded=已上傳、pending=還沒到23:59期限、overdue=過了期限還沒上傳(只是畫面警示，不影響已請的假) ---- */
function attendanceCertStatus(a){
  if(a.leaveType!=='病假') return 'notneeded';
  if(a.certificateUrl) return 'uploaded';
  const deadline = new Date(a.date+'T23:59:59');
  return Date.now() > deadline.getTime() ? 'overdue' : 'pending';
}
function attendanceLeaveTypeDisplay(a){
  if(LEAVE_TYPES_HOURLY.includes(a.leaveType) && a.hours!=null){
    return `${escHtml(a.leaveType)}（${a.startTime||'?'}~${a.endTime||'?'}，共${a.hours}小時）`;
  }
  return escHtml(a.leaveType);
}
function attendanceCertCellHtml(a){
  const status = attendanceCertStatus(a);
  if(status==='notneeded') return '—';

function openAttendanceModal(){
  const today = todayStr();
  openModal('新增請假紀錄', `
    <label class="field"><span>開始日期</span><input type="date" name="startDate" value="${today}" required/></label>
    <label class="field"><span>結束日期</span><input type="date" name="endDate" value="${today}" required/></label>
    <p style="color:var(--muted);font-size:12px;margin:-8px 0 12px;">單天請假：開始日期跟結束日期填同一天即可；請多天連續假，系統會自動幫你展開成每一天各一筆紀錄。中途離開／外出(時數)僅限單天。</p>
    <label class="field"><span>假別</span><select name="leaveType" onchange="
      document.getElementById('attendance-time-fields').style.display = ${JSON.stringify(LEAVE_TYPES_HOURLY)}.includes(this.value) ? 'block' : 'none';
      document.getElementById('attendance-cert-field').style.display = this.value==='病假' ? 'block' : 'none';
    ">${LEAVE_TYPE_OPTIONS.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></label>
    <div id="attendance-time-fields" style="display:none;">
      <label class="field"><span>開始時間</span><input type="time" name="startTime"/></label>
      <label class="field"><span>結束時間</span><input type="time" name="endTime"/></label>
    </div>
    <div id="attendance-cert-field" style="display:none;">
      <label class="field"><span>看診單附件（選填，可以之後再補傳）</span><input type="file" name="certificateFile" accept="image/*,.pdf"/></label>
      <p style="color:var(--muted);font-size:11.5px;margin:-6px 0 10px;">請在請假當天 23:59 前上傳，逾時系統只會在畫面上顯示警示，不影響已經請的假</p>
    </div>
    <label class="field"><span>備註</span><textarea name="note" placeholder="原因（選填）"></textarea></label>
  `, 'attendance-form', async (data)=>{
    const start = new Date(data.startDate+'T00:00:00');
    const end = new Date(data.endDate+'T00:00:00');
    if(isNaN(start) || isNaN(end)){ alert('日期格式有誤，請重新選擇'); return; }
    if(end < start){ alert('結束日期不能早於開始日期'); return; }
    const dayMs = 24*60*60*1000;
    const totalDays = Math.round((end-start)/dayMs) + 1;
    if(totalDays > 60){ alert('一次最多請 60 天，天數太多的話請分開新增'); return; }
    if(LEAVE_TYPES_HOURLY.includes(data.leaveType) && totalDays > 1){ alert('中途離開／外出(時數)僅限單天，請把開始日期跟結束日期填同一天'); return; }
    const myUidForCheck = effectiveUid();
    const conflictDates = [];
    for(let i=0;i<totalDays;i++){
      const dateStr = formatDateLocal(new Date(start.getTime() + i*24*60*60*1000));
      if(APP.data.attendance.some(a=>a.staffUid===myUidForCheck && a.date===dateStr)) conflictDates.push(dateStr);
    }
    if(conflictDates.length>0){
      const proceed = confirm(`這些日期已經有請假紀錄了：${conflictDates.join('、')}\n確定要再新增一筆嗎？（不會刪掉原本的紀錄，兩筆都會保留）`);
      if(!proceed) return;
    }
    let hours = null;
    if(LEAVE_TYPES_HOURLY.includes(data.leaveType)){
      if(!data.startTime || !data.endTime){ alert('請填開始時間跟結束時間'); return; }
      const [sh,sm] = data.startTime.split(':').map(Number);
      const [eh,em] = data.endTime.split(':').map(Number);
      hours = Math.round(((eh*60+em)-(sh*60+sm))/60*10)/10;
      if(hours<=0){ alert('結束時間必須晚於開始時間'); return; }
    }
    let certificateUrl = '';
    if(data.leaveType==='病假' && data.certificateFile && data.certificateFile.size>0){
      try{
        const up = await uploadXjAttachment(`attendanceCerts/${effectiveUid()}`, {blob:data.certificateFile, name:data.certificateFile.name, type:data.certificateFile.type});
        certificateUrl = up.url;
      }catch(err){ alert('看診單上傳失敗，其他資料仍會照常儲存：' + (err&&err.message?err.message:err)); }
    }
    const staffNameForNotify = effectiveStaffName();
    for(let i=0;i<totalDays;i++){
      const d = new Date(start.getTime() + i*dayMs);
      const dateStr = formatDateLocal(d);
      saveAttendance(stamp({
        id:uid(), staffUid:effectiveUid(), staffName:staffNameForNotify, date:dateStr, leaveType:data.leaveType, note:data.note,
        startTime:data.startTime||'', endTime:data.endTime||'', hours,
        certificateUrl, certificateUploadedAt: certificateUrl?new Date().toISOString():''
      }));
    }
    let dateDesc = totalDays===1 ? data.startDate : `${data.startDate} ～ ${data.endDate}`;
    if(hours!=null) dateDesc += `（${data.startTime}～${data.endTime}，預計回來時間 ${data.endTime}）`;
    notifyCompanyLeave(staffNameForNotify, data.leaveType, dateDesc);
  });
}

// 圖片排成方格（超過 4 張顯示 +N），檔案顯示類型、檔名、大小、下載
function crAttHTML(atts, msgId){
  const ims = atts.filter(crIsImg), fs = atts.filter(a=>!crIsImg(a)), n = Math.min(4, ims.length);
  const g = ims.length ? `<div class="cr-ims n${n}">${ims.slice(0, 4).map((a, j)=>{ const up = a.prog!=null && a.prog<100;
    return `<button type="button" class="cr-im${up?' up':''}" ${a.url ? `data-cr-view="${escAttr(msgId)}:${atts.indexOf(a)}"` : ''} aria-label="放大看 ${escAttr(a.name||'圖片')}"><img src="${escAttr(a.url || a.previewUrl || '')}" alt="${escAttr(a.name||'')}" loading="lazy">${j===3 && ims.length>4 ? `<span class="cr-more4">+${ims.length-4}</span>` : ''}${up ? `<span class="cr-prog"><i style="width:${a.prog}%"></i></span>` : ''}</button>`; }).join('')}</div>` : '';
  const f = fs.map(a=>{ const [c, t] = crExt(a.name), up = a.prog!=null && a.prog<100;
    return `<div class="cr-fc"><span class="cr-ext ${c}">${t}</span><div><b title="${escAttr(a.name||'')}">${escHtml(a.name||'檔案')}</b><small>${up ? `上傳中 ${a.prog}%` : crKB(a.size)}</small></div>${a.url ? `<button type="button" class="cr-dl" data-cr-dl="${escAttr(a.url)}" data-cr-name="${escAttr(a.name||'檔案')}">${CR_DL}下載</button>` : ''}</div>`; }).join('');
  return g + f;
}
function crMsgsHTML(peer){
  const me = APP.user.uid, t = crThread(peer);
  const pend = CR.sending.filter(s=>s.peer===peer);
  if(!t.length && !pend.length) return '<div class="empty">還沒有任何對話，說聲嗨吧</div>';
  const peerU = APP.users.find(u=>u.id===peer), peerName = peerU ? crName(peerU) : '';
  let out = '', lastDay = '', i = 0;
  let lastMine = -1; t.forEach((m, k)=>{ if(m.senderUid===me) lastMine = k; });
  while(i < t.length){
    const who = t[i].senderUid, day = crDay(t[i]._at);
    if(day!==lastDay){ out += `<div class="cr-day">${day}</div>`; lastDay = day; }
    const grp = [];
    while(i < t.length && t[i].senderUid===who && crDay(t[i]._at)===day && (!grp.length || new Date(t[i]._at) - new Date(grp[grp.length-1].m._at) < 10*6e4)){ grp.push({ m:t[i], k:i }); i++; }
    const mine = who===me, last = grp[grp.length-1];
    out += `<div class="cr-g${mine?' me':''}">${mine ? '' : avatarHtml(who, peerName, 30)}<div class="cr-col">
      ${grp.map(({m})=>{ const burn = mine ? `<button type="button" class="cr-x" data-action="burn-message" data-id="${escAttr(m.id)}">🔥 燒掉</button>` : '';
        return (m.message ? `<div class="cr-b${CR.held===m.id?' held':''}" data-cr-id="${escAttr(m.id)}">${crLink(m.message)}${burn}</div>` : '')
          + ((m.attachments||[]).length ? `<div class="cr-b att${CR.held===m.id?' held':''}" data-cr-id="${escAttr(m.id)}">${crAttHTML(m.attachments, m.id)}${m.message ? '' : burn}</div>` : ''); }).join('')}
      <div class="cr-meta">${crHM(last.m._at)}${mine && grp.some(x=>x.k===lastMine) ? ` · ${t[lastMine].read ? '已讀' : '已送出'}` : ''}</div></div></div>`;
  }
  // 還在上傳的（送出後馬上顯示、跑進度；失敗可以重試）
  pend.forEach(s=>{
    out += `<div class="cr-g me"><div class="cr-col">${s.message ? `<div class="cr-b">${crLink(s.message)}</div>` : ''}<div class="cr-b att">${crAttHTML(s.atts, '')}</div>
      <div class="cr-meta">${s.failed ? `<span class="cr-fail">傳送失敗</span> <button type="button" class="cr-retry" data-cr-retry="${s.id}">重試</button> <button type="button" class="cr-retry" data-cr-drop="${s.id}">取消</button>` : '傳送中…'}</div></div></div>`;
  });
  return out;
}

          <div class="cr-menu" id="cr-menu" hidden><button type="button" data-cr-gal>🖼 圖片和檔案</button><button type="button" class="red" data-action="burn-whole-thread" data-peer="${escAttr(peer)}">🔥 清空整個對話</button></div></div></div>
      <div id="chat-thread-messages" class="cr-msgs"></div>
      <div class="cr-tray" id="chat-tray"></div><div class="cr-trayopt" id="chat-trayopt"></div>
      <input type="file" id="chat-file-input" multiple hidden/><input type="file" id="chat-photo-input" accept="image/*" multiple hidden/><input type="file" id="chat-camera-input" accept="image/*" capture="environment" hidden/>
      <form id="chat-thread-form" class="cr-inbar" novalidate>
        <button type="button" class="cr-ib" data-cr-clip aria-label="附加檔案或照片" title="附加檔案（也可以直接貼上截圖、或把檔案拖進來）">${CR_CLIP}</button>
        <textarea id="chat-thread-input" class="cr-ta" rows="1" placeholder="輸入訊息…" aria-label="輸入訊息"></textarea>

// render() 呼叫：同一個對話只更新聯絡人和訊息，不重做輸入框
function chatRender(main){
  const peer = APP.chatRoomActivePeer || '', key = peer + '|' + (crIsM() ? 'm' : 'd');
  if(main.dataset.crKey!==key || !document.getElementById('chat-split')){
    // 換了對象：還沒送出的檔案不帶過去（免得傳錯人）；打到一半的字每個人分開記
    if(CR.peer!==peer){ (APP._pendingChatFiles||[]).forEach(f=>{ if(f.previewUrl) URL.revokeObjectURL(f.previewUrl); }); APP._pendingChatFiles = []; APP._chatOrig = false; CR.peer = peer; }
    main.innerHTML = chatRoomView(); main.dataset.crKey = key;
    CR.count = -1; CR.newBelow = 0; CR.lastHtml = ''; CR.held = null;
    const ta = document.getElementById('chat-thread-input'); if(ta){ ta.value = APP.chatDraft[peer] || ''; crGrow(ta); }
    crRenderTray(); crFit();
  } else {
    const box = document.getElementById('chat-contacts'); if(box) box.innerHTML = crContactsHTML();
    const hn = document.getElementById('chat-hname'); if(hn) hn.innerHTML = crHeadNameHTML(peer);
  }
  crRenderMsgs();
}
function crRenderMsgs(forceBottom){
  const peer = APP.chatRoomActivePeer, box = document.getElementById('chat-thread-messages'); if(!peer || !box) return;
  const html = crMsgsHTML(peer);
  const t = crThread(peer), first = CR.count < 0;
  if(html!==CR.lastHtml){
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = html; CR.lastHtml = html;
    const added = first ? 0 : t.slice(Math.max(0, CR.count)).filter(m=>m.senderUid!==APP.user.uid).length;
    if(first || forceBottom || atEnd){ CR.newBelow = 0; box.scrollTop = box.scrollHeight; }
    else if(added > 0) CR.newBelow += added;
  }
  CR.count = t.length;
  crChip();
}
function crChip(){
  const main = document.getElementById('chat-main'), box = document.getElementById('chat-thread-messages'); if(!main || !box) return;
  let c = document.getElementById('cr-newchip');
  if(!CR.newBelow){ if(c) c.remove(); return; }
  if(!c){ c = document.createElement('button'); c.type = 'button'; c.id = 'cr-newchip'; c.className = 'cr-newchip'; c.dataset.crDown = '1'; main.appendChild(c); }
  c.textContent = `↓ ${CR.newBelow} 則新訊息`;
  c.style.bottom = Math.round(main.getBoundingClientRect().bottom - box.getBoundingClientRect().bottom + 12) + 'px';
}
const crGrow = ta => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight + 2) + 'px'; };
function crSendState(){ const b = document.getElementById('chat-send'), ta = document.getElementById('chat-thread-input'); if(b) b.disabled = !(ta && ta.value.trim()) && !(APP._pendingChatFiles||[]).length; }

// ---- 送出前的檔案列（獨立一塊，收到訊息不會被清掉）----
APP._chatOrig = false;
function crRenderTray(){
  const tray = document.getElementById('chat-tray'), opt = document.getElementById('chat-trayopt'); if(!tray) return;
  const files = APP._pendingChatFiles || [];
  tray.innerHTML = files.map((f, i)=>`<div class="cr-ti"><div class="cr-th">${f.previewUrl ? `<img src="${f.previewUrl}" alt="">` : `<span class="cr-ext ${crExt(f.name)[0]}">${crExt(f.name)[1]}</span>`}</div>
    <small>${crCanShrink(f.file) && !APP._chatOrig ? `${crKB(f.file.size)}<br>會自動壓縮` : crKB(f.file.size)}</small><button type="button" class="cr-rm" data-action="remove-pending-chat-file" data-idx="${i}" aria-label="拿掉 ${escAttr(f.name)}">✕</button></div>`).join('');
  const imgs = files.filter(f=>crCanShrink(f.file)).length;
  if(opt) opt.innerHTML = files.length ? `<span>${files.length} 個檔案準備送出</span>${imgs ? `<label><input type="checkbox" id="chat-orig" ${APP._chatOrig?'checked':''}/> 傳原圖（不壓縮）</label>` : ''}` : '';
  crSendState(); crChip();
}
const renderChatFilePreview = crRenderTray; // 舊名字（移除檔案時呼叫）
function crAddFiles(list){
  if(!APP._pendingChatFiles) APP._pendingChatFiles = [];
  let n = 0;
  Array.from(list||[]).forEach(f=>{
    if(f.size > 25*1024*1024){ plToast(`「${f.name}」超過 25MB，請選小一點的檔案`); return; }
    const name = f.name && f.name!=='image.png' ? f.name : `截圖_${new Date().toTimeString().slice(0,8).replace(/:/g,'')}.png`;
    APP._pendingChatFiles.push({ file:f, name, type:f.type||'application/octet-stream', previewUrl: (f.type||'').indexOf('image/')===0 ? URL.createObjectURL(f) : null }); n++;
  });
  if(n){ crRenderTray(); const ta = document.getElementById('chat-thread-input'); if(ta && !crIsM()) ta.focus(); }
}
// 照片超過 800KB 才壓縮：長邊最多 2048px、JPEG 品質 0.82（文件上的字看得清楚）
const crCanShrink = f => !!f && /^image\/(jpeg|png|webp)$/.test(f.type||'') && f.size > 800*1024;
async function crShrink(f, orig){
  if(orig || !crCanShrink(f) || typeof createImageBitmap!=='function') return f;
  try{
    const bmp = await createImageBitmap(f), k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.82));
    if(!blob || blob.size >= f.size) return f;
    return new File([blob], (f.name||'photo').replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' });
  }catch(_){ return f; }
}
// 送出：文字直接送；有檔案就先顯示在對話裡跑進度，全部傳完才送出訊息
function crSend(){
  const ta = document.getElementById('chat-thread-input'), peer = APP.chatRoomActivePeer; if(!ta || !peer) return;
  const msg = ta.value.trim(), files = (APP._pendingChatFiles||[]).slice();
  if(!msg && !files.length) return;
  ta.value = ''; APP.chatDraft[peer] = ''; crGrow(ta);
  APP._pendingChatFiles = []; const orig = APP._chatOrig; APP._chatOrig = false; crRenderTray();
  if(!crIsM()) ta.focus();
  const peerU = APP.users.find(u=>u.id===peer), peerName = peerU ? crName(peerU) : '';
  if(!files.length){ sendDirectMessage(peer, peerName, msg).catch(err=>{ alert('訊息傳送失敗，請檢查網路後再試一次：' + (err && err.message ? err.message : err)); ta.value = msg; crSendState(); }); return; }
  const s = { id: uid(), peer, peerName, message: msg, orig, files, failed:false,
    atts: files.map(f=>({ name:f.name, type:f.type, size:f.file.size, previewUrl:f.previewUrl, prog:0 })) };
  CR.sending.push(s); crRenderMsgs(true); crUpload(s);
}
function crUpload(s){
  s.failed = false; s.atts.forEach(a=>{ a.prog = 0; }); crRenderMsgs(true);
  Promise.all(s.files.map(async (f, i)=>{
    const file = await crShrink(f.file, s.orig); s.atts[i].size = file.size;
    return uploadChatFile(s.peer, file, p=>{ s.atts[i].prog = p; crRenderMsgs(); }, file===f.file ? f.name : (f.name||'').replace(/\.[^.]+$/, '') + '.jpg');
  })).then(attachments=>sendDirectMessage(s.peer, s.peerName, s.message, attachments))
    .then(()=>{ s.files.forEach(f=>{ if(f.previewUrl) URL.revokeObjectURL(f.previewUrl); }); CR.sending = CR.sending.filter(x=>x!==s); crRenderMsgs(true); })
    .catch(err=>{ console.error('聊天室檔案上傳失敗', err); s.failed = true; crRenderMsgs(); });
}

// ---- 看大圖（整個對話的圖片可以左右切換）、圖片和檔案總覽、手機附件選單：都放在 body 最外層 ----
function crImgs(){ const out = []; crThread(APP.chatRoomActivePeer).forEach(m=>(m.attachments||[]).forEach((a, j)=>{ if(crIsImg(a) && a.url) out.push({ ...a, mid:m.id, j, who:m.senderUid, at:m._at }); })); return out; }
function crWho(uidv){ if(uidv===APP.user.uid) return '你'; const u = APP.users.find(x=>x.id===uidv); return u ? crName(u) : ''; }
function crOverlay(id, html){ let o = document.getElementById(id); if(!html){ if(o) o.remove(); return null; } if(!o){ o = document.createElement('div'); o.id = id; document.body.appendChild(o); } o.innerHTML = html; return o; }
function crLbRender(){
  const L = CR.lb, list = crImgs(); if(!L || !list.length){ CR.lb = null; crOverlay('cr-lb', ''); return; }
  L.i = (L.i + list.length) % list.length; const a = list[L.i];
  const o = crOverlay('cr-lb', `<div class="cr-lb" role="dialog" aria-modal="true" aria-label="看圖片"><div class="cr-lbh"><div><b>${escHtml(a.name||'圖片')}</b><small>${escHtml(crWho(a.who))}・${crDay(a.at)} ${crHM(a.at)}${a.size ? '・' + crKB(a.size) : ''}</small></div>
    <button type="button" class="cr-lbb" data-cr-dl="${escAttr(a.url)}" data-cr-name="${escAttr(a.name||'圖片.jpg')}">${CR_DL}下載</button><button type="button" class="cr-lbb" data-cr-lbclose aria-label="關閉">✕</button></div>
    <div class="cr-lbm${L.zoom?' zoom':''}"><img src="${escAttr(a.url)}" alt="${escAttr(a.name||'')}" data-cr-zoom>${list.length>1 ? '<button type="button" class="cr-nav p" data-cr-lbgo="-1" aria-label="上一張">‹</button><button type="button" class="cr-nav n" data-cr-lbgo="1" aria-label="下一張">›</button>' : ''}</div>
    <div class="cr-lbf">${L.i+1} / ${list.length}${crIsM() ? '' : '　← → 切換・點圖片放大・Esc 關閉'}</div></div>`);
  document.body.classList.add('pa-lock');
  return o;
}
function crLbClose(){ CR.lb = null; crOverlay('cr-lb', ''); if(!document.getElementById('cr-gal')) document.body.classList.remove('pa-lock'); }
function crGalRender(){
  const list = crImgs(), files = []; crThread(APP.chatRoomActivePeer).forEach(m=>(m.attachments||[]).forEach(a=>{ if(!crIsImg(a) && a.url) files.push({ ...a, who:m.senderUid, at:m._at }); }));
  crOverlay('cr-gal', `<div class="cr-galbg" data-cr-galbg><div class="cr-gal" role="dialog" aria-modal="true" aria-label="圖片和檔案"><div class="cr-galh"><b>圖片和檔案</b><button type="button" class="cr-morebtn" data-cr-galclose aria-label="關閉">✕</button></div><div class="cr-galb">
    <div><h4>圖片 ${list.length} 張</h4>${list.length ? `<div class="cr-gg">${list.map((a, n)=>`<button type="button" class="cr-im" data-cr-lbopen="${n}"><img src="${escAttr(a.url)}" alt="${escAttr(a.name||'')}" loading="lazy"></button>`).join('')}</div>` : '<small class="cr-none">還沒有</small>'}</div>
    <div><h4>檔案 ${files.length} 個</h4>${files.length ? files.reverse().map(a=>{ const [c, t] = crExt(a.name); return `<div class="cr-fc wide"><span class="cr-ext ${c}">${t}</span><div><b>${escHtml(a.name||'檔案')}</b><small>${crKB(a.size)}${a.size ? '・' : ''}${escHtml(crWho(a.who))}・${crDay(a.at)}</small></div><button type="button" class="cr-dl" data-cr-dl="${escAttr(a.url)}" data-cr-name="${escAttr(a.name||'檔案')}">${CR_DL}下載</button></div>`; }).join('') : '<small class="cr-none">還沒有</small>'}</div>
  </div></div></div>`);
  document.body.classList.add('pa-lock');
}
function crGalClose(){ crOverlay('cr-gal', ''); if(!CR.lb) document.body.classList.remove('pa-lock'); }
function crSheet(open){
  crOverlay('cr-sheet', open ? `<div class="cr-sheetbg" data-cr-sheetbg><div class="cr-sheet"><button type="button" data-cr-pick="camera"><span>📷</span>拍照</button><button type="button" data-cr-pick="photo"><span>🖼</span>從相簿選照片</button><button type="button" data-cr-pick="file"><span>📄</span>選檔案（PDF、Excel…）</button><button type="button" class="cancel" data-cr-sheetbg>取消</button></div></div>` : '');
}
// 下載：盡量用原本的檔名存；瀏覽器擋住時改成另開分頁
async function crDownload(url, name){
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    const b = await r.blob(), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name || '檔案';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(_){ window.open(url, '_blank', 'noopener'); }
}
// 手機：對話占滿螢幕，鍵盤打開時跟著可見區域縮小（輸入框不會被蓋住）
function crFit(){
  const sp = document.getElementById('chat-split'); if(!sp) return;
  if(!crIsM()){ sp.style.removeProperty('--cr-top'); sp.style.removeProperty('--cr-h'); return; }
  const vv = window.visualViewport, bar = document.getElementById('mobile-topbar');
  const top = bar ? Math.max(0, Math.round(bar.getBoundingClientRect().bottom)) : 0;
  const h = vv ? vv.height + vv.offsetTop : window.innerHeight;
  sp.style.setProperty('--cr-top', top + 'px'); sp.style.setProperty('--cr-h', Math.max(240, Math.round(h - top)) + 'px');
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize', crFit); window.visualViewport.addEventListener('scroll', crFit); }
window.addEventListener('resize', ()=>{ if(APP.view==='chatRoom') render(); });

document.addEventListener('click', (e)=>{
  const t = e.target; if(!t.closest) return;
  if(t.closest('[data-cr-clip]')){ if(crIsM()) crSheet(true); else { const i = document.getElementById('chat-file-input'); if(i) i.click(); } return; }
  const pk = t.closest('[data-cr-pick]'); if(pk){ crSheet(false); const i = document.getElementById('chat-' + pk.dataset.crPick + '-input'); if(i) i.click(); return; }
  if(t.closest('[data-cr-sheetbg]') && (t.matches('[data-cr-sheetbg]'))){ crSheet(false); return; }
  const mb = t.closest('[data-cr-more]'); const menu = document.getElementById('cr-menu');
  if(mb){ if(menu){ menu.hidden = !menu.hidden; mb.setAttribute('aria-expanded', String(!menu.hidden)); } return; }
  if(menu && !menu.hidden && !t.closest('#cr-menu')){ menu.hidden = true; }
  if(t.closest('[data-cr-gal]')){ if(menu) menu.hidden = true; crGalRender(); return; }
  if(t.closest('[data-cr-galclose]') || t.matches('[data-cr-galbg]')){ crGalClose(); return; }
  const vw = t.closest('[data-cr-view]'); if(vw){ const [mid, j] = vw.dataset.crView.split(':'); const i = crImgs().findIndex(a=>a.mid===mid && String(a.j)===j); CR.lb = { i: Math.max(0, i), zoom:false }; crLbRender(); return; }
  const lo = t.closest('[data-cr-lbopen]'); if(lo){ CR.lb = { i: +lo.dataset.crLbopen, zoom:false }; crLbRender(); return; }
  const go = t.closest('[data-cr-lbgo]'); if(go && CR.lb){ CR.lb.i += Number(go.dataset.crLbgo); CR.lb.zoom = false; crLbRender(); return; }

/* ---------------- Staff overview (核心視角看業務房間) ---------------- */
/* ================= 客戶關懷追蹤（再行銷拉回舊客） =================
   時間規則照原本：第 1 次撥款後 25 天（醫美 12 天），第 2、3 次是前一次完成後 25 天。
   每次記錄選結果：有新需求／暫時不需要／幫忙介紹＝完成這次；聯絡不到＝不算完成，3 天後再提醒（存在 reminderN.missDate）。
   通路夥伴的客人（f.staff 對不到系統帳號）由核心／行政派給公司業務（f.assignee），負責人＝fuOwner。
   畫面上不用「逾期／到期」字眼（業務會以為是客人沒繳費）。 */
const FU_RES = { need:['有新需求','想再貸、增貸、轉貸'], no:['暫時不需要','沒有資金需求'], miss:['聯絡不到','不算完成，3 天後再提醒'], ref:['幫忙介紹朋友','介紹了新客人'] };
const FU_MISS_RETRY_DAYS = 3;
function fuStaffNames(){ return new Set(APP.users.filter(u=>u.staffName).map(u=>u.staffName)); }
function fuIsPartner(f, names){ names = names || fuStaffNames(); return names.size>0 && (!f.staff || !names.has(f.staff)); }
function fuOwner(f, names){ return fuIsPartner(f, names) ? (f.assignee||'') : (f.staff||''); }
/* 目前要做第幾次、還有幾天（負數＝已經超過幾天） */
function fuStage(f){
  const st = followupStages(f);
  const i = st.findIndex(s=>!s.done);
  if(i<0) return { all:true, n:3, done:3 };
  const r = f[st[i].key] || {};
  let left = null;
  if(i===0){ const d = daysSinceDate(f.disbursedDate); if(d!==null) left = ((f.plan||'').includes('醫美') ? FOLLOWUP_MEDICAL_FIRST_DAYS : FOLLOWUP_DEFAULT_FIRST_DAYS) - d; }
  else { const d = daysSinceDate((f[st[i-1].key]||{}).doneDate); if(d!==null) left = FOLLOWUP_STAGE2_3_GAP - d; }
  const md = r.missDate ? daysSinceDate(r.missDate) : null;
  if(md!==null && (left===null || FU_MISS_RETRY_DAYS - md > left)) left = FU_MISS_RETRY_DAYS - md;
  return { all:false, n:i+1, done:i, key:st[i].key, left, retry: !!r.missDate };
}
function fuBucket(f){ const s = fuStage(f); if(s.all) return 'done'; if(s.left===null) return 'later'; return s.left<0 ? 'od' : s.left===0 ? 'td' : s.left<=7 ? 'soon' : 'later'; }
function fuLast(f){
  const L = [];
  ['reminder1','reminder2','reminder3'].forEach(k=>{ const r = f[k]||{};
    if(r.done) L.push({ d:r.doneDate||'', res:r.result||'', n:r.note||'' });
    else if(r.missDate) L.push({ d:r.missDate, res:'miss', n:r.missNote||'' }); });
  return L.sort((a,b)=>(a.d||'').localeCompare(b.d||'')).pop() || null;
}
const fuMD = s => s ? `${+s.slice(5,7)}/${+s.slice(8,10)}` : '';
function fuAddDays(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fuDueText(s, b){
  if(s.all) return '三次都完成';
  if(s.left===null) return `第 ${s.n} 次關懷`;
  if(b==='od') return `第 ${s.n} 次關懷・超過 ${-s.left} 天`;
  if(b==='td') return `第 ${s.n} 次關懷・今天`;
  return `第 ${s.n} 次關懷・${fuMD(fuAddDays(s.left))}（${s.left} 天後）`;
}
/* 鈴鐺用：我負責、今天要聯絡＋超過時間的人數（處理完才會消失） */
function fuMyTodo(){
  const me = myStaffName(); if(!me) return { n:0, od:0 };
  const names = fuStaffNames(); let n = 0, od = 0;
  (APP.data.customerFollowups||[]).forEach(f=>{ if(fuOwner(f, names)!==me) return; const b = fuBucket(f); if(b==='od'){ n++; od++; } else if(b==='td') n++; });
  return { n, od };
}
function fuNotifRowsHTML(){

  if(isCore() || isStaffAdmin()){

  }
  return h;
}

const SO_TIERS = () => { const cs = APP.data.caseSettings || {};

    .map(([k, v])=>({ key:k, th:Number(v)||0 })).filter(t=>t.th > 0).sort((a, b)=>a.th - b.th); };
function soTierInfo(v){
  const ts = SO_TIERS(); let k = -1;
  ts.forEach((t, i)=>{ if(v >= t.th) k = i; });

  const pct = nx ? Math.max(0, Math.min(100, Math.floor((v - base) / (nx.th - base) * 100))) : (ts.length ? 100 : 0);

// 畫好之後：第一次進入頁面才跳數字；離開頁面再回來會再跳一次
function soAfterRender(){
  if(APP.view!=='staffOverview'){ APP._soShown = false; return; }
  if(APP._soShown) return;
  APP._soShown = true;
  const els = [...document.querySelectorAll('#so-root [data-so-n]')]; if(!els.length) return;
  const t0 = performance.now(), D = 1200;
  els.forEach(el=>{ el.textContent = el.hasAttribute('data-so-m') ? money(0) : '0'; });
  const step = now => {
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el=>{ if(!el.isConnected) return; const v = Math.round(Number(el.dataset.soN) * e); el.textContent = el.hasAttribute('data-so-m') ? money(v) : String(v); });
    if(k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- 判斷「電話」欄位是否真的填了有效聯絡方式（電話號碼或LINE ID），而不是隨便填字
   （例如有人會打「未留聯絡方式」這種說明文字進去，這不該被當成「有留聯絡方式」）
   做法：①抓出欄位裡的數字，數量達到門檻(6碼，市話最短約7碼、手機10碼，6碼當保守門檻避免漏判)就算電話號碼
        ②否則找看看有沒有連續4碼以上的英數字/底線/點/減號組合(不含中文)，符合LINE ID常見格式的話也算有效聯絡方式 ---- */
function hasValidPhone(phone){
  if(!phone) return false;
  const digits = String(phone).replace(/\D/g, '');
  if(digits.length >= 6) return true;
  return /[A-Za-z0-9._-]{4,}/.test(String(phone));
}

function plInQuick(c){

  if(S.quick.startsWith('m:') || S.quick.startsWith('y:')) return d.startsWith(S.quick.slice(2));

  if(s==='sent') return !!c.dealProduct;

function plFiltered(){
  const S = plS(), q = S.search.trim().toLowerCase();
  return plMine().filter(c=> (q || plInQuick(c))
    && (q || S.group==='all' || (S.group==='ended')===plIsEnded(c.contactStatus))
    && (!S.status || c.contactStatus===S.status)
    && (!S.product || c.dealProduct===S.product)
    && (q || plInStat(c))
    && (!q || ['customer','phone','caseRemark','latestNote','dealProduct','contactStatus','caseStatus','source','transferTo','lineId','wizardHatNote']
      .some(k=>String(c[k]||'').toLowerCase().includes(q))));

// 排序：先依月份分段（日期舊→新時月份也舊→新），月份內照選的欄位排；空白的一律排最後
function plSorted(arr){
  const { key, dir } = plS().sort, sign = dir==='asc' ? 1 : -1;
  const cmp = (a, b)=>{
    const x = a[key]||'', y = b[key]||'';
    if(key==='date') return x.localeCompare(y);
    if(plOrder[key]){ const ix = plOrder[key].indexOf(x), iy = plOrder[key].indexOf(y); return (ix<0?999:ix) - (iy<0?999:iy); }
    return plZh.compare(x, y);
  };
  const mSign = key==='date' ? sign : -1;
  return arr.slice().sort((a, b)=>{
    const mc = plMKey(a.date).localeCompare(plMKey(b.date)); if(mc) return mSign*mc;
    const x = a[key]||'', y = b[key]||''; if(!x !== !y) return x ? -1 : 1;
    return sign*cmp(a, b) || (b.date||'').localeCompare(a.date||'');
  });
}
const plDirLabel = (k, d)=> k==='date' ? (d==='desc'?'新→舊':'舊→新') : plOrder[k] ? (d==='asc'?'照選單順序':'選單順序反過來') : (d==='asc'?'筆畫少→多':'筆畫多→少');
function plQuickLabel(){
  const q = plS().quick;
  if(q.startsWith('m:')) return plMLabel(q.slice(2));
  if(q.startsWith('y:')) return q.slice(2)+' 全年';
  return { today:'今天', week:'本週', month:plMLabel(plThisM()), all:'全部日期' }[q];
}
function plSummary(){
  if(lxSearching(plS())) return '搜尋中・全部日期';
  const S = plS();
  const g = S.status || { active:'進行中', ended:'已結束', all: S.stat ? '' : '全部狀態' }[S.group];
  return `${plQuickLabel()}${g?'・'+g:''}${S.product?'・'+S.product:''}${S.stat?'・'+PL_STAT_NAME[S.stat]:''}`;
}

// 每個月份前面一條分隔（顯示筆數）；列表跨年時月份上面再加年份分隔
function plWithMonths(all, rows, row, head, yhead){
  const multiYear = new Set(all.map(c=>(c.date||'').slice(0,4))).size > 1;
  const mCount = k => all.filter(c=>plMKey(c.date)===k).length;
  return rows.map((c, i)=>{
    const y = (c.date||'').slice(0,4), k = plMKey(c.date), prev = rows[i-1];
    return (multiYear && (!prev || (prev.date||'').slice(0,4)!==y) ? yhead(y ? y+' 年' : '無日期', all.filter(x=>(x.date||'').slice(0,4)===y).length) : '')
      + (!prev || plMKey(prev.date)!==k ? head(multiYear && k ? Number(k.slice(5))+' 月' : plMLabel(k), mCount(k)) : '') + row(c, i);
  }).join('');
}

// 視窗開著時，畫面重畫前先把已經打的字收進來，不會因為重畫而消失

function plGrow(ta){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
// 自己的操作要立刻重畫（不受「正在打字先不重畫」限制）
function plRender(){ const S = plS(); S._force = true; try{ render(); } finally{ S._force = false; } }
// 別人更新資料時：如果正在列表或視窗裡打字，先不要重畫，等離開欄位再補畫
const plTyping = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('.pl-root') && /^(INPUT|TEXTAREA)$/.test(a.tagName)); };
function plShouldDefer(){
  const S = plS(); if(S._force) return false;
  if(!plTyping()) return false;
  S.pending = true;
  // 保險：每 0.4 秒看一次，離開欄位就補畫（不只靠 focusout 事件）
  if(!S._deferTimer) S._deferTimer = setInterval(()=>{
    if(plTyping()) return;
    clearInterval(S._deferTimer); S._deferTimer = null;
    if(S.pending && APP.view==='personalLog'){ S.pending = false; render(); }
  }, 400);
  return true;
}
let plToastTimer = null;
function plToast(msg){
  document.querySelectorAll('.pl-toast').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className = 'pl-toast'; el.textContent = msg; document.body.appendChild(el);
  clearTimeout(plToastTimer); plToastTimer = setTimeout(()=>el.remove(), 2400);
}

const PL_FORM_KEYS = ['date','customer','phone','source','lineId','dealProduct','contactStatus','transferTo','caseStatus','latestNote','caseRemark','wizardHatNote'];
function plSaveModal(next){
  const S = plS(), M = S.modal; if(!M) return;
  plCaptureForm();
  const r = M.rec;
  r.customer = (r.customer||'').trim(); r.phone = (r.phone||'').trim();
  if(!r.customer){ M.err = '請填客戶姓名'; plRender(); const el = document.getElementById('pl-fName'); if(el) el.focus(); return; }
  if(!r.date){ M.err = '請選日期'; plRender(); return; }
  M.err = '';
  if(!(r.source||'').trim()) r.source = '公司'; // 選了「自己打字」但沒寫，就當公司
  if(M.edit){
    const orig = M.orig, patch = {};
    // 只寫有改的欄位；姓名、電話只差前後空白不算改（舊資料有些尾巴帶空白，不要因為按儲存就被改掉）
    PL_FORM_KEYS.forEach(k=>{
      const a = r[k]||'', o = orig[k]||'';
      if(a===o || ((k==='customer' || k==='phone') && a.trim()===o.trim())) return;
      patch[k] = a;
    });
    if(Object.keys(patch).length) plUpdate(r.id, patch);
    S.modal = null; plRender();
    plToast(Object.keys(patch).length ? `已儲存「${r.customer}」` : '沒有變更');
    return;
  }
  const rec = stamp({ id:uid(), staffUid:effectiveUid(), staffName:effectiveStaffName(), ...PL_FORM_KEYS.reduce((o,k)=>(o[k] = r[k]||'', o), {}) });
  if(!rec.source.trim()) rec.source = '公司';
  savePersonalProgress(rec).catch(plFail);
  if(next){ plOpenNew({ date:rec.date, source:rec.source }); plToast(`已新增「${rec.customer}」，接著填下一筆`); }
  else { S.modal = null; plRender(); plToast(`已新增「${rec.customer}」`); if(M.pa) paNext('pl', true); }
}

document.addEventListener('click', (e)=>{

    const pt = pk.dataset.plPt, f = pk.dataset.plF, v = pk.dataset.plPick; S.pop = null;

    const c = plMine().find(x=>x.id===pt); if(!c) return plRender();

    let msg = `${c.customer}：${PL_LABEL[f]}改為「${v||'未填'}」`;
    if(f==='contactStatus' && !S.status && S.group!=='all' && (S.group==='ended')!==plIsEnded(v)) msg += `，已移到「${plIsEnded(v)?'已結束':'進行中'}」`;
    plRender(); plToast(msg); return;
  }

    if(k==='month' && v.startsWith('py:')){ S.pickYear = v.slice(3); return plRender(); }
    S.limit = 20; S.limitNoc = 20; S.pop = null;

    if(k==='prod') S.product = v;

    if(k==='group' || k==='prod') S.stat = '';
    if(k==='sort'){
      const [a, b] = v.split(':');

      if(a==='k'){ S.sort = { key:b, dir: S.sort.key===b ? S.sort.dir : (b==='date'?'desc':'asc') }; S.pop = keep; }

/* ================= 分頁 AI「🤖 AI 幫我填」（2026-10-28）=================
   我的客人紀錄（pl）、進度追蹤（pg）、房屋土地估價（va）、銀行信貸（bk）：

// 送出前先算這次大約送多少字（給使用者看，正式送出的內容在 Worker 再加上固定規則）

// AI 回來的每一筆：只留這頁有的欄位；選單欄位不在選項裡就不填（記下來提醒使用者）
function paClean(px, item, single, src){
  const P = PA[px], k = paKind(px), F = P.fields(k), O = P.opts(k), free = P.free || [];
  const rec = {}, keys = [], dropped = [];
  Object.keys(F).forEach(f=>{
    let v = item[f]; if(v==null) return;
    v = String(v).trim(); if(!v || v==='null') return;
    if(f==='date'){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; }
    else if(f==='approvedAmount'){ v = v.replace(/[,\s萬]/g, ''); if(isNaN(Number(v))) { dropped.push(`${F[f]}「${item[f]}」`); return; } }
    else if(O[f] && !O[f].includes(v) && !free.includes(f)){
      const hit = O[f].find(o=>o.toLowerCase()===v.toLowerCase());
      if(!hit){ dropped.push(`${F[f]}「${v}」`); return; }

  if(px==='pl' && single && paLong(src) && !rec.latestNote){ rec.latestNote = src; keys.push('latestNote'); }

}
function paParse(raw){
  let t = String(raw||'').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('['), b = t.lastIndexOf(']');
  if(a < 0 || b < a) return null;
  try{ const arr = JSON.parse(t.slice(a, b + 1)); return Array.isArray(arr) ? arr.filter(x=>x && typeof x==='object') : null; }catch(_){ return null; }
}

async function paRun(){
  const o = document.getElementById('pa-dlg'), ta = document.getElementById('pa-text'), run = document.getElementById('pa-run');
  if(!o || !ta) return;
  const px = o.dataset.px, text = ta.value.trim(); if(!text) return;
  run.dataset.busy = '1'; run.disabled = true; run.textContent = 'AI 整理中…'; paMeta('AI 整理中，大約 5～15 秒…');
  let list = null, fail = '', live = null;
  const ctrl = window.AbortController ? new AbortController() : null;
  try{
    const resp = await fetch(AI_WORKER_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ ...paPayload(px, text), stream:true }), signal: ctrl ? ctrl.signal : undefined });
    // 新版 Worker 回 text/plain＝邊寫邊傳；舊版或出錯回 JSON（照原本處理）
    if(resp.ok && resp.body && /text\/plain/.test(resp.headers.get('content-type')||'')){
      const still0 = document.getElementById('pa-dlg');
      if(!still0 || still0.hidden || still0.dataset.px!==px){ if(ctrl) ctrl.abort(); return; }
      live = paLiveStart(px, text, ctrl);
      const rd = resp.body.getReader(), dec = new TextDecoder(); let raw = '', last = 0;
      for(;;){
        const { done, value } = await rd.read(); if(done) break;
        raw += dec.decode(value, { stream:true });
        if(!PA_LIVE){ if(ctrl) ctrl.abort(); return; } // 寫的時候視窗被關掉、或按了「改貼上的文字」
        if(Date.now() - last > 120){ last = Date.now(); paLiveShow(raw); }
      }
      raw += dec.decode();
      const errAt = raw.indexOf('\n[[PA_ERROR]]');
      if(errAt >= 0) fail = raw.slice(errAt + 13).trim() || 'AI 暫時沒有回應，請稍後再試一次。';
      else list = paParse(raw);
    } else {
      const data = await resp.json();
      if(data.error) fail = String(data.error);
      else list = paParse(data.raw);
    }
  }catch(e){ if(live && !PA_LIVE) return; fail = '連線失敗，請確認網路後再試一次。'; }
  if(live){
    if(!PA_LIVE || PA[px].S().modal!==PA_LIVE.M){ PA_LIVE = null; return; }
    PA_LIVE = null;
    if(fail || !list || !list.length){ PA[px].S().modal = null; PA[px].render(); paOpenDlg(px, text);
      paMeta(fail ? (fail.length > 120 ? 'AI 暫時沒有回應，請稍後再試一次。' : fail) : 'AI 沒有整理出客人資料，請多寫一點（例如姓名、電話、方案）再試一次。', true); return; }
  } else {
    const still = document.getElementById('pa-dlg');
    if(!still || still.hidden || still.dataset.px!==px) return; // 等的時候已經關掉了
    delete run.dataset.busy; run.textContent = '整理並填入 →'; run.disabled = false;
    if(fail){ paMeta(fail.length > 120 ? 'AI 暫時沒有回應，請稍後再試一次。' : fail, true); return; }
    if(!list || !list.length){ paMeta('AI 沒有整理出客人資料，請多寫一點（例如姓名、電話、方案）再試一次。', true); return; }
  }
  const single = list.length===1;
  const queue = list.slice(0, 20).map(x=>paClean(px, x, single, text));
  const nk = PA[px].nameKey;
  PA_RUN = { px, kind:paKind(px), src:text, queue, idx:0, names:queue.map(q=>q.rec[nk]||''), done:[] };
  paCloseDlg();
  paOpenItem();
}
/* ---- 邊寫邊填（2026-10-30）----
   AI 一邊寫一邊傳回來：先開新增視窗，把寫好的文字欄位一格一格顯示（第 1 位客人）；
   寫的時候欄位鎖住、不能儲存；全部寫完再走上面原本的整理流程（paClean → paOpenItem），存的內容跟以前一樣 */
let PA_LIVE = null; // { px, M, ctrl, src }
function paLiveStart(px, text, ctrl){
  const P = PA[px];
  paCloseDlg(); PA_RUN = null;
  P.open({});
  const M = P.S().modal; if(!M) return null;
  M.pa = { keys:[], dropped:[], live:{ f:[], typing:'', more:false } };
  PA_LIVE = { px, M, ctrl, src:text };

  return PA_LIVE;
}
// 從寫到一半的 JSON 陣列撈出每一位客人目前寫好的欄位（只拿來顯示，最後還是用 JSON.parse 的結果）
function paPartial(raw){
  const s = String(raw||''), out = []; let i = s.indexOf('['); if(i < 0) return out;
  let cur = null, key = null, buf = '', mode = 0; // 0 找欄位、1 欄位名稱、2 等值、3 值（字串）
  for(i++; i < s.length; i++){
    const c = s[i];
    if(mode===1 || mode===3){
      if(c==='\\'){
        const n = s[i+1]; if(n===undefined) break;
        if(n==='u'){ const h = s.slice(i+2, i+6); if(h.length < 4) break; buf += String.fromCharCode(parseInt(h, 16) || 32); i += 5; }
        else { buf += n==='n' ? '\n' : n==='t' ? '\t' : n==='r' ? '' : n; i++; }
      } else if(c==='"'){
        if(mode===1){ key = buf; mode = 2; } else { cur.vals[key] = buf; cur.done.push(key); key = null; mode = 0; }
        buf = ''; continue;
      } else buf += c;
      if(mode===3) cur.vals[key] = buf;
      continue;
    }
    if(c==='{'){ cur = { vals:{}, done:[], closed:false }; out.push(cur); mode = 0; key = null; continue; }
    if(!cur) continue;
    if(c==='}'){ cur.closed = true; mode = 0; key = null; continue; }
    if(c==='"'){ if(mode===2){ mode = 3; cur.vals[key] = ''; } else mode = 1; buf = ''; continue; }
    if(mode===2 && /[-0-9tfn]/.test(c)){
      let j = i; while(j < s.length && !/[,}\s\]]/.test(s[j])) j++;
      if(j >= s.length) break;
      const v = s.slice(i, j); if(v!=='null'){ cur.vals[key] = v; cur.done.push(key); }
      key = null; mode = 0; i = j - 1;
    }
  }
  return out;
}
