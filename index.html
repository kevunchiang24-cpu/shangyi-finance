    const p = APP.staffProfiles[u.id]||{};
    return `${u.staffName||u.email} 職稱:${p.title||roleLabelMapAi[u.role]||u.role} 底薪:${money(p.baseSalary||0)}`;
  }).join('\n');

  /* ---- 廠商名單 ---- */
  const vendorLines = APP.data.vendors.map(v=>`${v.name||'未填'}${v.contact?(' 聯絡人:'+v.contact):''}${v.phone?(' 電話:'+v.phone):''}${v.note?(' 備註:'+v.note):''}`).join('\n');

  /* ---- 資產負債 ---- */
  const assetTotal = sum(APP.data.assets||[]);
  const liabilityTotal = sum(APP.data.liabilities||[]);
  const assetLines = (APP.data.assets||[]).map(a=>`${a.name||'未填'}:${money(a.amount)}`).join('、');
  const liabilityLines = (APP.data.liabilities||[]).map(a=>`${a.name||'未填'}:${money(a.amount)}`).join('、');

  /* ---- 案件分潤參數 ---- */
  const cs = APP.data.caseSettings;
  const settingsSummary = `業務獎金比例:${(cs.businessBonusRate*100).toFixed(1)}%；${cs.xiaojiangName||'小江'}獎金比例：門檻內(當月前${cs.xiaojiangThreshold}件) ${(cs.xiaojiangRateBelow*100).toFixed(1)}%，門檻外 ${(cs.xiaojiangRateAbove*100).toFixed(1)}%；廣告投手月獎金比例:${(cs.pilotBonusRate*100).toFixed(1)}%（每月5號發放）；送件方案選項:${(cs.planOptions||[]).join('、')}；業務清單:${(cs.staffOptions||[]).join('、')}`;

  /* ---- 本月出勤請假 ---- */
  const attendanceThis = APP.data.attendance.filter(a=>monthKey(a.date)===nowMonthKey);
  const attendanceLines = attendanceThis.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .map(a=>`${a.date} ${a.staffName||'未填'} ${a.leaveType||'請假'}${a.note?(' 備註:'+a.note):''}`).join('\n');

  /* ---- 本月個人業務進度紀錄摘要（全公司，不含客戶詳細資料大段文字，避免資料過長） ---- */
  const personalLogThis = APP.data.personalProgress.filter(c=>monthKey(c.date)===nowMonthKey);
  const personalLogLines = personalLogThis.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .map(c=>`${c.date} ${c.staffName||'未填'} 客戶:${c.customer||'未填'} 來源:${c.source||'未填'} 洽談產品:${c.dealProduct||'未填'} 聯絡狀態:${c.contactStatus||'未填'}${c.caseStatus?(' 案件狀態:'+c.caseStatus):''}${c.caseRemark?(' 狀況備註:'+c.caseRemark):''}`).join('\n');

  /* ---- 霍格華茲信箱狀態 ---- */
  const hogwartsInbox = APP.data.xiaojiangInbox || [];
  const hogwartsThreadUids = new Set(hogwartsInbox.map(m=>m.threadUid));
  const hogwartsUnreplied = new Set(hogwartsInbox.filter(m=>!m.senderIsXiaojiang && !m.readByXiaojiang).map(m=>m.threadUid)).size;

  /* ---- 本月業務案件與進度 ---- */
  const progAdThis = APP.data.progressAd.filter(c=>monthKey(c.date)===nowMonthKey);
  const progChThis = APP.data.progressChannel.filter(c=>monthKey(c.date)===nowMonthKey);
  const allProgThis = [...progAdThis, ...progChThis];
  const doneCount = allProgThis.filter(c=>STATUS_DONE.includes(c.status)).length;
  const pendingCount = allProgThis.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const closedCount = allProgThis.filter(c=>STATUS_CLOSED.includes(c.status)).length;
  const statusMap = {};
  allProgThis.forEach(c=>{ statusMap[c.status]=(statusMap[c.status]||0)+1; });
  const statusSummary = Object.entries(statusMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${v}`).join('、');

  /* ---- 本月處理中案件明細（排除已撥款完成／已婉拒客拒），讓AI能回答「誰在等撥款」這類具體問題 ---- */
  const activeCases = allProgThis.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status))
    .slice().sort((a,b)=>b.date.localeCompare(a.date));
  const activeCaseLines = activeCases.map(c=>`${c.date} ${c.customer||'未填姓名'} 業務:${c.staff||'未填'} 方案:${c.plan||'未填'} 狀態:${c.status}`).join('\n');

  /* ---- 本月獲利報表案件明細（廣告線＋通路線，含每一筆的金額與發放狀態） ---- */
  const casesAdThis = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const casesAdLines = casesAdThis.map(c=>`${c.date} ${c.customer||'未填'} 業務:${c.staff||'未填'} 方案:${c.plan||'未填'} 扣除成本後:${money(c.afterCost)} 業務獎金:${money(c.businessBonus)}(${adBusinessBonusPaid(c)?'已發放':'未發放'}) ${cs.xiaojiangName||'小江'}獎金:${money(c.xiaojiangBonus)}(${adXiaojiangBonusPaid(c)?'已發放':'未發放'}) 公司利潤:${money(c.companyProfit)}${c.specialHandling?` 特殊處理費:${money(c.specialFee)}(${c.specialFeePaid?'已入帳':'未入帳'})`:''}`).join('\n');
  const casesChannelThis = APP.data.casesChannel.filter(c=>monthKey(c.date)===nowMonthKey).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const casesChannelLines = casesChannelThis.map(c=>`${c.date} ${c.customer||'未填'} 業務:${c.staff||'未填'} 來源:${c.source||'未填'}${c.referrer?('('+c.referrer+')'):''} 扣除成本後:${money(c.afterCost)} 業務獎金:${money(channelCaseBusinessBonus(c))}(${chBusinessBonusPaid(c)?'已發放':'未發放'}) 通路實拿:${money(channelCaseChannelTake(c))}(${chChannelTakePaid(c)?'已發放':'未發放'}) 煌獎金:${money(channelCaseHuangBonus(c))}(${chHuangBonusPaid(c)?'已發放':'未發放'}) 公司利潤:${money(c.companyProfit)}`).join('\n');

  const monthAdCases = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey);

  const unpaidBonus = monthAdCases.filter(c=>!adAllPaid(c));

  const adSpendSorted = APP.data.adSpend.slice().sort((a,b)=>b.month.localeCompare(a.month)).slice(0,4);
  const adSpendLines = adSpendSorted.map(a=>{
    const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===a.month);
    const chCasesInMonth = APP.data.casesChannel.filter(c=>monthKey(c.date)===a.month);
    const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
    const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
    const spend = Number(a.spend||0);
    const fixedCostThisMonth = computeFixedCost(a.month);
    const adTotalNet = adRevenue - fixedCostThisMonth - spend;
    const roi = spend===0?0:((adRevenue-spend)-spend)/spend;
    const cpc = a.messages? spend/Number(a.messages) : 0;
    const cpa = a.approved? spend/Number(a.approved) : 0;
    const approveRate = a.submitted? Number(a.approved||0)/Number(a.submitted) : 0;

  }).join('\n');

  return `公司：${APP.data.company.name || '（未設定）'}

function buildValuationContext(){
  const all = APP.data.valuationCases || [];
  if(all.length===0) return '【房屋土地估價】目前沒有資料';
  const cut = (v, n)=>{ const t = String(v||'').replace(/\s+/g,' ').trim(); return t.length>n ? t.slice(0,n)+'…' : t; };
  const byMonth = {};
  all.forEach(c=>{ const m = c.month||'未知'; (byMonth[m] = byMonth[m] || {n:0, noPlan:0}); byMonth[m].n++; if(!String(c.plan||'').trim()) byMonth[m].noPlan++; });
  const monthLines = Object.keys(byMonth).sort().reverse().map(m=>`${m}：${byMonth[m].n} 筆（未填方案 ${byMonth[m].noPlan} 筆）`).join('；');
  const recent = Object.keys(byMonth).sort().reverse().slice(0,2);
  const lines = all.filter(c=>recent.includes(c.month||'未知'))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
    .slice(0,150)
    .map(c=>`[id:${c.id}] ${c.date||''}｜狀態:${c.status||'—'}｜經手人:${c.handler||'—'}｜客戶:${c.customerName||''}｜地址:${c.area||'—'}｜類別:${c.category||'—'}｜估價:${cut(c.valuation,60)}｜方案:${cut(c.plan,60)}｜備註:${cut(c.memo,50)}`);
  return `【房屋土地估價】（只有核心看得到；共 ${all.length} 筆，各月份筆數：${monthLines}）
近兩個月明細（最多 150 筆，由新到舊；更早的月份只有上面的筆數統計，沒有逐筆明細）：
${lines.join('\n') || '無'}`;
}

function buildStaffContext(){
  const meUid = APP.user.uid;

  const isAdminRole = isStaffAdmin();

  // 行政能管理全公司的進度追蹤，不像業務只看得到自己名下的案件
  const myAd = isAdminRole
    ? APP.data.progressAd.filter(c=>monthKey(c.date)===thisMonth)
    : APP.data.progressAd.filter(c=>c.staff===meName && monthKey(c.date)===thisMonth);
  const myCh = isAdminRole
    ? APP.data.progressChannel.filter(c=>monthKey(c.date)===thisMonth)
    : APP.data.progressChannel.filter(c=>c.staff===meName && monthKey(c.date)===thisMonth);
  const myAll = [...myAd, ...myCh];
  const doneCount = myAll.filter(c=>STATUS_DONE.includes(c.status)).length;
  const pendingCount = myAll.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const closedCount = myAll.filter(c=>STATUS_CLOSED.includes(c.status)).length;
  const statusMap = {};
  myAll.forEach(c=>{ statusMap[c.status]=(statusMap[c.status]||0)+1; });
  const statusSummary = Object.entries(statusMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${v}`).join('、');

  const myActiveCases = myAll.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status))
    .slice().sort((a,b)=>b.date.localeCompare(a.date));
  const myActiveCaseLines = myActiveCases.map(c=>
    isAdminRole
      ? `${c.date} ${c.customer||'未填姓名'} 業務:${c.staff||'未填'} 方案:${c.plan||'未填'} 狀態:${c.status}`

  const myEntries = getCleanBonusLedger().filter(e=>e.staffName===meName && monthKey(e.date)===thisMonth);

  const myLogs = APP.data.personalProgress.filter(c=>c.staffUid===meUid && monthKey(c.date)===thisMonth);
  const myLogLines = myLogs.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .map(c=>`${c.date} 客戶:${c.customer||'未填'} 來源:${c.source||'未填'} 洽談產品:${c.dealProduct||'未填'} 聯絡狀態:${c.contactStatus||'未填'}${c.caseStatus?(' 案件狀態:'+c.caseStatus):''}${c.caseRemark?(' 狀況備註:'+c.caseRemark):''}`).join('\n');
  const myAttendance = APP.data.attendance.filter(a=>a.staffUid===meUid && monthKey(a.date)===thisMonth);
  const myAttendanceLines = myAttendance.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .map(a=>`${a.date} ${a.leaveType||'請假'}${a.note?(' 備註:'+a.note):''}`).join('\n');
  const today = todayStr();
  const upcoming = APP.data.calendar.filter(c=>c.staffUid===meUid && c.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10)
    .map(c=>`${c.date} ${c.title}${c.note?('：'+c.note):''}`).join('\n');

  /* ---- 客戶關懷追蹤：行政看全公司，業務只看自己名下的客戶 ---- */
  const myFollowups = isAdminRole
    ? (APP.data.customerFollowups||[])
    : (APP.data.customerFollowups||[]).filter(f=>fuOwner(f)===meName);
  const myFollowupOverdue = myFollowups.filter(f=>followupOverallStatus(f)==='overdue');
  const myFollowupDoneCount = myFollowups.filter(f=>followupOverallStatus(f)==='done').length;
  const myFollowupOverdueLines = myFollowupOverdue.map(f=>
    isAdminRole
      ? `${f.customer||'未填'}（業務：${f.staff||'未填'}，方案：${f.plan||'未填'}，撥款日：${f.disbursedDate||'未填'}）`

  ).join('\n');
  const myFollowupUnpaidCount = myFollowups.filter(f=>f.paymentStatus==='unpaid').length;

  return `你正在跟「${meName || APP.userEmail}」對話（${isAdminRole?'行政':'業務'}），以下是他能看到的資料摘要（${isAdminRole?'進度追蹤是全公司的案件資料（行政負責管理全部案件的送件狀態），但完全不含公司財務數字（成本、利潤、獎金金額），也不知道其他同事的個人開發紀錄、請假、獎金等私人資料':'只有他自己的資料，不包含公司財務、其他同事的資料，你也不知道其他人的任何數字'}，遇到問這類問題請直接說明你看不到）：

function renderChatInto(box){
  if(!box) return;
  if(APP.chatMessages.length===0 && !APP.chatLoading){
    box.innerHTML = chatEmptyStateHtml();
  } else {
    box.innerHTML = APP.chatMessages.map((m,i)=>{
      if(m.role==='user') return `<div class="ai-msg user">${escHtml(m.text)}</div>`;
      let inner = `<div class="ai-msg ai">${escHtml(m.text)}`;
      if(m.pendingTx && m.pendingTx.length>0 && !m.confirmed){
        const kind = m.pendingKind || 'tx';
        const rowBuilder = kind==='personallog' ? buildPersonalLogRowHtml : kind==='progresstrack' ? buildProgressTrackRowHtml
          : kind==='attendance' ? buildAttendanceRowHtml : kind==='calendar' ? buildCalendarRowHtml
          : kind==='vendor' ? buildVendorRowHtml : kind==='employee' ? buildEmployeeRowHtml : kind==='socialaccount' ? buildSocialAccountRowHtml : kind==='customerfollowup' ? buildCustomerFollowupRowHtml : kind==='valuation' ? buildValuationRowHtml : kind==='bankloan' ? buildBankLoanRowHtml : kind==='adspend' ? buildAdSpendRowHtml : kind==='markbonuspaid' ? buildMarkBonusPaidRowHtml : buildTxRowHtml;
        inner += `<div id="chat-pending-${i}" style="margin-top:10px;background:#fff;border-radius:8px;padding:8px;" data-kind="${kind}">
          ${m.pendingTx.map((r,j)=>rowBuilder(r,j)).join('')}
          <button type="button" class="btn primary sm" style="margin-top:6px;width:100%;" data-action="chat-tx-confirm" data-msgidx="${i}">確認新增選取的紀錄</button>
        </div>`;
      } else if(m.confirmed){
        inner += `<div style="margin-top:6px;color:var(--green);font-size:12px;">✓ 已新增 ${m.confirmedCount} 筆紀錄</div>`;
        if(m.confirmError){
          inner += `<div style="margin-top:4px;color:var(--red);font-size:12px;">⚠ ${escHtml(m.confirmError)}</div>`;
        }
      }
      inner += `</div>`;
      return inner;
    }).join('') + (APP.chatLoading ? `<div class="ai-msg loading">AI 思考中…</div>` : '');
  }
  box.scrollTop = box.scrollHeight;
}
function renderChat(){
  const panel = document.getElementById('ai-chat-panel');
  const box = document.getElementById('ai-chat-messages');
  if(panel && box){
    panel.classList.toggle('hidden', !APP.chatOpen);
    renderChatInto(box);
  }
}

async function sendChatMessage(question){
  APP.chatMessages.push({role:'user', text:question});
  APP.chatLoading = true;
  renderChat();
  try{
    const iAmXj = isMeXiaojiang();
    const ctx = isCore() ? buildFinanceContext() : buildStaffContext();
    const resp = await fetch(AI_WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question, context: ctx, today: todayStr(),
        role: APP.role,
        categories: isCore() ? { expense: APP.data.categories.expense.map(c=>c.name), income: APP.data.categories.income.map(c=>c.name) } : { expense:[], income:[] },
        caseOptions: { plan: APP.data.caseSettings.planOptions, staff: APP.data.caseSettings.staffOptions, dealProduct: DEAL_PRODUCT_OPTIONS, contactStatus: CONTACT_STATUS_OPTIONS, status: STATUS_OPTIONS,
          socialAccountStatus: iAmXj ? SOCIAL_ACCOUNT_STATUS_OPTIONS : undefined,
          socialAccountStage: iAmXj ? SOCIAL_ACCOUNT_STRATEGY_STAGES : undefined,
          socialAccountPlatform: iAmXj ? SOCIAL_ACCOUNT_PLATFORM_OPTIONS : undefined }
      })
    });
    const data = await resp.json();
    let text = data.answer || data.error || '沒有取得回應，請再試一次。';
    let rows = null;
    let pendingKind = 'tx';
    const TAG_MAP_CORE = [['transactions','tx'],['progresstrack','progresstrack'],['attendance','attendance'],['calendar','calendar'],['vendor','vendor'],['customerfollowup','customerfollowup'],['adspend','adspend'],['markbonuspaid','markbonuspaid'],['valuation','valuation'],['bankloan','bankloan']];
    const TAG_MAP_STAFFSALES = [['personallog','personallog'],['attendance','attendance'],['calendar','calendar'],['customerfollowup','customerfollowup']];
    const TAG_MAP_STAFFADMIN = [['progresstrack','progresstrack'],['attendance','attendance'],['calendar','calendar'],['customerfollowup','customerfollowup']];
    let tagMap = isCore() ? TAG_MAP_CORE : isStaffSales() ? TAG_MAP_STAFFSALES : isStaffAdmin() ? TAG_MAP_STAFFADMIN : [];
    if(iAmXj) tagMap = [['socialaccount','socialaccount'], ...tagMap];
    for(const [tag, kind] of tagMap){
      const re = new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`, 'i');
      const match = text.match(re);
      if(match){
        try{ rows = JSON.parse(match[1].trim()); }catch(e){ rows = null; }
        text = text.replace(match[0], '').trim();
        pendingKind = kind;
        break;
      }
    }
    // 銀行信貸:標籤被截斷或 JSON 讀不出來時,明確告知,不要靜默失敗
    if(isCore() && (!rows || !Array.isArray(rows) || rows.length===0)){
      if(/<bankloan>/i.test(text)){ text = text.replace(/<bankloan>[\s\S]*$/i,'').trim() + '\n⚠ 內容太長,銀行信貸資料沒有整理完整,請分段貼上(一次少幾位客戶)。'; }
      else if(pendingKind==='bankloan'){ text = text + '\n⚠ 內容太長或格式不完整,請分段貼上。'; }
    }
    APP.chatMessages.push({ role:'ai', text, pendingTx: (rows && Array.isArray(rows) && rows.length>0) ? rows : null, pendingKind });
  }catch(e){
    APP.chatMessages.push({role:'ai', text:'連線失敗，請確認網路連線後再試一次。'});
  }
  APP.chatLoading = false;
  renderChat();
}

document.addEventListener('click', (e)=>{

  if(el){
    const action = el.dataset.action;
    if(action==='open-social-account-modal'){ openSocialAccountModal(null); return; }
    if(action==='edit-social-account'){ const a = (APP.data.socialAccounts||[]).find(x=>x.id===el.dataset.id); if(a) openSocialAccountModal(a); return; }
    if(action==='mark-social-login'){
      const a = (APP.data.socialAccounts||[]).find(x=>x.id===el.dataset.id);
      if(a){ a.lastLoginDate = todayStr(); Object.assign(a, stamp({})); saveSocialAccount(a); }
      return;
    }
    if(action==='delete-social-account'){
      openConfirm('確定要刪除這個帳號的所有資料嗎？此動作無法復原。', ()=>{ deleteSocialAccount(el.dataset.id); });
      return;
    }
    if(action==='social-tab'){ APP.socialAccountsTab = el.dataset.tab; render(); return; }
    if(action==='open-chat-thread'){
      APP.view = 'chatRoom';
      APP.chatRoomActivePeer = el.dataset.peer;
      render();
      const msgBox = document.getElementById('chat-thread-messages');

        .forEach(m=>{ updateDoc(doc(db,'directMessages', m.id), {read:true}).catch(()=>{}); });
      return;
    }
    if(action==='close-chat-thread'){ APP.chatRoomActivePeer = null; render(); return; }
    if(action==='pick-chat-file'){ const inp = document.getElementById('chat-file-input'); if(inp) inp.click(); return; }
    if(action==='remove-pending-chat-file'){
      const idx = Number(el.dataset.idx);
      (APP._pendingChatFiles||[]).splice(idx,1);
      renderChatFilePreview();
      return;
    }
    if(action==='burn-message'){
      const msgId = el.dataset.id;
      const msg = (APP.data.directMessages||[]).find(m=>m.id===msgId);
      if(!msg || msg.senderUid!==APP.user.uid) return; // 只能燒自己傳的
      openConfirm('確定要燒掉這則訊息嗎？燒掉後無法復原。', ()=>{
        (msg.attachments||[]).forEach(a=>{ if(a.url) deleteObject(ref(storage, a.url)).catch(()=>{}); });
        deleteDoc(doc(db,'directMessages', msgId)).catch(()=>{});
      });
      return;
    }
    if(action==='burn-whole-thread'){
      const peerUid = el.dataset.peer;
      const myUid2 = APP.user.uid;
      const threadMsgs = (APP.data.directMessages||[]).filter(m =>
        (m.senderUid===myUid2 && m.recipientUid===peerUid) || (m.senderUid===peerUid && m.recipientUid===myUid2)
      );
      if(threadMsgs.length===0) return;
      openConfirm(`確定要燒掉整個對話嗎？這 ${threadMsgs.length} 則訊息都會永久消失，無法復原。`, ()=>{

      else if(q==='week') APP.valuationFilter = {from:formatDateLocal(new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()-dw)), to:t};
      else if(q==='month') APP.valuationFilter = {from:t.slice(0,8)+'01', to:t};
      else if(q==='noplan') APP.valuationFilter = Object.assign({}, APP.valuationFilter||{}, {planState:'empty'});
      else if(q==='hasplan') APP.valuationFilter = Object.assign({}, APP.valuationFilter||{}, {planState:'filled'});
      render(); return;
    }
    if(action==='valuation-edit-field'){ openValuationFieldModal(el.dataset.id, el.dataset.field); return; }
    if(action==='valuation-add'){ openValuationModal(null); return; }
    if(action==='valuation-edit'){ const c = APP.data.valuationCases.find(x=>x.id===el.dataset.id); if(c) openValuationModal(c); return; }
    if(action==='valuation-delete'){
      const c = APP.data.valuationCases.find(x=>x.id===el.dataset.id);
      if(c) openConfirm(`確定要刪除「${c.customerName}」這筆估價資料嗎?`, ()=>{ deleteValuationCase(c.id); });
      return;
    }
    if(action==='valuation-import'){ openValuationImportModal(); return; }
    if(action==='valuation-targets'){ openValuationTargetsModal(); return; }
    if(action==='edit-ad-case'){ const c = APP.data.casesAd.find(x=>x.id===el.dataset.id); if(c) openAdCaseModal(c); return; }
    if(action==='delete-ad-case'){
      const caseId = el.dataset.id;
      openConfirm('確定要刪除這筆案件資料嗎？', ()=>{
        APP.data.casesAd = APP.data.casesAd.filter(x=>x.id!==caseId); saveCasesAd();
        deleteBonusLedgerEntry(caseId);
        deleteBonusLedgerEntry('xj-'+caseId);
        deleteBonusLedgerEntry('wiz-'+caseId);
      }); return;
    }
    if(action==='post-ad-case'){ postAdCaseToTransactions(el.dataset.id); return; }
    if(action==='open-channel-case-modal'){ openChannelCaseModal(null); return; }
    if(action==='edit-channel-case'){ const c = APP.data.casesChannel.find(x=>x.id===el.dataset.id); if(c) openChannelCaseModal(c); return; }
    if(action==='delete-channel-case'){
      const caseId = el.dataset.id;
      openConfirm('確定要刪除這筆案件資料嗎？', ()=>{
        APP.data.casesChannel = APP.data.casesChannel.filter(x=>x.id!==caseId); saveCasesChannel();
        deleteBonusLedgerEntry('ch-'+caseId);
        deleteBonusLedgerEntry('huang-'+caseId);
        deleteBonusLedgerEntry('wiz-'+caseId);
      }); return;
    }
    if(action==='post-channel-case'){ postChannelCaseToTransactions(el.dataset.id); return; }
    if(action==='open-adspend-modal'){ openAdSpendModal(null); return; }
    if(action==='edit-adspend'){ const a = APP.data.adSpend.find(x=>x.id===el.dataset.id); if(a) openAdSpendModal(a); return; }
    if(action==='delete-adspend'){
      openConfirm('確定要刪除這筆月份資料嗎？', ()=>{
        APP.data.adSpend = APP.data.adSpend.filter(x=>x.id!==el.dataset.id); saveAdSpend();
      }); return;
    }
  }
  if(e.target.id==='hamburger-btn'){ openSidebar(); return; }
  if(e.target.id==='toggle-core-nav'){
    const block = document.getElementById('core-nav-block');
    if(block){
      const showing = block.style.display !== 'none';
      block.style.display = showing ? 'none' : 'block';
      e.target.textContent = showing ? '☰ 展開完整選單' : '☰ 收合完整選單';
    }
    return;
  }
  if(e.target.id==='sidebar-backdrop'){ closeSidebar(); return; }
  if(e.target.id==='ai-chat-toggle'){ APP.chatOpen = !APP.chatOpen; renderChat(); return; }
  if(e.target.id==='ai-chat-close'){ APP.chatOpen = false; renderChat(); return; }
  const chatConfirmBtn = e.target.closest('[data-action="chat-tx-confirm"]');
  if(chatConfirmBtn){
    const msgIdx = Number(chatConfirmBtn.dataset.msgidx);
    const container = document.getElementById('chat-pending-'+msgIdx);
    if(container){
      chatConfirmBtn.disabled = true;
      chatConfirmBtn.textContent = '存檔中…';
      const kind = container.dataset.kind || 'tx';
      const rowEls = container.querySelectorAll('.tx-row');
      const savePromises = [];
      let skipped = 0;
      rowEls.forEach(rowEl=>{
        const chk = rowEl.querySelector('.ai-row-check');
        if(!chk.checked) return;
        const data = {};
        rowEl.querySelectorAll('.ai-row-field').forEach(f=>{ data[f.dataset.key] = f.value; });
        if(kind==='tx'){
          data.note = data.note || ''; data.pending = false;
          data.amount = Number(data.amount) || 0;
          const tx = stamp({id:uid(), ...data});
          APP.data.transactions.push(tx);
          savePromises.push(saveTransactions());
        } else if(kind==='personallog'){
          data.customer = data.customer || '（未填姓名）';
          data.phone = data.phone || ''; data.source = data.source || ''; data.transferTo = data.transferTo || '';
          data.latestNote = data.latestNote || ''; data.caseStatus = data.caseStatus || ''; data.caseRemark = data.caseRemark || '';
          savePromises.push(savePersonalProgress(stamp({ id:uid(), staffUid:effectiveUid(), staffName:effectiveStaffName(), ...data })));
        } else if(kind==='progresstrack'){
          data.customer = data.customer || '';
          if(!data.customer){ skipped++; return; }
          data.phone = data.phone || ''; data.note = data.note || ''; data.status = data.status || '教照會';
          const isCh = data.lineType==='channel';
          const rec = stamp({ id:uid(), date:data.date, customer:data.customer, phone:data.phone, plan:data.plan||'', staff:data.staff||'', ...(isCh ? { source:'通路', referrer:'' } : {}), status:data.status, note:data.note });
          // 跟手動改狀態一樣：對保記對保日期（後端對保提醒用）；撥款完成記撥款日期並建立客戶關懷追蹤
          if(rec.status==='對保') rec.guarantorStatusDate = todayStr();
          if(rec.status==='撥款完成') rec.disbursedDate = todayStr();
          savePromises.push(isCh ? saveProgressChannelCase(rec) : saveProgressAdCase(rec));
          if(rec.status==='撥款完成') ensureFollowupOnDisbursed(rec, isCh ? 'channel' : 'ad');
        } else if(kind==='attendance'){
          let targetUid, targetName;
          if(isCore()){
            targetName = data.staffName || '';
            const u = APP.users.find(x=>x.staffName===targetName);
            if(!u){ skipped++; return; }
            targetUid = u.id;
          } else {
            targetUid = effectiveUid(); targetName = effectiveStaffName();
          }
          if(!data.date){ skipped++; return; }
          const leaveType = data.leaveType||'事假';
          let hours = null;
          if(LEAVE_TYPES_HOURLY.includes(leaveType)){
            if(!data.startTime || !data.endTime){ skipped++; return; } // 時數假別缺時間，交給使用者自己去頁面裡補
            const [sh,sm] = data.startTime.split(':').map(Number);
            const [eh,em] = data.endTime.split(':').map(Number);
            hours = Math.round(((eh*60+em)-(sh*60+sm))/60*10)/10;
            if(hours<=0){ skipped++; return; }
          }
          savePromises.push(saveAttendance(stamp({
            id:uid(), staffUid:targetUid, staffName:targetName, date:data.date, leaveType,
            startTime:data.startTime||'', endTime:data.endTime||'', hours, note:data.note||''
          })));
          const dateDesc = hours!=null ? `${data.date}（${data.startTime}～${data.endTime}）` : data.date;
          notifyCompanyLeave(targetName, leaveType, dateDesc);
        } else if(kind==='calendar'){
          let targetUid;
          if(isCore()){
            const u = APP.users.find(x=>x.staffName===(data.staffName||''));
            if(!u){ skipped++; return; }
            targetUid = u.id;
          } else {
            targetUid = effectiveUid();
          }
          if(!data.date || !data.title){ skipped++; return; }
          savePromises.push(saveCalendarEntry(stamp({ id:uid(), staffUid:targetUid, date:data.date, title:data.title, note:data.note||'' })));
        } else if(kind==='vendor'){
          if(!data.name){ skipped++; return; }
          APP.data.vendors.push(stamp({ id:uid(), name:data.name, contact:data.contact||'', phone:data.phone||'', taxId:'', note:data.note||'' }));
          savePromises.push(saveVendors());
        } else if(kind==='employee'){
          if(!data.name){ skipped++; return; }
          APP.data.hr.employees.push(stamp({ id:uid(), name:data.name, title:data.title||'', salary:Number(data.salary)||0, startDate:data.startDate||todayStr(), status:'active' }));
          savePromises.push(saveHR());
        } else if(kind==='socialaccount'){
          if(!data.accountName){ skipped++; return; }
          savePromises.push(saveSocialAccount(stamp({
            id:uid(), accountName:data.accountName, platform:data.platform||'Facebook', status:data.status||'養號中',
            strategyStage:data.strategyStage||'新建', bmGroup:data.bmGroup||'', createdDate:todayStr(), lastLoginDate:todayStr(),
            loginAccount:data.loginAccount||'', password:data.password||'', twoFactor:data.twoFactor||'',
            boundPhone:data.boundPhone||'', boundEmail:data.boundEmail||'', adSpendNote:'', note:data.note||'', compliance:{}
          })));
        } else if(kind==='customerfollowup'){
          if(!data.customer){ skipped++; return; }
          const myName = myStaffName();
          const candidates = (APP.data.customerFollowups||[]).filter(f=>f.customer===data.customer && (isCore()||isStaffAdmin() ? true : f.staff===myName));
          if(candidates.length!==1){ skipped++; return; } // 找不到或姓名重複無法判斷，交給使用者自己去頁面裡確認
          const f = candidates[0];
          if(data.stage){
            f['reminder'+data.stage] = { done:true, note:data.note||'', doneDate:todayStr() };
          }
          if(data.payment){
            f.paymentStatus = data.payment==='unpaid' ? 'unpaid' : '';
          }
          Object.assign(f, stamp({}));
          savePromises.push(saveCustomerFollowup(f));
        } else if(kind==='valuation'){
          if(!data.customerName || !data.date){ skipped++; return; }
          const old = data.id ? (APP.data.valuationCases||[]).find(x=>x.id===data.id) : null;
          const fields = {};
          ['status','date','handler','customerName','area','category','valuation','plan','memo'].forEach(k=>{ fields[k] = String(data[k]||'').trim(); });
          fields.month = monthKey(fields.date);
          const rec = old ? Object.assign({}, old, fields) : { id:uid(), ...fields };
          if(old) delete rec._silent; // 經過手動確認的修改視為正常編輯,方案有變動就會推播
          savePromises.push(saveValuationCase(stamp(rec)));
        } else if(kind==='bankloan'){
          if(!data.customerName){ skipped++; return; }
          const oldBl = data.id ? (APP.data.bankLoanCases||[]).find(x=>x.id===data.id) : null;
          if(data.id && !oldBl){ skipped++; return; } // id 找不到:不寫入
          const bf = {};
          ['status','date','owner','customerName','phone','packJob','channel','plan','note'].forEach(k=>{ bf[k] = String(data[k]==null?'':data[k]).trim(); });
          if(!bf.status) bf.status = oldBl ? oldBl.status : '評估中';
          const bAmt = String(data.approvedAmount==null?'':data.approvedAmount).trim();
          bf.approvedAmount = (bAmt===''||isNaN(Number(bAmt))) ? null : Number(bAmt);
          const blRec = oldBl ? Object.assign({}, oldBl, bf) : { id:uid(), ...bf };
          if(bf.status==='撥款完成' && !(oldBl && oldBl.status==='撥款完成')) blRec.disbursedDate = todayStr();
          savePromises.push(saveBankLoanCase(stamp(blRec)));
        } else if(kind==='adspend'){
          if(!data.month){ skipped++; return; }
          const existing = APP.data.adSpend.find(a=>a.month===data.month);
          const fields = {
            spend: Number(data.spend)||0, messages: Number(data.messages)||0,
            submitted: Number(data.submitted)||0, approved: Number(data.approved)||0, note: data.note||''
          };
          if(existing) Object.assign(existing, stamp(fields));
          else APP.data.adSpend.push(stamp({id:uid(), month:data.month, ...fields}));
          savePromises.push(saveAdSpend());
        } else if(kind==='markbonuspaid'){
          if(!data.customer){ skipped++; return; }
          const arr = data.caseType==='channel' ? APP.data.casesChannel : APP.data.casesAd;
          const candidates = arr.filter(c=>c.customer===data.customer);
          if(candidates.length!==1){ skipped++; return; } // 找不到或同名案件不只一筆，交給使用者自己去頁面裡確認
          candidates[0].businessBonusPaid = data.markPaid!=='false';
          savePromises.push(data.caseType==='channel' ? saveCasesChannel() : saveCasesAd());
        }
      });
      Promise.allSettled(savePromises).then(results=>{
        const succeeded = results.filter(r=>r.status==='fulfilled').length;
        const failed = results.filter(r=>r.status==='rejected');
        APP.chatMessages[msgIdx].confirmed = true;
        APP.chatMessages[msgIdx].confirmedCount = succeeded;
        if(failed.length>0){
          const reason = failed[0].reason ? (failed[0].reason.message || String(failed[0].reason)) : '未知錯誤';
          APP.chatMessages[msgIdx].confirmError = `有 ${failed.length} 筆存檔失敗（原因：${reason}），請確認你有這個操作的權限，或稍後再試一次。`;
        } else if(succeeded===0 && skipped>0){
          APP.chatMessages[msgIdx].confirmError = '沒有任何一筆資料完整到能存檔（例如缺少客戶姓名），請檢查欄位內容。';
        }
        renderChat();
      });
    }
    return;
  }
  if(e.target.id==='logout-btn' || e.target.id==='pending-logout'){ signOut(auth); return; }
  if(e.target.id==='appearance-logo-reset'){
    APP.data.companyPublic = { ...APP.data.companyPublic, logoDataUrl:'' };
    APP._pendingLogoDataUrl = undefined;
    saveCompanyPublic(APP.data.companyPublic);
    updateFavicon();
    renderRoot();
    return;
  }
  if(e.target.id==='forgot-link'){
    const emailInput = document.querySelector('#login-form input[name="email"]');
    const email = emailInput ? emailInput.value.trim() : '';
    if(!email){ APP.authError='請先在上方輸入你的電子郵件，再點一次「忘記密碼」'; renderRoot(); return; }
    sendPasswordResetEmail(auth, email).then(()=>{
      APP.authError=''; APP.authMsg='已寄出密碼重設信，請至信箱查收'; renderRoot();
    }).catch(err=>{ APP.authMsg=''; APP.authError='寄送失敗：'+err.message; renderRoot(); });
    return;
  }
});

document.addEventListener('change', (e)=>{

            senderName: displayNameFor(APP.user.uid, APP.userEmail), senderUid: APP.user.uid,

          }).catch(()=>{});

      }

  if(e.target.classList && e.target.classList.contains('inline-status-select')){

    else if(listName==='casesChannel'){ arr = APP.data.casesChannel; saveFn = saveCasesChannel; }
    else if(listName==='transactions'){ arr = APP.data.transactions; saveFn = saveTransactions; }
    const rec = arr && arr.find(x=>x.id===id);
    if(rec){
      rec[field] = e.target.value;
      // 進度追蹤的狀態欄位跳到「對保」時，記下今天的日期，讓後端的對保提醒定時任務可以算出天數
      if(field==='status' && e.target.value==='對保' && (listName==='progressAd'||listName==='progressChannel')){
        rec.guarantorStatusDate = todayStr();
      }
      // 狀態跳到「撥款完成」時，也記下今天的日期——業務總覽的當月撥款完成件數要用「實際完成撥款的當下」判斷月份，
      // 而不是案件原本記錄的送件日期，避免上個月送件、這個月才撥款完成的案件被算到錯的月份去
      if(field==='status' && e.target.value==='撥款完成' && (listName==='progressAd'||listName==='progressChannel')){

      const numericFields = ['amount','spend','messages','submitted','approved'];

      Object.assign(rec, stamp({}));
      if(listName==='casesAd' && field==='date') recalcAdCase(rec);
      if(listName==='casesChannel' && field==='date') recalcChannelCase(rec);
      saveFn(listName==='progressAd'||listName==='progressChannel' ? rec : undefined);
      if(listName==='casesAd' || listName==='casesChannel') render();
    }
    return;
  }
  if(e.target.classList && e.target.classList.contains('inline-number-field')){

    const arr = listName==='casesAd' ? APP.data.casesAd : APP.data.casesChannel;

    const rec = arr.find(x=>x.id===id);

  if(e.target.classList && e.target.classList.contains('daily-bonus-checkbox')){

    const adMatches = isXj

    // 直客/通路案件：依這個人名實際對應到哪個角色(業務/煌/通路夥伴)，只碰對應的那個欄位；
    // 「煌」可能同時是某案件的業務(拿業務獎金)又是煌獎金收款人，兩種身分要能同時比對到，不互相排除
    const chBusinessMatches = (!isXj) ? APP.data.casesChannel.filter(c=>dateMatch(c) && (unpaidMode?!chBusinessBonusPaid(c):true) && c.staff===name && channelCaseBusinessBonus(c)>0) : [];
    const chHuangMatches = name==='煌' ? APP.data.casesChannel.filter(c=>dateMatch(c) && (unpaidMode?!chHuangBonusPaid(c):true) && channelCaseHuangBonus(c)>0) : [];
    const chChannelTakeMatches = (!isXj) ? APP.data.casesChannel.filter(c=>dateMatch(c) && (unpaidMode?!chChannelTakePaid(c):true) && (c.referrer||c.staff)===name && channelCaseChannelTake(c)>0) : [];
    const wizardMatches = isXj

    adMatches.forEach(c=>{

    });
    const chMatches = [...chBusinessMatches, ...chHuangMatches, ...chChannelTakeMatches];
    if(adMatches.length>0 || wizardMatches.some(c=>APP.data.casesAd.includes(c))) saveCasesAd();

  if(e.target.classList && (e.target.classList.contains('inline-log-field') || e.target.classList.contains('inline-log-text'))){

    else if(key==='mylog-month') APP.myLogFilter.month = e.target.value;

    else if(key==='social-status') APP.socialAccountFilter.status = e.target.value;
    else if(key==='social-stage') APP.socialAccountFilter.stage = e.target.value;
    else if(key==='social-bm') APP.socialAccountFilter.bmGroup = e.target.value;
    else if(key==='social-personal-status') APP.socialPersonalFilter.status = e.target.value;
    else if(key==='social-fanpage-status') APP.socialFanPageFilter.status = e.target.value;
    else if(key==='followup-staff') APP.followupOverviewFilter.staff = e.target.value;

      // 如果同時有兩人被標記，會共用同一份資料而不是各自獨立
      APP.users.forEach(u=>{
        if(u.id!==uidTarget && u.isHuang){

  if(e.target.classList && e.target.classList.contains('display-name-input')){

  if(e.target.classList && e.target.classList.contains('avatar-upload-input')){
    const uidTarget = e.target.dataset.uid;

    if(file.size > 5*1024*1024){ alert('圖片太大，請選 5MB 以內的圖片'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width-minSide)/2, sy = (img.height-minSide)/2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        savePublicProfile(uidTarget, { avatarDataUrl: dataUrl });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if(e.target.id==='appearance-logo-file'){
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ alert('圖片太大，請選 5MB 以內的圖片'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 240;
        const scale = Math.min(maxSize/img.width, maxSize/img.height, 1);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/png');
        APP._pendingLogoDataUrl = dataUrl;
        const preview = document.getElementById('appearance-logo-preview');
        if(preview) preview.src = dataUrl;
      };
      img.src = ev.target.result;

    reader.readAsDataURL(file);

  if(e.target.id==='xj-chat-file-input'){
    const file2 = e.target.files[0];
    const xjPreview = document.getElementById('xj-chat-preview');
    if(!file2){ APP._pendingXjChatFile = null; if(xjPreview) xjPreview.innerHTML=''; return; }
    if(file2.size > 10*1024*1024){
      alert(`「${file2.name}」太大，請選 10MB 以內的檔案。`);
      e.target.value = '';
      return;
    }
    const isImage = file2.type && file2.type.startsWith('image/');
    if(xjPreview) xjPreview.innerHTML = `<span style="color:var(--muted);font-size:12px;">處理中…</span>`;
    if(isImage){
      const reader2 = new FileReader();
      reader2.onload = (ev2)=>{
        const img2 = new Image();
        img2.onload = ()=>{
          const maxSize = 1600;
          const scale = Math.min(maxSize/img2.width, maxSize/img2.height, 1);
          const w = Math.max(1, Math.round(img2.width*scale)), h = Math.max(1, Math.round(img2.height*scale));
          const canvas2 = document.createElement('canvas');
          canvas2.width = w; canvas2.height = h;
          const ctx2 = canvas2.getContext('2d');
          ctx2.drawImage(img2, 0, 0, w, h);
          const previewUrl = canvas2.toDataURL('image/jpeg', 0.85);
          canvas2.toBlob((blob)=>{
            APP._pendingXjChatFile = { blob, name: file2.name, type: 'image/jpeg' };
            if(xjPreview) xjPreview.innerHTML = `<div style="display:flex;align-items:center;gap:8px;"><img src="${previewUrl}" style="max-width:70px;max-height:70px;border-radius:8px;"/><button type="button" data-action="clear-xj-chat-file" style="font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;">移除</button></div>`;
          }, 'image/jpeg', 0.85);
        };
        img2.src = ev2.target.result;
      };
      reader2.readAsDataURL(file2);
    } else {
      APP._pendingXjChatFile = { blob: file2, name: file2.name, type: file2.type||'application/octet-stream' };
      if(xjPreview) xjPreview.innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-size:12px;">📎 ${escHtml(file2.name)}<button type="button" data-action="clear-xj-chat-file" style="font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;">移除</button></div>`;
    }
    return;
  }
});
let isImeComposing = false;
document.addEventListener('compositionstart', (e)=>{
  if(e.target.classList && (e.target.classList.contains('table-search-input')) || e.target.id==='tx-search' || e.target.id==='vendor-search'){
    isImeComposing = true;
  }
});
document.addEventListener('compositionend', (e)=>{
  isImeComposing = false;
  // 組字剛結束（例如注音選字完成），這時候瀏覽器通常還會再補發一次 input 事件，
  // 但為了保險起見這裡也主動觸發一次，確保搜尋結果一定會更新
  if(e.target.classList && e.target.classList.contains('table-search-input')){
    const stateKey = e.target.dataset.statekey;
    const focusVal = e.target.value;
    const cursorPos = e.target.selectionStart;
    APP[stateKey] = focusVal;
    render();
    const newEl = document.querySelector(`.table-search-input[data-statekey="${stateKey}"]`);
    if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  } else if(e.target.id==='tx-search'){
    APP.txFilter.search = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('tx-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
  } else if(e.target.id==='vendor-search'){
    APP.vendorSearch = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('vendor-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.target.tagName==='TEXTAREA' && e.target.closest('#xj-chat-form') && e.key==='Enter' && !e.shiftKey && !isImeComposing){
    e.preventDefault();
    e.target.closest('#xj-chat-form').requestSubmit ? e.target.closest('#xj-chat-form').requestSubmit() : e.target.closest('#xj-chat-form').dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
  }
});
document.addEventListener('input', (e)=>{

});
document.addEventListener('submit', (e)=>{

      ? (APP.data.caseSettings.xiaojiangName || '小江')
      : (displayNameFor(APP.user.uid, APP.userEmail) || APP.userEmail);

          threadName = existingMsg ? existingMsg.threadName : ((APP.users.find(u=>u.id===threadUid)||{}).staffName || threadUid);
          senderName = APP.data.caseSettings.xiaojiangName || '小江';
        } else {
          threadName = effectiveStaffName()||displayNameFor(APP.user.uid, APP.userEmail)||APP.userEmail;
          senderName = threadName;
        }
        const rec = stamp({
          id: msgId, threadUid, threadName,
          senderIsXiaojiang, senderUid: APP.user.uid, senderName,
          message, attachments: uploaded ? [uploaded] : [],
          readByXiaojiang: senderIsXiaojiang
        });
        return saveXiaojiangUpload(rec);
      })
      .then(()=>{
        APP._pendingXjChatFile = null;
        messageInput.value = '';

        if(submitBtn) submitBtn.disabled = false;
        render();
        setTimeout(()=>{ const scroll = document.getElementById('xj-chat-scroll'); if(scroll) scroll.scrollTop = scroll.scrollHeight; }, 60);
      })
      .catch(()=>{

        if(submitBtn) submitBtn.disabled = false;
      });
    return;
  }
  if(e.target.id==='ai-chat-form'){

    const input = document.getElementById('ai-chat-input');

    input.value = '';
    sendChatMessage(q);
    return;
  }
  if(e.target.id==='chat-thread-form'){ e.preventDefault(); crSend(); return; }
  if(e.target.id==='login-form'){

    const conflictWithOption = APP.data.caseSettings.staffOptions.includes(newXjName);
    const conflictWithStaffAccount = APP.users.some(u=>(u.role==='staffAdmin'||u.role==='staffSales') && u.staffName===newXjName);
    if(conflictWithOption || conflictWithStaffAccount){
      alert(`「${newXjName}」跟現有的業務姓名／帳號重複了，這樣會導致小江的獎金資料被該業務的帳號讀取到，請換一個不會撞名的名字（例如加姓氏、或用「投手-小江」這種寫法）。`);
      return;
    }
    APP.data.caseSettings = {
      ...APP.data.caseSettings,
      businessBonusRate: (Number(fd.get('businessBonusRate'))||0)/100,
      xiaojiangThreshold: Number(fd.get('xiaojiangThreshold'))||0,
      xiaojiangRateBelow: (Number(fd.get('xiaojiangRateBelow'))||0)/100,
      xiaojiangRateAbove: (Number(fd.get('xiaojiangRateAbove'))||0)/100,
      pilotBonusRate: (Number(fd.get('pilotBonusRate'))||0)/100,
      xiaojiangName: newXjName
    };
    saveCaseSettings(); return;
  }
  if(e.target.id==='rank-settings-form'){
    e.preventDefault();
    if(!isAdmin()) return;
    const fd = new FormData(e.target);
    APP.data.caseSettings = {
      ...APP.data.caseSettings,
      rankBronze: Number(fd.get('rankBronze'))||0,
      rankSilver: Number(fd.get('rankSilver'))||0,
      rankGold: Number(fd.get('rankGold'))||0,
      rankPlatinum: Number(fd.get('rankPlatinum'))||0,
      rankDiamond: Number(fd.get('rankDiamond'))||0,
      rankMaster: Number(fd.get('rankMaster'))||0,
      rankGrandmaster: Number(fd.get('rankGrandmaster'))||0,
      rankLegend: Number(fd.get('rankLegend'))||0,
    };
    saveCaseSettings(); return;
  }
  if(e.target.id==='company-form'){
    e.preventDefault();
    const fd = new FormData(e.target);
    APP.data.company = { ...APP.data.company, name:fd.get('name'), taxId:fd.get('taxId'), phone:fd.get('phone'), address:fd.get('address') };
    saveCompany(); return;
  }
  if(e.target.id==='appearance-form'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const logoDataUrl = APP._pendingLogoDataUrl !== undefined ? APP._pendingLogoDataUrl : APP.data.companyPublic.logoDataUrl;
    APP.data.companyPublic = { ...APP.data.companyPublic, systemName:fd.get('systemName')||'', systemSubtitle:fd.get('systemSubtitle')||'', logoDataUrl };
    APP._pendingLogoDataUrl = undefined;
    saveCompanyPublic(APP.data.companyPublic);
    updateFavicon();
    renderRoot();
    return;
  }
  if(['asset-form','category-form','subcategory-form','employee-form','collab-form','history-form','vendor-form','case-option-form','adspend-form','export-year-form','personal-log-form','attendance-form','calendar-form','progress-ad-form','progress-channel-form','customer-detail-form','social-account-form','personal-account-form','fanpage-form','roster-form','spare-email-form','mark-followup-form','upload-cert-form','edit-attendance-form'].includes(e.target.id)){
    e.preventDefault();
    try{
      const fd = new FormData(e.target);
      const data = {};
      fd.forEach((v,k)=>{ data[k]=v; });
      if(modalOnSubmit) modalOnSubmit(data);
    } catch(err){
      console.error('表單送出時發生錯誤（'+e.target.id+'）：', err);
      alert('儲存時發生非預期錯誤，請截圖這則訊息回報給開發者：\n' + (err && err.message ? err.message : err));
    } finally{
      closeModal();
      render();
    }
  }
});
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('notif-panel');
  const bell = document.getElementById('notif-bell');
  if(panel && panel.classList.contains('open') && !panel.contains(e.target) && !(bell && bell.contains(e.target))){
    toggleNotifPanel(false);
  }
});
</script>
</body>
</html>
