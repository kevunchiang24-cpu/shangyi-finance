  document.getElementById('cc-special').addEventListener('change', function(){
    document.getElementById('cc-specialFee').style.display = this.checked ? '' : 'none';
    recalc();
  });
  document.getElementById('cc-specialFee').addEventListener('input', recalc);
  document.querySelectorAll('.cc-percent-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('cc-deductionPercent').value = btn.dataset.percent;
      recalc();
    });
  });
  document.getElementById('cc-bb-enabled').addEventListener('change', function(){
    document.getElementById('cc-businessBonus').style.display = this.checked ? '' : 'none';
    recalc();
  });
  document.getElementById('cc-ct-enabled').addEventListener('change', function(){
    document.getElementById('cc-channelTake').style.display = this.checked ? '' : 'none';
    recalc();
  });
  document.getElementById('cc-hb-enabled').addEventListener('change', function(){
    document.getElementById('cc-huangBonus').style.display = this.checked ? '' : 'none';
    recalc();
  });

  function recalc(){
    const approvedAmount = Number(document.getElementById('cc-approvedAmount').value)||0;
    const deductionPercent = Number(document.getElementById('cc-deductionPercent').value)||0;
    const setupFee = Number(document.getElementById('cc-setupFee').value)||0;
    const withholding = Number(document.getElementById('cc-withholding').value)||0;
    const deductionAmount = approvedAmount * (deductionPercent/100);
    document.getElementById('cc-deductionAmount-display').textContent = money(deductionAmount);
    document.querySelectorAll('.cc-percent-btn').forEach(btn=>{
      const active = Number(btn.dataset.percent)===deductionPercent;
      btn.style.background = active ? 'var(--navy)' : '#fff';
      btn.style.color = active ? '#fff' : 'var(--ink)';
      btn.style.borderColor = active ? 'var(--navy)' : 'var(--border)';
    });
    const specialOn = document.getElementById('cc-special').checked;
    const specialFee = specialOn ? (Number(document.getElementById('cc-specialFee').value)||0) : 0;
    const disbursement = Number(document.getElementById('cc-disbursement').value)||0;
    const afterCost = approvedAmount - deductionAmount - setupFee - withholding - specialFee - disbursement;
    document.getElementById('cc-afterCost-display').textContent = money(afterCost);

    const bbEnabled = document.getElementById('cc-bb-enabled').checked;
    const ctEnabled = document.getElementById('cc-ct-enabled').checked;
    const hbEnabled = document.getElementById('cc-hb-enabled').checked;
    const bbInput = document.getElementById('cc-businessBonus');
    const ctInput = document.getElementById('cc-channelTake');
    const hbInput = document.getElementById('cc-huangBonus');
    if(bbEnabled && bbInput.dataset.touched!=='1') bbInput.value = Math.round(afterCost*0.4);
    if(ctEnabled && ctInput.dataset.touched!=='1') ctInput.value = Math.round(afterCost*0.4);
    if(hbEnabled && hbInput.dataset.touched!=='1') hbInput.value = Math.round(afterCost*0.5);

    const bb = bbEnabled ? (Number(bbInput.value)||0) : 0;
    const ct = ctEnabled ? (Number(ctInput.value)||0) : 0;
    const hb = hbEnabled ? (Number(hbInput.value)||0) : 0;
    document.getElementById('cc-companyProfit-display').textContent = money(afterCost - bb - ct - hb);
  }
  ['cc-approvedAmount','cc-deductionPercent','cc-setupFee','cc-withholding','cc-disbursement'].forEach(id=>document.getElementById(id).addEventListener('input', recalc));
  ['cc-businessBonus','cc-channelTake','cc-huangBonus'].forEach(id=>document.getElementById(id).addEventListener('input', function(){ this.dataset.touched='1'; recalc(); }));
  recalc();

  document.getElementById('channel-case-form').addEventListener('submit',(e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const approvedAmount = Number(document.getElementById('cc-approvedAmount').value)||0;
    const deductionPercent = Number(document.getElementById('cc-deductionPercent').value)||0;
    const setupFee = Number(document.getElementById('cc-setupFee').value)||0;
    const withholding = Number(document.getElementById('cc-withholding').value)||0;
    const deductionAmount = approvedAmount * (deductionPercent/100);
    const specialHandling = document.getElementById('cc-special').checked;
    const specialFee = specialHandling ? (Number(document.getElementById('cc-specialFee').value)||0) : 0;
    const disbursement = Number(document.getElementById('cc-disbursement').value)||0;
    const afterCost = approvedAmount - deductionAmount - setupFee - withholding - specialFee - disbursement;

    const businessBonusEnabled = document.getElementById('cc-bb-enabled').checked;
    const channelTakeEnabled = document.getElementById('cc-ct-enabled').checked;
    const huangBonusEnabled = document.getElementById('cc-hb-enabled').checked;
    const businessBonus = businessBonusEnabled ? (Number(document.getElementById('cc-businessBonus').value)||0) : 0;
    const channelTake = channelTakeEnabled ? (Number(document.getElementById('cc-channelTake').value)||0) : 0;
    const huangBonus = huangBonusEnabled ? (Number(document.getElementById('cc-huangBonus').value)||0) : 0;
    const companyProfit = afterCost - businessBonus - channelTake - huangBonus;

    const data = {
      date: fd.get('date'), customer: fd.get('customer'), plan: fd.get('plan'), staff: fd.get('staff'),
      source: fd.get('source'), referrer: fd.get('referrer'), profitPaid: fd.get('profitPaid')==='on',
      approvedAmount, deductionPercent, setupFee, deductionAmount, withholding, disbursement, afterCost,
      businessBonusEnabled, businessBonus, channelTakeEnabled, channelTake, huangBonusEnabled, huangBonus,
      companyProfit, note: fd.get('note'), specialHandling, specialFee
    };
    const wasPaidBefore = existing ? !!existing.profitPaid : false;
    const chCaseId = existing ? existing.id : uid();
    if(existing) Object.assign(existing, stamp(data));
    else APP.data.casesChannel.push(stamp({id:chCaseId, linkedTxId:null, profitTxId:null, ...data}));
    const chRec = existing || APP.data.casesChannel[APP.data.casesChannel.length-1];
    const totalPayout = businessBonus + channelTake + huangBonus;
    if(data.profitPaid && !wasPaidBefore && !chRec.profitTxId && totalPayout>0){
      postBonusPayoutToTransactions(chRec, totalPayout, `業務／通路獎金發放（${data.staff}／${data.customer}）`);
      chRec.profitTxId = chRec.bonusTxId; // reuse same tx-id field set by helper
    }
    if(businessBonus>0){
      saveBonusLedgerEntry(stamp({ id:'ch-'+chCaseId, staffName:data.staff, date:data.date, businessBonus, xiaojiangBonus:0, customer:data.customer }));
    } else {
      deleteBonusLedgerEntry('ch-'+chCaseId);
    }
    if(huangBonus>0){
      saveBonusLedgerEntry(stamp({ id:'huang-'+chCaseId, staffName:'煌', date:data.date, businessBonus:huangBonus, xiaojiangBonus:0, customer:data.customer }));
    } else {
      deleteBonusLedgerEntry('huang-'+chCaseId);
    }
    syncWizardHatLedger(chCaseId, data.date, data.customer, specialFee);
    saveCasesChannel(); closeModal();
  });
}

function postBonusPayoutToTransactions(caseRec, amount, noteText){
  if(!amount || amount<=0) return;
  const tx = stamp({ id:uid(), date:caseRec.date, type:'expense', mainCategory:'佣金支出', subCategory:caseRec.plan||'',
    amount:Number(amount)||0, vendor:caseRec.staff||caseRec.referrer||'', note:noteText, pending:false });
  APP.data.transactions.push(tx);
  caseRec.bonusTxId = tx.id;
  saveTransactions();
}
function postAdCaseToTransactions(caseId){
  const c = APP.data.casesAd.find(x=>x.id===caseId);
  if(!c || c.linkedTxId) return;
  if(!APP.data.categories.income.find(cat=>cat.name==='案件利潤-廣告')){
    APP.data.categories.income.push({id:uid(), name:'案件利潤-廣告', subs:[]});
    saveCategories();
  }
  const tx = stamp({ id:uid(), date:c.date, type:'income', mainCategory:'案件利潤-廣告', subCategory:c.plan||'',
    amount:Number(c.companyProfit)||0, vendor:c.customer||'', note:`案件公司利潤自動轉入（業務:${c.staff||''}）`, pending:false });
  APP.data.transactions.push(tx);
  c.linkedTxId = tx.id;
  saveTransactions(); saveCasesAd();
}
function postChannelCaseToTransactions(caseId){
  const c = APP.data.casesChannel.find(x=>x.id===caseId);
  if(!c || c.linkedTxId) return;
  if(!APP.data.categories.income.find(cat=>cat.name==='案件利潤-通路')){
    APP.data.categories.income.push({id:uid(), name:'案件利潤-通路', subs:[]});
    saveCategories();
  }
  const tx = stamp({ id:uid(), date:c.date, type:'income', mainCategory:'案件利潤-通路', subCategory:c.plan||'',
    amount:Number(c.companyProfit)||0, vendor:c.customer||'', note:`案件公司利潤自動轉入（業務:${c.staff||''}${c.referrer?'／通路:'+c.referrer:''}）`, pending:false });
  APP.data.transactions.push(tx);
  c.linkedTxId = tx.id;
  saveTransactions(); saveCasesChannel();
}

    };
    if(existing) Object.assign(existing, stamp(data));
    else APP.data.transactions.push(stamp({id:uid(), ...data}));
    saveTransactions(); closeModal();
  });
}

function buildFinanceContext(){
  const year = nowYear;
  const txThis = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year));
  const txLast = APP.data.transactions.filter(t=>t.date && t.date.slice(0,4)===String(year-1));

  const incLast = sum(txLast.filter(t=>t.type==='income'));
  const expLast = sum(txLast.filter(t=>t.type==='expense'));

  function catSummary(list, type){
    const map={};
    list.filter(t=>t.type===type).forEach(t=>{ map[t.mainCategory]=(map[t.mainCategory]||0)+Number(t.amount||0); });
    const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${money(v)}`);

  const recent = APP.data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25)

  /* ---- 案件分潤參數 ---- */

  const settingsSummary = `業務獎金比例:${(cs.businessBonusRate*100).toFixed(1)}%；${cs.xiaojiangName||'小江'}獎金比例：門檻內(當月前${cs.xiaojiangThreshold}件) ${(cs.xiaojiangRateBelow*100).toFixed(1)}%，門檻外 ${(cs.xiaojiangRateAbove*100).toFixed(1)}%；廣告投手月獎金比例:${(cs.pilotBonusRate*100).toFixed(1)}%（每月5號發放）；送件方案選項:${(cs.planOptions||[]).join('、')}；業務清單:${(cs.staffOptions||[]).join('、')}`;

  /* ---- 本月出勤請假 ---- */
  const attendanceThis = APP.data.attendance.filter(a=>monthKey(a.date)===nowMonthKey);
  const attendanceLines = attendanceThis.slice().sort((a,b)=>b.date.localeCompare(a.date))
    .map(a=>`${a.date} ${a.staffName||'未填'} ${a.leaveType||'請假'}${a.note?(' 備註:'+a.note):''}`).join('\n');

  /* ---- 本月個人業務進度紀錄摘要（全公司，不含客戶詳細資料大段文字，避免資料過長） ---- */

  const pendingCount = allProgThis.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status)).length;
  const closedCount = allProgThis.filter(c=>STATUS_CLOSED.includes(c.status)).length;

  const activeCases = allProgThis.filter(c=>!STATUS_DONE.includes(c.status) && !STATUS_CLOSED.includes(c.status))

  const casesAdThis = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const casesAdLines = casesAdThis.map(c=>`${c.date} ${c.customer||'未填'} 業務:${c.staff||'未填'} 方案:${c.plan||'未填'} 扣除成本後:${money(c.afterCost)} 業務獎金:${money(c.businessBonus)} ${cs.xiaojiangName||'小江'}獎金:${money(c.xiaojiangBonus)} 公司利潤:${money(c.companyProfit)} 獎金${c.bonusPaid?'已發放':'未發放'}${c.specialHandling?` 特殊處理費:${money(c.specialFee)}(${c.specialFeePaid?'已入帳':'未入帳'})`:''}`).join('\n');
  const casesChannelThis = APP.data.casesChannel.filter(c=>monthKey(c.date)===nowMonthKey).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const casesChannelLines = casesChannelThis.map(c=>`${c.date} ${c.customer||'未填'} 業務:${c.staff||'未填'} 來源:${c.source||'未填'}${c.referrer?('('+c.referrer+')'):''} 扣除成本後:${money(c.afterCost)} 業務獎金:${money(channelCaseBusinessBonus(c))} 通路實拿:${money(channelCaseChannelTake(c))} 煌獎金:${money(channelCaseHuangBonus(c))} 公司利潤:${money(c.companyProfit)} 利潤${c.profitPaid?'已發放':'未發放'}`).join('\n');

  /* ---- 本月業務利潤排行 ---- */
  const profitByStaff = {};
  APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey).forEach(c=>{ const k=c.staff||'未填'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  APP.data.casesChannel.filter(c=>monthKey(c.date)===nowMonthKey).forEach(c=>{ const k=c.staff||'未填'; profitByStaff[k]=(profitByStaff[k]||0)+(Number(c.companyProfit)||0); });
  const rankingLines = Object.entries(profitByStaff).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${money(v)}`).join('、');

  /* ---- 本月獎金發放狀況 ---- */
  const unpaidBonus = APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey && !c.bonusPaid);
  const unpaidTotal = sum(unpaidBonus.map(c=>({amount:(Number(c.businessBonus)||0)+(Number(c.xiaojiangBonus)||0)})));
  const paidBonusTotal = sum(APP.data.casesAd.filter(c=>monthKey(c.date)===nowMonthKey && c.bonusPaid).map(c=>({amount:(Number(c.businessBonus)||0)+(Number(c.xiaojiangBonus)||0)})));

  /* ---- 廣告投放成效（近4個月） ---- */
  const adSpendSorted = APP.data.adSpend.slice().sort((a,b)=>b.month.localeCompare(a.month)).slice(0,4);
  const adSpendLines = adSpendSorted.map(a=>{
    const adCasesInMonth = APP.data.casesAd.filter(c=>monthKey(c.date)===a.month);

    const adRevenue = sum(adCasesInMonth.map(c=>({amount:c.companyProfit})));
    const chProfit = sum(chCasesInMonth.map(c=>({amount:c.companyProfit})));
    const spend = Number(a.spend||0);
    const fixedCostThisMonth = computeFixedCost(a.month);
    const adTotalNet = adRevenue - fixedCostThisMonth - spend;
    const roi = spend===0?0:((adRevenue-spend)-spend)/spend;
    const cpc = a.messages? spend/Number(a.messages) : 0;
    const cpa = a.approved? spend/Number(a.approved) : 0;
    const approveRate = a.submitted? Number(a.approved||0)/Number(a.submitted) : 0;
    return `${a.month}：投放金額 ${money(spend)}，私訊數 ${a.messages||0}，送件數 ${a.submitted||0}，核准數 ${a.approved||0}，核准率 ${(approveRate*100).toFixed(1)}%，CPC ${cpc?money(cpc):'—'}，CPA ${cpa?money(cpa):'—'}，ROI ${(roi*100).toFixed(1)}%，廣告線案件利潤 ${money(adRevenue)}，固定成本(房租+薪資) ${money(fixedCostThisMonth)}，廣告總淨利 ${money(adTotalNet)}，通路線利潤 ${money(chProfit)}`;
  }).join('\n');

  return `公司：${APP.data.company.name || '（未設定）'}

${recent || '無'}

function renderChat(){
  const panel = document.getElementById('ai-chat-panel');
  const box = document.getElementById('ai-chat-messages');
  if(!panel || !box) return;
  panel.classList.toggle('hidden', !APP.chatOpen);
  if(APP.chatMessages.length===0 && !APP.chatLoading){
    box.innerHTML = isCore()
      ? `<div class="ai-chat-empty">可以問財務、案件進度、業務排行、廣告投放成效（例如「這個月 ROI 怎麼樣」「哪個業務貢獻最多」），也可以請它給建議，或直接說要記一筆帳（例如「幫我記一筆 8/15 廣告費 1200」）。</div>`
      : isStaffSales()
        ? `<div class="ai-chat-empty">可以問你自己的案件進度、獎金、行程，也可以直接說要記一筆客戶開發記錄（例如「幫我記一筆，陳小姐 0912345678，在談和潤，客戶還在考慮」），AI 會幫你整理成一筆個人業務進度紀錄，確認後才會真的存進去。它只看得到你自己的資料。</div>`
        : `<div class="ai-chat-empty">可以問案件進度、獎金發放狀況，也可以直接說要登記一筆正式案件（例如「幫我新增一筆，王先生 0987654321，JET方案，指派給秉，狀態教照會」），AI 會幫你整理成一筆進度追蹤紀錄，確認後才會真的存進去。它只看得到進度追蹤資料，看不到財務數字。</div>`;
  } else {
    box.innerHTML = APP.chatMessages.map((m,i)=>{
      if(m.role==='user') return `<div class="ai-msg user">${escHtml(m.text)}</div>`;
      let inner = `<div class="ai-msg ai">${escHtml(m.text)}`;
      if(m.pendingTx && m.pendingTx.length>0 && !m.confirmed){
        const kind = m.pendingKind || 'tx';
        const rowBuilder = kind==='personallog' ? buildPersonalLogRowHtml : kind==='progresstrack' ? buildProgressTrackRowHtml
          : kind==='attendance' ? buildAttendanceRowHtml : kind==='calendar' ? buildCalendarRowHtml
          : kind==='vendor' ? buildVendorRowHtml : kind==='employee' ? buildEmployeeRowHtml : buildTxRowHtml;
        inner += `<div id="chat-pending-${i}" style="margin-top:10px;background:#fff;border-radius:8px;padding:8px;" data-kind="${kind}">
          ${m.pendingTx.map((r,j)=>rowBuilder(r,j)).join('')}
          <button type="button" class="btn primary sm" style="margin-top:6px;width:100%;" data-action="chat-tx-confirm" data-msgidx="${i}">確認新增選取的紀錄</button>
        </div>`;
      } else if(m.confirmed){
        inner += `<div style="margin-top:6px;color:var(--green);font-size:12px;">✓ 已新增 ${m.confirmedCount} 筆紀錄</div>`;
        if(m.confirmError){
          inner += `<div style="margin-top:4px;color:var(--red);font-size:12px;">⚠ ${escHtml(m.confirmError)}</div>`;
        }
      }
      inner += `</div>`;
      return inner;
    }).join('') + (APP.chatLoading ? `<div class="ai-msg loading">AI 思考中…</div>` : '');
  }
  box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(question){
  APP.chatMessages.push({role:'user', text:question});
  APP.chatLoading = true;
  renderChat();
  try{
    const ctx = isCore() ? buildFinanceContext() : buildStaffContext();
    const resp = await fetch(AI_WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        question, context: ctx, today: todayStr(),
        role: APP.role,
        categories: isCore() ? { expense: APP.data.categories.expense.map(c=>c.name), income: APP.data.categories.income.map(c=>c.name) } : { expense:[], income:[] },
        caseOptions: { plan: APP.data.caseSettings.planOptions, staff: APP.data.caseSettings.staffOptions, dealProduct: DEAL_PRODUCT_OPTIONS, contactStatus: CONTACT_STATUS_OPTIONS, status: STATUS_OPTIONS }
      })
    });
    const data = await resp.json();
    let text = data.answer || data.error || '沒有取得回應，請再試一次。';
    let rows = null;
    let pendingKind = 'tx';
    const TAG_MAP_CORE = [['transactions','tx'],['progresstrack','progresstrack'],['attendance','attendance'],['calendar','calendar'],['vendor','vendor']];
    const TAG_MAP_STAFFSALES = [['personallog','personallog'],['attendance','attendance'],['calendar','calendar']];
    const TAG_MAP_STAFFADMIN = [['progresstrack','progresstrack'],['attendance','attendance'],['calendar','calendar']];
    const tagMap = isCore() ? TAG_MAP_CORE : isStaffSales() ? TAG_MAP_STAFFSALES : isStaffAdmin() ? TAG_MAP_STAFFADMIN : [];
    for(const [tag, kind] of tagMap){
      const re = new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`, 'i');
      const match = text.match(re);
      if(match){
        try{ rows = JSON.parse(match[1].trim()); }catch(e){ rows = null; }
        text = text.replace(match[0], '').trim();
        pendingKind = kind;
        break;
      }
    }
    APP.chatMessages.push({ role:'ai', text, pendingTx: (rows && Array.isArray(rows) && rows.length>0) ? rows : null, pendingKind });
  }catch(e){
    APP.chatMessages.push({role:'ai', text:'連線失敗，請確認網路連線後再試一次。'});
  }
  APP.chatLoading = false;
  renderChat();
}

            targetUid = effectiveUid();
          }
          if(!data.date || !data.title){ skipped++; return; }
          savePromises.push(saveCalendarEntry(stamp({ id:uid(), staffUid:targetUid, date:data.date, title:data.title, note:data.note||'' })));
        } else if(kind==='vendor'){
          if(!data.name){ skipped++; return; }
          APP.data.vendors.push(stamp({ id:uid(), name:data.name, contact:data.contact||'', phone:data.phone||'', taxId:'', note:data.note||'' }));
          savePromises.push(saveVendors());
        } else if(kind==='employee'){
          if(!data.name){ skipped++; return; }
          APP.data.hr.employees.push(stamp({ id:uid(), name:data.name, title:data.title||'', salary:Number(data.salary)||0, startDate:data.startDate||todayStr(), status:'active' }));
          savePromises.push(saveHR());
        }
      });
      Promise.allSettled(savePromises).then(results=>{
        const succeeded = results.filter(r=>r.status==='fulfilled').length;
        const failed = results.filter(r=>r.status==='rejected');
        APP.chatMessages[msgIdx].confirmed = true;
        APP.chatMessages[msgIdx].confirmedCount = succeeded;
        if(failed.length>0){
          const reason = failed[0].reason ? (failed[0].reason.message || String(failed[0].reason)) : '未知錯誤';
          APP.chatMessages[msgIdx].confirmError = `有 ${failed.length} 筆存檔失敗（原因：${reason}），請確認你有這個操作的權限，或稍後再試一次。`;
        } else if(succeeded===0 && skipped>0){
          APP.chatMessages[msgIdx].confirmError = '沒有任何一筆資料完整到能存檔（例如缺少客戶姓名），請檢查欄位內容。';
        }
        renderChat();
      });
    }
    return;
  }
  if(e.target.id==='logout-btn' || e.target.id==='pending-logout'){ signOut(auth); return; }
  if(e.target.id==='appearance-logo-reset'){
    APP.data.companyPublic = { ...APP.data.companyPublic, logoDataUrl:'' };
    APP._pendingLogoDataUrl = undefined;
    saveCompanyPublic(APP.data.companyPublic);
    updateFavicon();
    renderRoot();
    return;
  }
  if(e.target.id==='forgot-link'){
    const emailInput = document.querySelector('#login-form input[name="email"]');
    const email = emailInput ? emailInput.value.trim() : '';
    if(!email){ APP.authError='請先在上方輸入你的電子郵件，再點一次「忘記密碼」'; renderRoot(); return; }
    sendPasswordResetEmail(auth, email).then(()=>{
      APP.authError=''; APP.authMsg='已寄出密碼重設信，請至信箱查收'; renderRoot();
    }).catch(err=>{ APP.authMsg=''; APP.authError='寄送失敗：'+err.message; renderRoot(); });
    return;
  }
});

    } else {
      reader3.onload = (ev3)=>{
        APP._pendingXjReplyFiles[replyId] = { dataUrl: ev3.target.result, name: file3.name, type: file3.type||'application/octet-stream' };
        if(replyPreview) replyPreview.innerHTML = `<span style="font-size:12px;">📎 ${escHtml(file3.name)}</span>`;
      };
    }
    reader3.readAsDataURL(file3);
    return;
  }
});
let isImeComposing = false;
document.addEventListener('compositionstart', (e)=>{
  if(e.target.classList && (e.target.classList.contains('table-search-input')) || e.target.id==='tx-search' || e.target.id==='vendor-search'){
    isImeComposing = true;
  }
});
document.addEventListener('compositionend', (e)=>{
  isImeComposing = false;
  // 組字剛結束（例如注音選字完成），這時候瀏覽器通常還會再補發一次 input 事件，
  // 但為了保險起見這裡也主動觸發一次，確保搜尋結果一定會更新
  if(e.target.classList && e.target.classList.contains('table-search-input')){
    const stateKey = e.target.dataset.statekey;
    const focusVal = e.target.value;
    const cursorPos = e.target.selectionStart;
    APP[stateKey] = focusVal;
    render();
    const newEl = document.querySelector(`.table-search-input[data-statekey="${stateKey}"]`);
    if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
  } else if(e.target.id==='tx-search'){
    APP.txFilter.search = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('tx-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
  } else if(e.target.id==='vendor-search'){
    APP.vendorSearch = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('vendor-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
  }
});
document.addEventListener('input', (e)=>{
  if(e.target.classList && e.target.classList.contains('table-search-input')){
    if(isImeComposing) return; // 輸入法組字中（例如注音選字前），先不要重新渲染，避免打斷輸入
    const stateKey = e.target.dataset.statekey;
    const focusVal = e.target.value;
    const cursorPos = e.target.selectionStart;
    APP[stateKey] = focusVal;
    render();
    const newEl = document.querySelector(`.table-search-input[data-statekey="${stateKey}"]`);
    if(newEl){ newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
    return;
  }
  if(e.target.id==='tx-search'){
    if(isImeComposing) return;
    APP.txFilter.search = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('tx-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
    return;
  }
  if(e.target.id==='vendor-search'){
    if(isImeComposing) return;
    APP.vendorSearch = e.target.value;
    const focusVal = e.target.value;
    render();
    const input = document.getElementById('vendor-search');
    if(input){ input.focus(); input.value = focusVal; input.setSelectionRange(focusVal.length, focusVal.length); }
  }
});
document.addEventListener('submit', (e)=>{
  if(e.target.classList && e.target.classList.contains('xj-reply-form')){
    e.preventDefault();
    const replyId = e.target.dataset.id;
    const replyMessage = e.target.querySelector('[name="replyMessage"]').value.trim();
    const pendingFile = (APP._pendingXjReplyFiles || {})[replyId];
    if(!replyMessage && !pendingFile){ alert('請至少填寫回覆說明或上傳附件'); return; }
    const data = {
      replyMessage: replyMessage || '',
      replyFileDataUrl: pendingFile ? pendingFile.dataUrl : null,
      replyFileName: pendingFile ? pendingFile.name : null,
      replyFileType: pendingFile ? pendingFile.type : null,
      repliedAt: new Date().toISOString(), repliedBy: APP.userEmail || ''
    };
    saveXiaojiangReply(replyId, data).then(()=>{
      if(APP._pendingXjReplyFiles) delete APP._pendingXjReplyFiles[replyId];
      render();
    });
    return;
  }
  if(e.target.id==='xiaojiang-upload-form'){
    e.preventDefault();
    const messageInput = e.target.querySelector('[name="message"]');
    const message = messageInput.value.trim();
    if(!message){ return; }
    const attachments = (APP._pendingXjFiles || []).filter(Boolean);
    const totalSize = attachments.reduce((sum,a)=>sum+(a.dataUrl?a.dataUrl.length:0), 0);
    if(totalSize > 850*1024){
      alert('附件總大小超過限制，請減少檔案數量或選擇較小的檔案後再送出。');
      return;
    }
    const rec = stamp({
      id:uid(), staffUid:APP.user.uid, staffName:effectiveStaffName()||myStaffName(), staffEmail:APP.userEmail,
      message, attachments
    });
    saveXiaojiangUpload(rec).then(()=>{
      APP._pendingXjFiles = [];
      closeModal();
    });
    return;
  }
  if(e.target.id==='ai-chat-form'){
    e.preventDefault();
    const input = document.getElementById('ai-chat-input');
    const q = input.value.trim();
    if(!q || APP.chatLoading) return;
    input.value = '';
    sendChatMessage(q);
    return;
  }
  if(e.target.id==='login-form'){
    e.preventDefault();
    const fd = new FormData(e.target);
    APP.authError=''; APP.authMsg='';
    signInWithEmailAndPassword(auth, fd.get('email'), fd.get('password')).catch(err=>{
      APP.authError = '登入失敗，請確認帳號密碼是否正確';
      renderRoot();
    });
    return;
  }
  if(e.target.id==='case-settings-form'){
    e.preventDefault();
    if(!isAdmin()) return;
    const fd = new FormData(e.target);
    const newXjName = (fd.get('xiaojiangName')||'小江').trim() || '小江';
    const conflictWithOption = APP.data.caseSettings.staffOptions.includes(newXjName);
    const conflictWithStaffAccount = APP.users.some(u=>(u.role==='staffAdmin'||u.role==='staffSales') && u.staffName===newXjName);
    if(conflictWithOption || conflictWithStaffAccount){
      alert(`「${newXjName}」跟現有的業務姓名／帳號重複了，這樣會導致小江的獎金資料被該業務的帳號讀取到，請換一個不會撞名的名字（例如加姓氏、或用「投手-小江」這種寫法）。`);
      return;
    }
    APP.data.caseSettings = {
      ...APP.data.caseSettings,
      businessBonusRate: (Number(fd.get('businessBonusRate'))||0)/100,
      xiaojiangThreshold: Number(fd.get('xiaojiangThreshold'))||0,
      xiaojiangRateBelow: (Number(fd.get('xiaojiangRateBelow'))||0)/100,
      xiaojiangRateAbove: (Number(fd.get('xiaojiangRateAbove'))||0)/100,
      pilotBonusRate: (Number(fd.get('pilotBonusRate'))||0)/100,
      xiaojiangName: newXjName
    };
    saveCaseSettings(); return;
  }
  if(e.target.id==='rank-settings-form'){
    e.preventDefault();
    if(!isAdmin()) return;
    const fd = new FormData(e.target);
    APP.data.caseSettings = {
      ...APP.data.caseSettings,
      rankBronze: Number(fd.get('rankBronze'))||0,
      rankSilver: Number(fd.get('rankSilver'))||0,
      rankGold: Number(fd.get('rankGold'))||0,
      rankDiamond: Number(fd.get('rankDiamond'))||0,
    };
    saveCaseSettings(); return;
  }
  if(e.target.id==='company-form'){
    e.preventDefault();
    const fd = new FormData(e.target);
    APP.data.company = { ...APP.data.company, name:fd.get('name'), taxId:fd.get('taxId'), phone:fd.get('phone'), address:fd.get('address') };
    saveCompany(); return;
  }
  if(e.target.id==='appearance-form'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const logoDataUrl = APP._pendingLogoDataUrl !== undefined ? APP._pendingLogoDataUrl : APP.data.companyPublic.logoDataUrl;
    APP.data.companyPublic = { ...APP.data.companyPublic, systemName:fd.get('systemName')||'', systemSubtitle:fd.get('systemSubtitle')||'', logoDataUrl };
    APP._pendingLogoDataUrl = undefined;
    saveCompanyPublic(APP.data.companyPublic);
    updateFavicon();
    renderRoot();
    return;
  }
  if(['asset-form','category-form','subcategory-form','employee-form','collab-form','history-form','vendor-form','case-option-form','adspend-form','export-year-form','personal-log-form','attendance-form','calendar-form','progress-ad-form','progress-channel-form','customer-detail-form'].includes(e.target.id)){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fd.forEach((v,k)=>{ data[k]=v; });
    if(modalOnSubmit) modalOnSubmit(data);
    closeModal();
  }
});
</script>
